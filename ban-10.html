<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#190b0b">
  <meta name="description" content="Một lời chúc rực lửa dành riêng cho bạn nhân ngày 20/10.">

  <title>gâu gâu · 20.10</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;

      --cream: #190b0b;
      --rose: #ff7a24;
      --deep-rose: #ff3d18;
      --brown: #fff0d4;
      --muted: #d7a18a;
      --paper: #24100d;
      --line: #ff6a3045;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 26px 18px;

      display: grid;
      place-items: center;

      position: relative;
      isolation: isolate;
      overflow-x: hidden;

      color: var(--brown);
      font-family: 'Be Vietnam Pro', sans-serif;

      background:
        radial-gradient(ellipse at 50% 78%, #ff4b1230 0%, transparent 34%),
        radial-gradient(ellipse at 12% 100%, #b5221238 0%, transparent 38%),
        radial-gradient(ellipse at 88% 100%, #ff6a1828 0%, transparent 34%),
        linear-gradient(180deg, #100b12 0%, #211016 42%, #35120d 75%, #120a0a 100%);
    }

    /* =========================
       KHUNG CẢNH NÚI LỬA
    ========================= */

    .fire-scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse at 50% 88%, #ff6a1b25 0%, transparent 35%),
        linear-gradient(180deg, transparent 55%, #17090870 100%);
    }

    /* Khói đỏ mờ phía sau */
    .smoke {
      position: absolute;
      bottom: 5%;
      width: 45vw;
      height: 42vh;
      border-radius: 50%;
      background: #7d211b30;
      filter: blur(45px);
      animation: smoke-rise 9s ease-in-out infinite alternate;
    }

    .smoke.left { left: -12%; }
    .smoke.right { right: -12%; animation-delay: -4s; }

    @keyframes smoke-rise {
      from { transform: translateY(12px) scale(.9); opacity: .35; }
      to { transform: translateY(-35px) scale(1.2); opacity: .75; }
    }

    /* Dãy núi tối ở chân màn hình */
    .mountains {
      position: absolute;
      left: -5%;
      bottom: -2px;
      width: 110%;
      height: 29vh;
      min-height: 150px;
      background: linear-gradient(180deg, #351619, #100b0d 82%);
      clip-path: polygon(
        0 65%, 8% 44%, 15% 58%, 25% 24%, 32% 49%,
        41% 36%, 49% 62%, 59% 18%, 67% 47%, 76% 31%,
        84% 56%, 93% 37%, 100% 58%, 100% 100%, 0 100%
      );
      filter: drop-shadow(0 -8px 18px #ff3b1230);
    }

    /* Núi lửa chính, nhìn từ xa */
    .volcano {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: min(76vw, 650px);
      height: 35vh;
      min-height: 190px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #51201b 0%, #291114 68%, #100b0d 100%);
      clip-path: polygon(0 100%, 18% 68%, 31% 39%, 39% 20%, 45% 23%, 50% 15%, 55% 23%, 62% 31%, 72% 68%, 100% 100%);
      filter: drop-shadow(0 -8px 18px #ff451c50);
    }

    .lava-river {
      position: absolute;
      left: 50%;
      bottom: 12%;
      width: 5px;
      height: 24vh;
      transform: translateX(-50%) rotate(3deg);
      background: linear-gradient(180deg, #fff1a0, #ff681b 40%, #bd2411 100%);
      box-shadow: 0 0 10px #ff5a1c, 0 0 25px #ff3a13;
      opacity: .8;
      clip-path: polygon(35% 0, 100% 0, 65% 35%, 100% 60%, 45% 100%, 0 100%, 32% 58%, 0 35%);
    }

    /* Các luồng dung nham bắn lên */
    .lava-spark {
      position: absolute;
      left: var(--left);
      bottom: var(--bottom);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: radial-gradient(circle, #fff7b0 0%, #ff9d28 35%, #f33b12 72%, transparent 100%);
      box-shadow: 0 0 8px #ff5a1b, 0 0 18px #ff3a13;
      opacity: 0;
      animation: lava-pop var(--duration) ease-out var(--delay) infinite;
      will-change: transform, opacity;
    }

    @keyframes lava-pop {
      0% { opacity: 0; transform: translate3d(0, 0, 0) scale(.4); }
      10% { opacity: 1; }
      70% { opacity: .9; }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), var(--height), 0) scale(.1);
      }
    }

    /* Dải lửa liền mạch chạy dọc toàn bộ chân màn hình */
    .fire-base {
      position: absolute;
      left: -3%;
      bottom: -2px;
      width: 106%;
      height: clamp(100px, 22vh, 230px);
      background: linear-gradient(0deg, #9d1609 0%, #f02c0b 27%, #ff7218 58%, #ffc64b 82%, #ffed9a 100%);
      clip-path: polygon(0 40%, 3% 30%, 5% 47%, 8% 16%, 10% 42%, 13% 28%, 16% 51%, 19% 19%, 22% 44%, 25% 31%, 28% 55%, 31% 22%, 34% 46%, 37% 13%, 40% 44%, 43% 26%, 46% 51%, 49% 17%, 52% 45%, 55% 24%, 58% 49%, 61% 14%, 64% 43%, 67% 27%, 70% 53%, 73% 18%, 76% 44%, 79% 25%, 82% 50%, 85% 15%, 88% 42%, 91% 28%, 94% 49%, 97% 20%, 100% 39%, 100% 100%, 0 100%);
      filter: blur(2px) drop-shadow(0 0 18px #ff3b12);
      opacity: .92;
      transform-origin: 50% 100%;
      animation: fire-base-dance 1.2s ease-in-out infinite alternate;
    }

    .fire-base::before {
      content: "";
      position: absolute;
      inset: 18% 0 0;
      background: linear-gradient(0deg, #d21b08, #ff4a0b 58%, #ffb52b 90%, transparent);
      filter: blur(9px);
    }

    @keyframes fire-base-dance {
      from { transform: scaleY(.94) skewX(-.5deg); }
      to { transform: scaleY(1.06) skewX(.5deg); }
    }

    /* Những lưỡi lửa chồng lên dải lửa chung, tạo cảm giác hòa làm một */
    .flame {
      position: absolute;
      bottom: -8px;
      left: var(--left);
      width: var(--width);
      height: var(--height);
      transform-origin: 50% 100%;
      border-radius: 55% 45% 35% 65% / 70% 70% 30% 30%;
      background: linear-gradient(0deg, #ff2d0d 0%, #ff6b17 42%, #ffd45b 76%, #fff2ba 100%);
      filter: drop-shadow(0 0 12px #ff4a12);
      opacity: var(--opacity);
      animation: flame-dance var(--duration) ease-in-out var(--delay) infinite alternate;
      will-change: transform, opacity;
    }

    .flame::before {
      content: "";
      position: absolute;
      left: 23%;
      bottom: 0;
      width: 54%;
      height: 76%;
      border-radius: 50% 50% 35% 35%;
      background: linear-gradient(0deg, #ffb51e, #fff1a0 80%, #fff8d8);
      filter: blur(1px);
    }

    @keyframes flame-dance {
      0% { transform: rotate(-7deg) scaleX(.82) scaleY(.92); }
      35% { transform: rotate(5deg) scaleX(1.08) scaleY(1.13); }
      70% { transform: rotate(-3deg) scaleX(.92) scaleY(.98); }
      100% { transform: rotate(8deg) scaleX(1.12) scaleY(1.2); }
    }

    /* Tàn lửa bay ngang và bay lên */
    .ember {
      position: absolute;
      left: var(--left);
      bottom: -10px;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: #ffd36b;
      box-shadow: 0 0 6px #ff751c, 0 0 14px #ff4514;
      opacity: 0;
      animation: ember-rise var(--duration) linear var(--delay) infinite;
      will-change: transform, opacity;
    }

    @keyframes ember-rise {
      0% { opacity: 0; transform: translate3d(0, 0, 0) scale(.5); }
      12% { opacity: var(--opacity); }
      75% { opacity: var(--opacity); }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), var(--height), 0) scale(.1);
      }
    }

    /* Nhân vật hoạt hình có lửa bốc trên đầu */
    .fire-character {
      position: fixed;
      z-index: 2;
      right: clamp(12px, 4vw, 42px);
      bottom: clamp(12px, 3vh, 28px);
      width: 76px;
      height: 104px;
      pointer-events: none;
      filter: drop-shadow(0 0 10px #ff481c70);
      animation: character-bob 2.4s ease-in-out infinite;
    }

    .character-flame {
      position: absolute;
      left: 24px;
      top: 0;
      width: 28px;
      height: 42px;
      border-radius: 55% 45% 45% 55% / 70% 70% 30% 30%;
      background: linear-gradient(0deg, #ff2c0b 5%, #ff7818 48%, #ffe16a 82%, #fff5cb 100%);
      transform-origin: 50% 100%;
      animation: head-fire .28s ease-in-out infinite alternate;
      box-shadow: 0 0 12px #ff4a12, 0 0 22px #ff771b80;
    }

    .character-flame::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 12px;
      width: 13px;
      height: 25px;
      border-radius: 60% 40% 50% 50%;
      background: linear-gradient(0deg, #ffb51f, #fff6b2);
    }

    .character-head {
      position: absolute;
      top: 31px;
      left: 17px;
      width: 43px;
      height: 39px;
      border: 2px solid #ffb15d;
      border-radius: 46% 46% 43% 43%;
      background: linear-gradient(145deg, #ffb15d, #f16b36);
      box-shadow: inset -5px -4px 0 #d94727;
    }

    .character-head::before,
    .character-head::after {
      content: "";
      position: absolute;
      top: 13px;
      width: 5px;
      height: 7px;
      border-radius: 50%;
      background: #421a16;
    }

    .character-head::before { left: 9px; }
    .character-head::after { right: 9px; }

    .character-mouth {
      position: absolute;
      left: 30px;
      top: 53px;
      width: 15px;
      height: 8px;
      border-bottom: 2px solid #682018;
      border-radius: 50%;
    }

    .character-body {
      position: absolute;
      top: 68px;
      left: 23px;
      width: 32px;
      height: 27px;
      border-radius: 12px 12px 7px 7px;
      background: linear-gradient(90deg, #c8321b, #ff8a32, #e34520);
      border: 1px solid #ffb15d;
    }

    .character-body::before,
    .character-body::after {
      content: "";
      position: absolute;
      top: 6px;
      width: 9px;
      height: 21px;
      border-radius: 8px;
      background: #f47a32;
      border: 1px solid #ffb15d;
    }

    .character-body::before { left: -8px; transform: rotate(18deg); }
    .character-body::after { right: -8px; transform: rotate(-18deg); }

    @keyframes head-fire {
      from { transform: rotate(-8deg) scaleX(.88) scaleY(.94); }
      to { transform: rotate(9deg) scaleX(1.08) scaleY(1.12); }
    }

    @keyframes character-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @media (max-width: 480px) {
      .fire-character {
        right: 8px;
        bottom: 8px;
        transform: scale(.78);
        transform-origin: bottom right;
      }

      .mountains { height: 23vh; }
      .volcano { width: 100vw; height: 28vh; }
      .flame { opacity: calc(var(--opacity) * .9); }
      .fire-base { height: clamp(90px, 18vh, 180px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .smoke, .lava-spark, .flame, .ember,
      .character-flame, .fire-character {
        animation: none;
      }
    }

    /* =========================
       BỐ CỤC CHÍNH
    ========================= */

    .wrap {
      position: relative;
      z-index: 1;

      width: min(100%, 560px);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 12px;

      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .top span:last-child {
      letter-spacing: .12em;
    }

    /* =========================
       KHUNG THƯ
    ========================= */

    .card {
      position: relative;

      width: 100%;
      margin: 22px auto 14px;
      padding: 30px 32px;

      background:
        linear-gradient(
          145deg,
          #291512f2,
          #1a0d0df2
        );

      border: 1px solid #ff6a3060;
      border-radius: 5px;

      box-shadow:
        0 18px 55px #00000050,
        0 0 35px #ff4b1220;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      animation: card-glow 5s ease-in-out infinite alternate;
    }

    .card::before {
      content: '';

      position: absolute;
      inset: 8px;

      border: 1px solid #ff6a3030;

      pointer-events: none;
    }

    @keyframes card-glow {
      0% {
        box-shadow:
          0 18px 55px #a63d5018,
          0 0 18px #e8a2b308;

        border-color: #dca1ad50;
      }

      50% {
        box-shadow:
          0 18px 55px #a63d5022,
          0 0 30px #e8a2b320;

        border-color: #d58b9a90;
      }

      100% {
        box-shadow:
          0 18px 55px #a63d5025,
          0 0 45px #e8a2b325;

        border-color: #d58b9ac0;
      }
    }

    /* =========================
       TIÊU ĐỀ
    ========================= */

    .eyebrow {
      margin: 0 0 18px;

      text-align: center;

      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;

      color: var(--deep-rose);
    }

    .flower {
      margin-bottom: 6px;

      text-align: center;
      font-size: 25px;

      color: var(--rose);

      filter: drop-shadow(0 3px 8px #ff5a3040);
    }

    h1 {
      margin: 0 0 12px;

      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 7vw, 56px);

      font-weight: 500;
      line-height: 1;

      text-align: center;
    }

    h1 em {
      color: var(--deep-rose);
      font-weight: 600;
      text-shadow: 0 0 25px #c83b5518;
    }

    .intro {
      max-width: 430px;
      margin: 0 auto 30px;

      text-align: center;

      font-size: 13px;
      line-height: 1.9;

      color: var(--muted);
    }

    /* =========================
       ĐƯỜNG PHÂN CÁCH
    ========================= */

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;
      margin: 14px 0;

      color: var(--rose);
    }

    .divider::before,
    .divider::after {
      content: '';

      width: 42px;
      height: 1px;

      background: var(--line);
    }

    /* =========================
       LỜI CHÚC
    ========================= */

    .letter {
      min-height: 120px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 4px 2px;

      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      line-height: 1.65;

      text-align: center;
      overflow-wrap: anywhere;
    }

    .letter p {
      width: 100%;
      margin: 0;

      white-space: normal;
    }

    #sentence-text {
      opacity: 1;
      overflow-wrap: anywhere;
    }

    #sentence-text span {
      display: inline;

      opacity: 0;
      filter: blur(3px);

      animation: letter-appear .28s ease-out forwards;
      animation-delay: var(--delay);
    }

    @keyframes letter-appear {
      from {
        opacity: 0;
        filter: blur(3px);
      }

      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    /* =========================
       NÚT CHUYỂN CÂU
    ========================= */

    .letter-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
      margin-top: 14px;
    }

    .letter-nav button {
      padding: 9px 12px;

      border: 1px solid #dca1ad90;
      border-radius: 3px;

      background: #ff6a300d;
      color: var(--brown);

      font: 11px 'Be Vietnam Pro', sans-serif;

      cursor: pointer;

      transition:
        background .25s ease,
        border-color .25s ease,
        color .25s ease,
        opacity .25s ease;
    }

    .letter-nav button:hover:not(:disabled) {
      background: #ff6a3025;
      border-color: var(--rose);
      color: var(--deep-rose);
    }

    .letter-nav button:disabled {
      opacity: .3;
      cursor: default;
    }

    #sentence-count {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    /* =========================
       CHỮ KÝ
    ========================= */

    .sign {
      margin-top: 26px;

      text-align: right;

      color: var(--deep-rose);

      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-style: italic;
    }

    .back {
      display: block;

      margin: 17px auto 0;

      text-align: center;
      text-decoration: none;

      color: var(--muted);

      font-size: 11px;
      letter-spacing: .04em;

      transition: color .25s ease;
    }

    .back:hover {
      color: var(--deep-rose);
    }

    footer {
      text-align: center;

      color: #d59a76;

      font-size: 10px;
      letter-spacing: .08em;
    }

    footer .heart {
      color: var(--deep-rose);
    }

    /* =========================
       TƯƠNG THÍCH ĐIỆN THOẠI
    ========================= */

    @media (max-width: 480px) {
      body {
        padding: 14px 12px;
      }

      .wrap {
        width: 100%;
      }

      .card {
        margin: 12px auto;
        padding: 24px 20px;
      }

      .letter {
        min-height: 125px;
        font-size: 20px;
      }

      .letter-nav {
        gap: 6px;
      }

      .letter-nav button {
        padding: 9px 8px;
        font-size: 10px;
      }

      .rose {
        filter: drop-shadow(0 2px 3px #b83a5020);
      }
    }

    /* =========================
       GIẢM CHUYỂN ĐỘNG
    ========================= */

    @media (prefers-reduced-motion: reduce) {
      .card {
        animation: none;
      }

      .rose-rain .rose,
      .rose-rain .petal {
        animation: none;
        display: none;
      }

      #sentence-text span {
        animation: none;
        opacity: 1;
        filter: none;
      }
    }
  </style>
</head>

<body>

  <!-- MÀN HÌNH MƯA HOA HỒNG -->
  <div class="fire-scene" id="fire-scene" aria-hidden="true">
    <div class="smoke left"></div>
    <div class="smoke right"></div>
    <div class="mountains"></div>
    <div class="volcano"></div>
    <div class="lava-river"></div>
    <div class="fire-base"></div>
  </div>

  <div class="fire-character" aria-hidden="true">
    <div class="character-flame"></div>
    <div class="character-head"></div>
    <div class="character-mouth"></div>
    <div class="character-body"></div>
  </div>

  <main class="wrap">

    <header class="top">
      <span>20 · 10 · 2026</span>
    </header>

    <article class="card">

      <div class="flower" aria-hidden="true">
        ❀
      </div>

      <h1>
        <em>gâu gâu</em>
      </h1>

      <div class="divider" aria-hidden="true">
        ♡
      </div>

      <section
        class="letter"
        aria-label="Lời chúc"
      >
        <p
          id="sentence-text"
          aria-live="polite"
          aria-atomic="true"
        >
          Chào Phương nha, thời gian để bọn mình học cùng một mái trường đã không con lâu nữa.
        </p>
      </section>

      <div class="letter-nav">

        <button
          id="prev-btn"
          type="button"
          disabled
        >
          ← Câu trước
        </button>

        <span id="sentence-count">
          1 / 6
        </span>

        <button
          id="next-btn"
          type="button"
        >
          Câu tiếp theo →
        </button>

      </div>

      <a
        class="back"
        href="https://women12102010.github.io/women1210.github.io/"
      >
        ← Quay lại phong bì
      </a>

    </article>

    <footer>
      gâu gâu <span class="heart">🔥</span> gâu
    </footer>

  </main>

  <script>
    /* ==================================
       HIỆU ỨNG NÚI LỬA, LỬA VÀ TÀN LỬA
    ================================== */

    const fireScene = document.getElementById('fire-scene');
    const shouldReduceMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    // Tạo những ngọn lửa bập bùng ở hai bên chân màn hình.
    function createFlames() {
      const count = window.innerWidth < 480 ? 13 : 25;

      for (let i = 0; i < count; i++) {
        const flame = document.createElement('span');
        flame.className = 'flame';

        // Các lưỡi lửa trải đều và chồng lên nhau để nối thành một dải lửa.
        const left = (i / count) * 100 - random(1, 4);
        flame.style.setProperty('--left', `${left}%`);
        flame.style.setProperty('--width', `${random(38, 78)}px`);
        flame.style.setProperty('--height', `${random(65, 155)}px`);
        flame.style.setProperty('--duration', `${random(0.45, 1.1)}s`);
        flame.style.setProperty('--delay', `${random(-1.5, 0)}s`);
        flame.style.setProperty('--opacity', random(0.35, 0.85));

        fireScene.appendChild(flame);
      }
    }

    // Tàn lửa bay lên liên tục từ chân màn hình.
    function createEmbers() {
      const count = window.innerWidth < 480 ? 35 : 65;

      for (let i = 0; i < count; i++) {
        const ember = document.createElement('span');
        ember.className = 'ember';

        ember.style.setProperty('--left', `${random(0, 100)}%`);
        ember.style.setProperty('--size', `${random(2, 6)}px`);
        ember.style.setProperty('--duration', `${random(4, 10)}s`);
        ember.style.setProperty('--delay', `${-random(0, 10)}s`);
        ember.style.setProperty('--opacity', random(0.25, 0.85));
        ember.style.setProperty('--drift', `${random(-100, 100)}px`);
        ember.style.setProperty('--height', `-${random(35, 105)}vh`);

        fireScene.appendChild(ember);
      }
    }

    // Dung nham và tia lửa bắn lên từ miệng núi lửa.
    function createLavaSparks() {
      const count = window.innerWidth < 480 ? 20 : 35;

      for (let i = 0; i < count; i++) {
        const spark = document.createElement('span');
        spark.className = 'lava-spark';

        spark.style.setProperty('--left', `${random(40, 60)}%`);
        spark.style.setProperty('--bottom', `${random(24, 38)}%`);
        spark.style.setProperty('--size', `${random(3, 9)}px`);
        spark.style.setProperty('--duration', `${random(1.5, 3.8)}s`);
        spark.style.setProperty('--delay', `${-random(0, 4)}s`);
        spark.style.setProperty('--drift', `${random(-170, 170)}px`);
        spark.style.setProperty('--height', `-${random(18, 55)}vh`);

        fireScene.appendChild(spark);
      }
    }

    if (!shouldReduceMotion) {
      createFlames();
      createEmbers();
      createLavaSparks();
    }

    /* ==================================
       NỘI DUNG LỜI CHÚC
    ================================== */

    const sentences = [
      "Chào Phương nha, thời gian để bọn mình học cùng một mái trường đã không con lâu nữa.",

      "Nhân ngày 20/10, bọn con trai chúng mình mong rằng những ngày tháng phía trước của Phương sẽ luôn là tràn ngập niềm vui và những điều tốt đẹp.",

      "Chúc cậu luôn đủ dịu dàng để yêu thương cuộc sống, đủ mạnh mẽ để theo đuổi những điều mình mong muốn!"
    ];

    let currentSentence = 0;

    const sentenceText = document.getElementById('sentence-text');

    const prevBtn = document.getElementById('prev-btn');

    const nextBtn = document.getElementById('next-btn');

    const sentenceCount = document.getElementById('sentence-count');

    /* ==================================
       HIỆU ỨNG TỪNG CHỮ XUẤT HIỆN
    ================================== */

    function showSentence(index) {
      currentSentence = index;

      const text = sentences[currentSentence];

      sentenceText.replaceChildren();

      const shouldReduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      if (shouldReduceMotion) {
        sentenceText.textContent = text;
      } else {
        [...text].forEach((char, i) => {
          const span = document.createElement('span');

          span.textContent = char === ' ' ? '\u00A0' : char;

          span.style.setProperty(
            '--delay',
            `${i * 0.025}s`
          );

          sentenceText.appendChild(span);
        });
      }

      // Cập nhật số thứ tự câu
      sentenceCount.textContent =
        `${currentSentence + 1} / ${sentences.length}`;

      // Khóa nút khi ở đầu hoặc cuối thư
      prevBtn.disabled = currentSentence === 0;

      nextBtn.disabled =
        currentSentence === sentences.length - 1;
    }

    /* ==================================
       ĐIỀU KHIỂN CHUYỂN CÂU
    ================================== */

    prevBtn.addEventListener('click', () => {
      if (currentSentence > 0) {
        showSentence(currentSentence - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentSentence < sentences.length - 1) {
        showSentence(currentSentence + 1);
      }
    });

    // Hiển thị câu đầu tiên
    showSentence(0);
  </script>

</body>
</html>
