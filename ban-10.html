<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff5f5">
  <meta name="description" content="Một lời chúc nhỏ dành riêng cho bạn nhân ngày 20/10.">

  <title>gâu gâu · 20.10</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;

      --cream: #fff5f5;
      --rose: #c83b55;
      --deep-rose: #9f233f;
      --brown: #542632;
      --muted: #9e727b;
      --paper: #fffafa;
      --line: #dca1ad70;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 26px 18px;

      display: grid;
      place-items: center;

      position: relative;
      isolation: isolate;
      overflow-x: hidden;

      color: var(--brown);
      font-family: 'Be Vietnam Pro', sans-serif;

      background:
        radial-gradient(
          ellipse at 50% 0%,
          #ffe0e5 0%,
          transparent 48%
        ),
        radial-gradient(
          ellipse at 0% 100%,
          #f8dce2 0%,
          transparent 42%
        ),
        linear-gradient(
          150deg,
          #fffafa 0%,
          #fff0f2 50%,
          #fbe3e8 100%
        );
    }

    /* =========================
       MÀN MƯA HOA HỒNG
    ========================= */

    .rose-rain {
      position: fixed;
      inset: 0;

      overflow: hidden;
      pointer-events: none;

      z-index: 0;
    }

    .rose {
      position: absolute;
      top: -12vh;
      left: var(--left);

      display: block;

      font-size: var(--size);
      line-height: 1;

      opacity: 0;
      filter: drop-shadow(0 3px 5px #b83a5030);

      animation:
        rose-fall var(--duration) linear var(--delay) infinite;

      will-change: transform, opacity;
    }

    @keyframes rose-fall {
      0% {
        opacity: 0;
        transform:
          translate3d(0, -5vh, 0)
          rotate(0deg);
      }

      8% {
        opacity: var(--opacity);
      }

      25% {
        transform:
          translate3d(var(--sway1), 25vh, 0)
          rotate(100deg);
      }

      50% {
        transform:
          translate3d(var(--sway2), 55vh, 0)
          rotate(220deg);
      }

      75% {
        transform:
          translate3d(var(--sway3), 85vh, 0)
          rotate(320deg);
      }

      92% {
        opacity: var(--opacity);
      }

      100% {
        opacity: 0;

        transform:
          translate3d(var(--sway4), 115vh, 0)
          rotate(460deg);
      }
    }

    /* Cánh hoa hồng bay nhẹ */

    .petal {
      position: absolute;
      top: -30px;
      left: var(--left);

      width: var(--width);
      height: calc(var(--width) * 1.45);

      background:
        linear-gradient(
          145deg,
          #ffe4e8 0%,
          #f6a9b8 45%,
          #d94a67 100%
        );

      border-radius: 80% 10% 75% 20%;

      opacity: 0;
      box-shadow: 0 2px 5px #c83b5520;

      animation:
        petal-fall var(--duration) linear var(--delay) infinite;

      will-change: transform, opacity;
    }

    @keyframes petal-fall {
      0% {
        opacity: 0;
        transform:
          translate3d(0, -5vh, 0)
          rotate(0deg);
      }

      10% {
        opacity: var(--opacity);
      }

      30% {
        transform:
          translate3d(var(--sway1), 30vh, 0)
          rotate(150deg);
      }

      60% {
        transform:
          translate3d(var(--sway2), 65vh, 0)
          rotate(360deg);
      }

      90% {
        opacity: var(--opacity);
      }

      100% {
        opacity: 0;
        transform:
          translate3d(var(--sway3), 110vh, 0)
          rotate(650deg);
      }
    }

    /* =========================
       BỐ CỤC CHÍNH
    ========================= */

    .wrap {
      position: relative;
      z-index: 1;

      width: min(100%, 560px);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 12px;

      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .top span:last-child {
      letter-spacing: .12em;
    }

    /* =========================
       KHUNG THƯ
    ========================= */

    .card {
      position: relative;

      width: 100%;
      margin: 22px auto 14px;
      padding: 30px 32px;

      background:
        linear-gradient(
          145deg,
          #fffdfdf2,
          #fff7f8f2
        );

      border: 1px solid #dca1ad80;
      border-radius: 5px;

      box-shadow:
        0 18px 55px #a63d5020,
        0 0 35px #f0b7c520;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      animation: card-glow 5s ease-in-out infinite alternate;
    }

    .card::before {
      content: '';

      position: absolute;
      inset: 8px;

      border: 1px solid #dca1ad50;

      pointer-events: none;
    }

    @keyframes card-glow {
      0% {
        box-shadow:
          0 18px 55px #a63d5018,
          0 0 18px #e8a2b308;

        border-color: #dca1ad50;
      }

      50% {
        box-shadow:
          0 18px 55px #a63d5022,
          0 0 30px #e8a2b320;

        border-color: #d58b9a90;
      }

      100% {
        box-shadow:
          0 18px 55px #a63d5025,
          0 0 45px #e8a2b325;

        border-color: #d58b9ac0;
      }
    }

    /* =========================
       TIÊU ĐỀ
    ========================= */

    .eyebrow {
      margin: 0 0 18px;

      text-align: center;

      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;

      color: var(--deep-rose);
    }

    .flower {
      margin-bottom: 6px;

      text-align: center;
      font-size: 25px;

      color: var(--rose);

      filter: drop-shadow(0 3px 5px #c83b5530);
    }

    h1 {
      margin: 0 0 12px;

      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 7vw, 56px);

      font-weight: 500;
      line-height: 1;

      text-align: center;
    }

    h1 em {
      color: var(--deep-rose);
      font-weight: 600;
      text-shadow: 0 0 25px #c83b5518;
    }

    .intro {
      max-width: 430px;
      margin: 0 auto 30px;

      text-align: center;

      font-size: 13px;
      line-height: 1.9;

      color: var(--muted);
    }

    /* =========================
       ĐƯỜNG PHÂN CÁCH
    ========================= */

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;
      margin: 14px 0;

      color: var(--rose);
    }

    .divider::before,
    .divider::after {
      content: '';

      width: 42px;
      height: 1px;

      background: var(--line);
    }

    /* =========================
       LỜI CHÚC
    ========================= */

    .letter {
      min-height: 120px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 4px 2px;

      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      line-height: 1.65;

      text-align: center;
      overflow-wrap: anywhere;
    }

    .letter p {
      width: 100%;
      margin: 0;

      white-space: normal;
    }

    #sentence-text {
      opacity: 1;
      overflow-wrap: anywhere;
    }

    #sentence-text span {
      display: inline;

      opacity: 0;
      filter: blur(3px);

      animation: letter-appear .28s ease-out forwards;
      animation-delay: var(--delay);
    }

    @keyframes letter-appear {
      from {
        opacity: 0;
        filter: blur(3px);
      }

      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    /* =========================
       NÚT CHUYỂN CÂU
    ========================= */

    .letter-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
      margin-top: 14px;
    }

    .letter-nav button {
      padding: 9px 12px;

      border: 1px solid #dca1ad90;
      border-radius: 3px;

      background: #c83b5508;
      color: var(--brown);

      font: 11px 'Be Vietnam Pro', sans-serif;

      cursor: pointer;

      transition:
        background .25s ease,
        border-color .25s ease,
        color .25s ease,
        opacity .25s ease;
    }

    .letter-nav button:hover:not(:disabled) {
      background: #c83b5515;
      border-color: var(--rose);
      color: var(--deep-rose);
    }

    .letter-nav button:disabled {
      opacity: .3;
      cursor: default;
    }

    #sentence-count {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    /* =========================
       CHỮ KÝ
    ========================= */

    .sign {
      margin-top: 26px;

      text-align: right;

      color: var(--deep-rose);

      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-style: italic;
    }

    .back {
      display: block;

      margin: 17px auto 0;

      text-align: center;
      text-decoration: none;

      color: var(--muted);

      font-size: 11px;
      letter-spacing: .04em;

      transition: color .25s ease;
    }

    .back:hover {
      color: var(--deep-rose);
    }

    footer {
      text-align: center;

      color: #b48791;

      font-size: 10px;
      letter-spacing: .08em;
    }

    footer .heart {
      color: var(--deep-rose);
    }

    /* =========================
       TƯƠNG THÍCH ĐIỆN THOẠI
    ========================= */

    @media (max-width: 480px) {
      body {
        padding: 14px 12px;
      }

      .wrap {
        width: 100%;
      }

      .card {
        margin: 12px auto;
        padding: 24px 20px;
      }

      .letter {
        min-height: 125px;
        font-size: 20px;
      }

      .letter-nav {
        gap: 6px;
      }

      .letter-nav button {
        padding: 9px 8px;
        font-size: 10px;
      }

      .rose {
        filter: drop-shadow(0 2px 3px #b83a5020);
      }
    }

    /* =========================
       GIẢM CHUYỂN ĐỘNG
    ========================= */

    @media (prefers-reduced-motion: reduce) {
      .card {
        animation: none;
      }

      .rose-rain .rose,
      .rose-rain .petal {
        animation: none;
        display: none;
      }

      #sentence-text span {
        animation: none;
        opacity: 1;
        filter: none;
      }
    }
  </style>
</head>

<body>

  <!-- MÀN HÌNH MƯA HOA HỒNG -->
  <div
    class="rose-rain"
    id="rose-rain"
    aria-hidden="true"
  ></div>

  <main class="wrap">

    <header class="top">
      <span>20 · 10 · 2026</span>
      <span>♡ with love ♡</span>
    </header>

    <article class="card">

      <div class="flower" aria-hidden="true">
        ❀
      </div>

      <h1>
        <em>gâu gâu</em>
      </h1>

      <div class="divider" aria-hidden="true">
        ♡
      </div>

      <section
        class="letter"
        aria-label="Lời chúc"
      >
        <p
          id="sentence-text"
          aria-live="polite"
          aria-atomic="true"
        >
          Chào Phương nha, thời gian để bọn mình học cùng một mái trường đã không con lâu nữa.
        </p>
      </section>

      <div class="letter-nav">

        <button
          id="prev-btn"
          type="button"
          disabled
        >
          ← Câu trước
        </button>

        <span id="sentence-count">
          1 / 6
        </span>

        <button
          id="next-btn"
          type="button"
        >
          Câu tiếp theo →
        </button>

      </div>

      <a
        class="back"
        href="https://women12102010.github.io/women1210.github.io/"
      >
        ← Quay lại phong bì
      </a>

    </article>

    <footer>
      gâu gâu <span class="heart">♡</span> gâu
    </footer>

  </main>

  <script>
    /* ==================================
       TẠO CƠN MƯA HOA HỒNG
    ================================== */

    const roseRain = document.getElementById('rose-rain');

    const reduceMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

    // Tạo số ngẫu nhiên trong một khoảng
    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    // Tạo các bông hồng rơi từ trên xuống
    function createRoses() {
      const roseCount = window.innerWidth < 480 ? 16 : 25;

      for (let i = 0; i < roseCount; i++) {
        const rose = document.createElement('span');

        rose.className = 'rose';

        // Luân phiên giữa hoa hồng và hoa hồng trắng
        rose.textContent = Math.random() > 0.25 ? '🌹' : '🥀';

        rose.style.setProperty(
          '--left',
          `${random(0, 100)}%`
        );

        rose.style.setProperty(
          '--size',
          `${random(12, 23)}px`
        );

        rose.style.setProperty(
          '--duration',
          `${random(10, 19)}s`
        );

        rose.style.setProperty(
          '--delay',
          `${-random(0, 19)}s`
        );

        rose.style.setProperty(
          '--opacity',
          random(0.35, 0.75)
        );

        rose.style.setProperty(
          '--sway1',
          `${random(-70, 70)}px`
        );

        rose.style.setProperty(
          '--sway2',
          `${random(-100, 100)}px`
        );

        rose.style.setProperty(
          '--sway3',
          `${random(-80, 80)}px`
        );

        rose.style.setProperty(
          '--sway4',
          `${random(-100, 100)}px`
        );

        roseRain.appendChild(rose);
      }
    }

    // Tạo những cánh hoa nhỏ bay trong không khí
    function createPetals() {
      const petalCount = window.innerWidth < 480 ? 20 : 35;

      for (let i = 0; i < petalCount; i++) {
        const petal = document.createElement('span');

        petal.className = 'petal';

        petal.style.setProperty(
          '--left',
          `${random(0, 100)}%`
        );

        petal.style.setProperty(
          '--width',
          `${random(5, 11)}px`
        );

        petal.style.setProperty(
          '--duration',
          `${random(8, 16)}s`
        );

        petal.style.setProperty(
          '--delay',
          `${-random(0, 16)}s`
        );

        petal.style.setProperty(
          '--opacity',
          random(0.25, 0.7)
        );

        petal.style.setProperty(
          '--sway1',
          `${random(-80, 80)}px`
        );

        petal.style.setProperty(
          '--sway2',
          `${random(-100, 100)}px`
        );

        petal.style.setProperty(
          '--sway3',
          `${random(-80, 80)}px`
        );

        roseRain.appendChild(petal);
      }
    }

    if (!reduceMotion) {
      createRoses();
      createPetals();
    }

    /* ==================================
       NỘI DUNG LỜI CHÚC
    ================================== */

    const sentences = [
      "Chào Phương nha, thời gian để bọn mình học cùng một mái trường đã không con lâu nữa.",

      "Nhân ngày 20/10, bọn con trai chúng mình mong rằng những ngày tháng phía trước của Phương sẽ luôn là tràn ngập niềm vui và những điều tốt đẹp.",

      "Chúc cậu luôn đủ dịu dàng để yêu thương cuộc sống, đủ mạnh mẽ để theo đuổi những điều mình mong muốn!"
    ];

    let currentSentence = 0;

    const sentenceText = document.getElementById('sentence-text');

    const prevBtn = document.getElementById('prev-btn');

    const nextBtn = document.getElementById('next-btn');

    const sentenceCount = document.getElementById('sentence-count');

    /* ==================================
       HIỆU ỨNG TỪNG CHỮ XUẤT HIỆN
    ================================== */

    function showSentence(index) {
      currentSentence = index;

      const text = sentences[currentSentence];

      sentenceText.replaceChildren();

      const shouldReduceMotion = window.matchMedia(
        '(prefers-reduced-motion: reduce)'
      ).matches;

      if (shouldReduceMotion) {
        sentenceText.textContent = text;
      } else {
        [...text].forEach((char, i) => {
          const span = document.createElement('span');

          span.textContent = char === ' ' ? '\u00A0' : char;

          span.style.setProperty(
            '--delay',
            `${i * 0.025}s`
          );

          sentenceText.appendChild(span);
        });
      }

      // Cập nhật số thứ tự câu
      sentenceCount.textContent =
        `${currentSentence + 1} / ${sentences.length}`;

      // Khóa nút khi ở đầu hoặc cuối thư
      prevBtn.disabled = currentSentence === 0;

      nextBtn.disabled =
        currentSentence === sentences.length - 1;
    }

    /* ==================================
       ĐIỀU KHIỂN CHUYỂN CÂU
    ================================== */

    prevBtn.addEventListener('click', () => {
      if (currentSentence > 0) {
        showSentence(currentSentence - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentSentence < sentences.length - 1) {
        showSentence(currentSentence + 1);
      }
    });

    // Hiển thị câu đầu tiên
    showSentence(0);
  </script>

</body>
</html>
