<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#292442">
<meta name="description" content="Một lời chúc nhỏ dành riêng cho Ngọc Hân nhân ngày 20/10.">
<title>Ngọc Hân</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
:root {
  --night: #292442;
  --night2: #454064;
  --pink: #f4b8cb;
  --lavender: #c8b9f2;
  --cream: #fff3d9;
  --ink: #443852;
  --muted: #a99fca;
  --green: #809c82;
  --pixel: 4px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 26px 16px;
  display: grid;
  place-items: center;
  overflow-x: hidden;
  color: var(--cream);
  font-family: 'Be Vietnam Pro', sans-serif;
  background:
    linear-gradient(180deg,
      #292442 0%,
      #51466e 48%,
      #94738e 74%,
      #d19ba3 100%);
}

button, a {
  -webkit-tap-highlight-color: transparent;
}

.game {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  image-rendering: pixelated;
}

.sun {
  position: absolute;
  width: 100px;
  height: 100px;
  top: 9%;
  right: 15%;
  background: #f7d5b2;
  box-shadow:
    0 -8px #f7d5b2,
    0 8px #f7d5b2,
    8px 0 #f7d5b2,
    -8px 0 #f7d5b2,
    0 0 0 8px #f7d5b222;
  opacity: .85;
}

.cloud {
  position: absolute;
  width: 56px;
  height: 12px;
  background: #e4b7c9;
  opacity: .55;
  animation: cloud-drift 28s linear infinite alternate;
}

.cloud::before {
  content: "";
  position: absolute;
  width: 24px;
  height: 12px;
  top: -12px;
  left: 12px;
  background: inherit;
  box-shadow: 12px 0 inherit;
}

.cloud.one {
  top: 22%;
  left: 8%;
}

.cloud.two {
  top: 35%;
  right: 10%;
  transform: scale(.7);
}

@keyframes cloud-drift {
  from {
    translate: -8px 0;
  }

  to {
    translate: 18px 0;
  }
}

.mountain {
  position: absolute;
  bottom: 17%;
  width: 0;
  height: 0;
  border-left: 120px solid transparent;
  border-right: 120px solid transparent;
  border-bottom: 130px solid #514568;
  opacity: .7;
}

.mountain.one {
  left: -50px;
}

.mountain.two {
  left: 28%;
  bottom: 14%;
  border-left-width: 160px;
  border-right-width: 160px;
  border-bottom-width: 180px;
  border-bottom-color: #655373;
}

.mountain.three {
  right: -50px;
  border-bottom-color: #514568;
}

.ground {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 18%;
  background: #354451;
  border-top: 8px solid #718b78;
  box-shadow: inset 0 12px #455a54;
}

.ground::before {
  content: "";
  position: absolute;
  inset: 22px 0 auto;
  height: 8px;
  background: repeating-linear-gradient(
    90deg,
    #64736a 0 24px,
    transparent 24px 48px
  );
  opacity: .6;
}

.grass {
  position: absolute;
  bottom: 18%;
  width: 8px;
  height: 12px;
  background: #a3b18a;
  box-shadow:
    8px 4px #a3b18a,
    16px 0 #607f69,
    -8px 6px #607f69;
}

.grass.g1 {
  left: 8%;
}

.grass.g2 {
  left: 84%;
  transform: scale(1.3);
}

.grass.g3 {
  left: 47%;
  bottom: 13%;
}

.pixel-star {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #fff0cf;
  box-shadow: 4px 0 #fff0cf, 0 4px #fff0cf;
  opacity: .7;
  animation: twinkle 3s steps(2, end) infinite alternate;
}

@keyframes twinkle {
  from {
    opacity: .25;
  }

  to {
    opacity: .9;
  }
}

/* =========================
   NHÂN VẬT PIXEL ART
   Đã chỉnh vị trí lên phía trên khung thư
========================= */

.hero {
  position: fixed;
  width: 100px;
  height: 142px;
  left: 3%;
  bottom: 8%;
  z-index: 3;
  image-rendering: pixelated;
  transform-origin: center;
  animation: flying 2.4s ease-in-out infinite;
  filter: drop-shadow(5px 8px 0 #29244233);
}

.hero svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* Hiệu ứng bay lơ lửng */
@keyframes flying {
  0%, 100% {
    transform: translate(0, 0) rotate(-5deg);
  }

  25% {
    transform: translate(12px, -12px) rotate(-2deg);
  }

  50% {
    transform: translate(20px, 2px) rotate(4deg);
  }

  75% {
    transform: translate(8px, 10px) rotate(1deg);
  }
}

/* Tên nhân vật */
.hero-label {
  position: fixed;
  left: 3%;
  bottom: calc(8% + 145px);
  z-index: 3;
  font: 8px 'Press Start 2P', monospace;
  color: #fff0d9;
  text-shadow: 2px 2px #443852;
  white-space: nowrap;
}

/* Điều chỉnh nhân vật trên màn hình nhỏ */
@media (max-width: 600px) {
  .hero {
    width: 65px;
    height: 92px;
    left: 2%;
    bottom: 8%;
    opacity: .9;
  }

  .hero-label {
    left: 2%;
    bottom: calc(8% + 94px);
    font-size: 6px;
  }
}

/* =========================
   KHUNG THƯ
========================= */

.wrap {
  width: min(100%, 570px);
  position: relative;
  z-index: 2;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  color: #f6d9dc;
  font: 8px 'Press Start 2P', monospace;
  line-height: 1.8;
}

.level {
  color: #f7d5b2;
  text-align: right;
}

.card {
  position: relative;
  margin: 20px auto 14px;
  padding: 30px 28px 24px;
  color: var(--ink);
  background: var(--cream);
  border: 4px solid #e8c2c8;
  box-shadow:
    0 0 0 4px #453b60,
    8px 8px 0 #29244255;
  animation: card-idle 4s ease-in-out infinite alternate;
}

@keyframes card-idle {
  from {
    box-shadow: 0 0 0 4px #453b60, 8px 8px 0 #29244255;
  }

  to {
    box-shadow: 0 0 0 4px #645477, 8px 8px 0 #29244255;
  }
}

.card::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px dashed #d4a6b9;
  pointer-events: none;
}

.pixel-tag {
  width: fit-content;
  margin: 0 auto 18px;
  padding: 8px 10px;
  background: #ead4e7;
  color: #765475;
  font: 8px 'Press Start 2P', monospace;
  text-align: center;
  line-height: 1.8;
}

h1 {
  margin: 0;
  text-align: center;
  font: clamp(27px, 6vw, 39px) 'Press Start 2P', monospace;
  line-height: 1.6;
  color: #514064;
  text-shadow: 3px 3px #e9c2d0;
}

h1 span {
  color: #c56f96;
}

.subtitle {
  margin: 6px 0 22px;
  text-align: center;
  font-size: 12px;
  color: #8d7b98;
}

.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 15px 0;
  color: #c47798;
  font-size: 15px;
}

.divider::before,
.divider::after {
  content: "";
  width: 42px;
  height: 3px;
  background: #e6c3d3;
}

/* Phần nội dung lời chúc */
.letter {
  min-height: 142px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 2px;
}

#sentence-text {
  width: 100%;
  margin: 0;
  font-family: 'VT323', monospace;
  font-size: 27px;
  line-height: 1.35;
  text-align: center;
  overflow-wrap: anywhere;
}

/* Hiệu ứng hiện từng chữ */
#sentence-text span {
  display: inline;
  opacity: 0;
  animation: type-pixel .25s steps(2, end) forwards;
  animation-delay: var(--delay);
}

@keyframes type-pixel {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

/* Nút chuyển câu */
.letter-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
}

.letter-nav button {
  padding: 11px 10px;
  border: 2px solid #9b789c;
  background: #f5dfeb;
  color: #594765;
  box-shadow: 3px 3px 0 #cba5c4;
  font: 8px 'Press Start 2P', monospace;
  line-height: 1.8;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}

.letter-nav button:hover:not(:disabled) {
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 #cba5c4;
}

.letter-nav button:active:not(:disabled) {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 #cba5c4;
}

.letter-nav button:disabled {
  opacity: .4;
  cursor: default;
}

#sentence-count {
  font: 9px 'Press Start 2P', monospace;
  color: #967c9a;
  white-space: nowrap;
}

/* Chữ ký */
.sign {
  margin-top: 20px;
  text-align: right;
  color: #b16f91;
  font: 24px 'VT323', monospace;
}

/* Nút quay lại */
.back {
  display: block;
  width: fit-content;
  margin: 18px auto 0;
  color: #8f7897;
  font-size: 11px;
  text-decoration: none;
}

.back:hover {
  color: #bd7097;
}

footer {
  text-align: center;
  color: #f3d9dd;
  font: 8px 'Press Start 2P', monospace;
  line-height: 2;
}

footer span {
  color: #ffc6d7;
}

/* Responsive */
@media (max-width: 600px) {
  body {
    padding: 20px 17px;
  }

  .card {
    padding: 27px 18px 21px;
  }

  .hero {
    opacity: .9;
  }

  .hero-label {
    font-size: 6px;
  }

  .sun {
    width: 56px;
    height: 56px;
    right: 12%;
  }

  .letter {
    min-height: 155px;
  }

  #sentence-text {
    font-size: 25px;
  }

  .letter-nav {
    gap: 5px;
  }

  .letter-nav button {
    padding: 8px 6px;
    font-size: 6px;
  }

  #sentence-count {
    font-size: 7px;
  }

  .top {
    font-size: 6px;
  }

  .pixel-tag {
    font-size: 7px;
  }
}

/* Tôn trọng cài đặt giảm chuyển động */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }

  #sentence-text span {
    opacity: 1;
    animation: none;
  }
}

/* =========================
   ĐẠN PIXEL
========================= */

.bullet {
  position: fixed;
  z-index: 1;
  width: 12px;
  height: 5px;
  background: #ffe875;
  box-shadow:
    4px 0 #fff6bc,
    0 3px #e9a94f,
    0 -2px #fff3a0,
    0 0 8px #ffdb60;
  pointer-events: none;
  image-rendering: pixelated;
  animation: bullet-fly .85s linear forwards;
}

@keyframes bullet-fly {
  0% {
    opacity: 1;
    transform: translateX(0);
  }

  80% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform: translateX(65vw);
  }
}

/* Tia sáng tại nòng súng */
.muzzle-flash {
  position: fixed;
  z-index: 1;
  width: 13px;
  height: 13px;
  background: #fff3a0;
  box-shadow:
    5px 0 #ffc84f,
    -5px 0 #ffc84f,
    0 5px #ffc84f,
    0 -5px #ffc84f;
  pointer-events: none;
  animation: flash .16s steps(2, end) forwards;
}

@keyframes flash {
  from {
    opacity: 1;
    transform: scale(1);
  }

  to {
    opacity: 0;
    transform: scale(.4);
  }
}

</style>
</head>

<body>

<!-- CẢNH GAME PIXEL -->
<div class="game" id="game" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud one"></div>
  <div class="cloud two"></div>
  <div class="mountain one"></div>
  <div class="mountain two"></div>
  <div class="mountain three"></div>
  <div class="ground"></div>
  <div class="grass g1"></div>
  <div class="grass g2"></div>
  <div class="grass g3"></div>
</div>

<!-- TÊN NHÂN VẬT -->
<div class="hero-label" aria-hidden="true">PLAYER 01</div>

<!-- NHÂN VẬT NỮ PIXEL ART -->
<div class="hero" aria-hidden="true">
  <svg viewBox="0 0 25 36" shape-rendering="crispEdges"
       xmlns="http://www.w3.org/2000/svg">

    <!-- Tóc -->
    <rect x="7" y="1" width="11" height="3" fill="#463044"/>
    <rect x="5" y="4" width="15" height="8" fill="#463044"/>
    <rect x="4" y="7" width="3" height="8" fill="#463044"/>
    <rect x="18" y="6" width="3" height="10" fill="#463044"/>
    <rect x="8" y="4" width="9" height="8" fill="#efb9a5"/>

    <!-- Mặt và mắt -->
    <rect x="8" y="9" width="2" height="2" fill="#463044"/>
    <rect x="15" y="9" width="2" height="2" fill="#463044"/>
    <rect x="11" y="12" width="3" height="1" fill="#bd7182"/>

    <!-- Áo khoác -->
    <rect x="7" y="14" width="11" height="3" fill="#d88fa9"/>
    <rect x="6" y="17" width="13" height="7" fill="#ad789f"/>
    <rect x="10" y="17" width="3" height="6" fill="#f6d6c8"/>

    <!-- Tay -->
    <rect x="3" y="17" width="3" height="7" fill="#efb9a5"/>
    <rect x="19" y="17" width="3" height="6" fill="#efb9a5"/>

    <!-- Súng pixel -->
    <rect x="19" y="20" width="5" height="2" fill="#d8d6e4"/>
    <rect x="22" y="19" width="3" height="2" fill="#8e8da8"/>
    <rect x="20" y="22" width="2" height="3" fill="#8e8da8"/>

    <!-- Quần -->
    <rect x="7" y="24" width="5" height="6" fill="#52506d"/>
    <rect x="13" y="24" width="5" height="6" fill="#52506d"/>

    <!-- Giày -->
    <rect x="5" y="30" width="7" height="3" fill="#e8b8bd"/>
    <rect x="13" y="30" width="7" height="3" fill="#e8b8bd"/>
    <rect x="4" y="33" width="8" height="2" fill="#f4d9c9"/>
    <rect x="13" y="33" width="8" height="2" fill="#f4d9c9"/>

  </svg>
</div>

<!-- NỘI DUNG KHUNG THƯ -->
<main class="wrap">

  <header class="top">
    <span>20 · 10 · 2026</span>
    <span class="level">STAGE 01<br>HAPPY DAY</span>
  </header>

  <article class="card">

    <h1>Gửi <span>Ngọc Hân</span></h1>

    <div class="divider" aria-hidden="true">♥</div>

    <section class="letter" aria-label="Lời chúc">
      <p id="sentence-text" aria-live="polite"></p>
    </section>

    <div class="letter-nav">

      <button id="prev-btn" type="button" disabled>
        ◀ CÂU TRƯỚC
      </button>

      <span id="sentence-count">1 / 6</span>

      <button id="next-btn" type="button">
        CÂU TIẾP ▶
      </button>

    </div>

    

    <a class="back"
       href="https://women12102010.github.io/women1210.github.io/">
      ← Quay lại phong bì
    </a>

  </article>
</main>

<script>
const game = document.getElementById('game');

const reduceMotion = window.matchMedia(
  '(prefers-reduced-motion: reduce)'
).matches;

// =========================
// SAO PIXEL TRANG TRÍ
// =========================

for (let i = 0; i < 34; i++) {
  const star = document.createElement('span');

  star.className = 'pixel-star';
  star.style.left = `${(i * 37.71 + 7) % 100}%`;
  star.style.top = `${(i * 61.37 + 3) % 65}%`;
  star.style.animationDelay = `${(i % 7) * 0.3}s`;

  game.appendChild(star);
}

// =========================
// NỘI DUNG LỜI CHÚC
// =========================

const sentences = [
  "Thời gian đồng hành cùng nhau không còn lâu nữa, mong những lời gửi gắm nhân dịp 20/10 trên lá thứ này sẽ giúp đỡ Ngọc Hân vượt qua mọi khó khăn mà bản thân gặp phải.",

  "Hãy luôn nhờ là đừng bi quan khi gặp chuyện khó khăn nữa nè, chuyện gì cũng sẽ qua thôi mà phải không.",

  "Cũng đừng tự ti về bản thân nữa đấy nhé, vì bạn không biết sự xuất hiện của bạn có ý nghĩa thế nào với nhiều người đâu (tui chẳng hạn).",

  "Tui cũng hy vọng bạn gặp những người bạn tốt để cho bạn không cảm thấy cô đơn hay tủi thân khi phải đổi mặt với khó khăn 1 mình nữa.",

  "Mà nè, bạn là 1 trong những người rực rỡ nhất mà tui từng gặp nên hãy luôn tích cực và tự tin về bản thân mình nhé. Và hãy luôn nhớ rằng bạn xứng đáng với mọi điều tốt đẹp trên đời này!"
];

let currentSentence = 0;

const sentenceText = document.getElementById('sentence-text');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const sentenceCount = document.getElementById('sentence-count');

// Hiển thị câu chúc và hiệu ứng từng chữ
function showSentence(index) {
  currentSentence = index;

  const text = sentences[index];

  sentenceText.replaceChildren();

  if (reduceMotion) {
    sentenceText.textContent = text;
  } else {
    [...text].forEach((char, i) => {
      const span = document.createElement('span');

      span.textContent = char === ' ' ? '\u00A0' : char;
      span.style.setProperty('--delay', `${i * 0.025}s`);

      sentenceText.appendChild(span);
    });
  }

  sentenceCount.textContent =
    `${currentSentence + 1} / ${sentences.length}`;

  prevBtn.disabled = currentSentence === 0;
  nextBtn.disabled = currentSentence === sentences.length - 1;
}

// Nút câu trước
prevBtn.addEventListener('click', () => {
  if (currentSentence > 0) {
    showSentence(currentSentence - 1);
  }
});

// Nút câu tiếp theo
nextBtn.addEventListener('click', () => {
  if (currentSentence < sentences.length - 1) {
    showSentence(currentSentence + 1);
  }
});

// Hiển thị câu đầu tiên
showSentence(0);

// =========================
// HIỆU ỨNG NHÂN VẬT BẮN SÚNG
// =========================

const hero = document.querySelector('.hero');

function shootBullet() {
  if (document.hidden) return;

  const rect = hero.getBoundingClientRect();

  // Vị trí nòng súng ở phía trước nhân vật
  const x = rect.left + rect.width * 0.94;
  const y = rect.top + rect.height * 0.59;

  // Đạn pixel màu vàng
  const bullet = document.createElement('span');

  bullet.className = 'bullet';
  bullet.style.left = `${x}px`;
  bullet.style.top = `${y}px`;

  document.body.appendChild(bullet);

  bullet.addEventListener('animationend', () => {
    bullet.remove();
  }, { once: true });

  // Tia lóe tại nòng súng
  const flash = document.createElement('span');

  flash.className = 'muzzle-flash';
  flash.style.left = `${x - 2}px`;
  flash.style.top = `${y - 4}px`;

  document.body.appendChild(flash);

  flash.addEventListener('animationend', () => {
    flash.remove();
  }, { once: true });
}

// Bắn từng viên, cách nhau 650ms
if (!reduceMotion) {
  setInterval(shootBullet, 650);
}
</script>

</body>
</html>
