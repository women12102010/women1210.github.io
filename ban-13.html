
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f5">
  <meta name="description" content="Một lời chúc nhỏ dành riêng cho bạn nhân ngày 20/10.">
  <title>Tổ Trinh</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #e8a4ba;
      --deep-pink: #b65f82;
      --ink: #644552;
      --muted: #a17b8a;
      --line: #e8b7c9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 26px 18px 85px;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
      color: var(--ink);
      font-family: 'Be Vietnam Pro', sans-serif;

      background:
        radial-gradient(ellipse at 50% 15%, #ffffff 0%, transparent 42%),
        linear-gradient(180deg, #ffe8f0 0%, #fff1f4 53%, #d8edcf 100%);
    }

    /* BẦU TRỜI PASTEL */
    .garden-sky {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;

      background:
        radial-gradient(ellipse at 50% 30%, #fffaf9a8, transparent 58%),
        linear-gradient(180deg, #fbdce8 0%, #fff0f5 68%, #dcefd2 100%);
    }

    /* THẢM CỎ */
    .ground {
      position: fixed;
      z-index: -1;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 18vh;
      min-height: 100px;
      pointer-events: none;

      background:
        radial-gradient(ellipse at 20% 5%, #c0dfa6 0%, transparent 42%),
        radial-gradient(ellipse at 80% 0%, #b1d59b 0%, transparent 40%),
        linear-gradient(180deg, #a9d49b 0%, #80b97c 100%);

      border-radius: 48% 48% 0 0 / 12% 12% 0 0;
    }

    .ground::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: .55;

      background:
        radial-gradient(ellipse at 10% 30%, #e1f0bc 0 2px, transparent 3px),
        radial-gradient(ellipse at 25% 65%, #e1f0bc 0 2px, transparent 3px),
        radial-gradient(ellipse at 43% 35%, #e1f0bc 0 2px, transparent 3px),
        radial-gradient(ellipse at 63% 70%, #e1f0bc 0 2px, transparent 3px),
        radial-gradient(ellipse at 82% 35%, #e1f0bc 0 2px, transparent 3px),
        radial-gradient(ellipse at 94% 60%, #e1f0bc 0 2px, transparent 3px);
    }

    /* HOA NHỎ TRÊN CỎ */
    .grass-flower {
      position: fixed;
      z-index: 1;
      bottom: 4vh;
      font-size: 15px;
      opacity: .85;
      pointer-events: none;
      animation: ground-flower-sway 3s ease-in-out infinite alternate;
    }

    .gf1 { left: 12%; }
    .gf2 { left: 29%; bottom: 7vh; font-size: 11px; }
    .gf3 { right: 15%; bottom: 6vh; }
    .gf4 { right: 31%; font-size: 12px; }

    @keyframes ground-flower-sway {
      from {
        transform: rotate(-8deg) translateY(0);
      }
      to {
        transform: rotate(8deg) translateY(-3px);
      }
    }

    /* KHUNG THƯ */
    .wrap {
      position: relative;
      z-index: 2;
      width: min(100%, 560px);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 0 4px;
      font-size: 10px;
      letter-spacing: .2em;
      color: #a67589;
      text-transform: uppercase;
    }

    .card {
      position: relative;
      width: 100%;
      margin: 22px auto 14px;
      padding: 30px 32px;

      background: linear-gradient(145deg, #fffaf8f5, #fff1f5f2);
      border: 1px solid #eab9cb;
      border-radius: 8px;

      box-shadow:
        0 18px 55px #ad718529,
        0 0 35px #fff9f9a8;

      backdrop-filter: blur(8px);
      animation: card-glow 5s ease-in-out infinite alternate;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid #e7b5c8a3;
      border-radius: 4px;
      pointer-events: none;
    }

    @keyframes card-glow {
      0% {
        box-shadow: 0 18px 55px #ad718529, 0 0 18px #f4c5d42b;
        border-color: #eab9cb;
      }
      100% {
        box-shadow: 0 18px 55px #ad718529, 0 0 38px #e6a6c24d;
        border-color: #d994b0;
      }
    }

    .flower {
      margin-bottom: 6px;
      text-align: center;
      font-size: 25px;
      color: var(--pink);
      animation: flower-sway 4s ease-in-out infinite;
    }

    @keyframes flower-sway {
      0%, 100% {
        transform: rotate(-5deg);
      }
      50% {
        transform: rotate(5deg);
      }
    }

    h1 {
      margin: 0 0 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 500;
      line-height: 1;
      text-align: center;
      color: #755060;
    }

    h1 em {
      color: var(--deep-pink);
      font-weight: 600;
      text-shadow: 0 0 25px #e9b2c72e;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px 0;
      color: var(--pink);
    }

    .divider::before,
    .divider::after {
      content: '';
      width: 42px;
      height: 1px;
      background: var(--line);
    }

    /* NỘI DUNG LÁ THƯ */
    .letter {
      min-height: 145px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 2px;

      font-family: 'Cormorant Garamond', serif;
      font-size: 23px;
      line-height: 1.65;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .letter p {
      width: 100%;
      margin: 0;
      white-space: normal;
    }

    /* HIỆU ỨNG TỪNG CHỮ */
    #sentence-text span {
      display: inline;
      opacity: 0;
      filter: blur(3px);
      animation: letter-appear .28s ease-out forwards;
      animation-delay: var(--delay);
    }

    @keyframes letter-appear {
      from {
        opacity: 0;
        filter: blur(3px);
      }
      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    /* NÚT CHUYỂN CÂU */
    .letter-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .letter-nav button {
      padding: 10px 12px;
      border: 1px solid #e5b2c6;
      border-radius: 5px;
      background: #fce8ef;
      color: #87576a;
      font: 11px 'Be Vietnam Pro', sans-serif;
      cursor: pointer;

      transition:
        background .25s ease,
        border-color .25s ease,
        opacity .25s ease;
    }

    .letter-nav button:hover:not(:disabled) {
      background: #f8d6e3;
      border-color: var(--deep-pink);
    }

    .letter-nav button:disabled {
      opacity: .35;
      cursor: default;
    }

    #sentence-count {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .back {
      display: block;
      margin: 17px auto 0;
      text-align: center;
      text-decoration: none;
      color: #a17b8a;
      font-size: 11px;
      letter-spacing: .04em;
      transition: color .2s ease;
    }

    .back:hover {
      color: var(--deep-pink);
    }

    footer {
      text-align: center;
      color: #9c7887;
      font-size: 10px;
      letter-spacing: .08em;
    }

    footer .heart {
      color: var(--deep-pink);
    }

    /* CÁNH HOA ANH ĐÀO RƠI */
    .petal {
      position: fixed;
      top: -25px;
      z-index: 3;
      width: 12px;
      height: 17px;
      border-radius: 80% 15% 75% 20%;

      background: linear-gradient(135deg, #fff9fc, #f7bfd4 65%, #e89bb8);
      box-shadow: 0 2px 5px #bd7c9620;

      pointer-events: none;
      will-change: transform, opacity;

      animation: petal-fall var(--duration) linear forwards;
    }

    .petal:nth-child(3n) {
      width: 8px;
      height: 12px;
      background: linear-gradient(135deg, #fff8fb, #f2b3cc);
    }

    .petal:nth-child(4n) {
      width: 15px;
      height: 12px;
      border-radius: 70% 30% 60% 35%;
    }

    @keyframes petal-fall {
      0% {
        transform: translate3d(0, -5vh, 0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: .9;
      }

      30% {
        transform: translate3d(calc(var(--drift) * .65), 30vh, 0)
          rotate(160deg);
      }

      60% {
        transform: translate3d(calc(var(--drift) * -.3), 65vh, 0)
          rotate(380deg);
      }

      85% {
        opacity: .75;
      }

      100% {
        transform: translate3d(var(--drift), 110vh, 0)
          rotate(650deg);
        opacity: 0;
      }
    }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      body {
        padding: 14px 12px 70px;
      }

      .card {
        margin: 12px auto;
        padding: 24px 20px;
      }

      .letter {
        min-height: 155px;
        font-size: 22px;
      }

      .letter-nav {
        gap: 6px;
      }

      .letter-nav button {
        padding: 9px 8px;
        font-size: 10px;
      }

      .ground {
        height: 14vh;
      }

      .top {
        font-size: 9px;
      }
    }

    /* TÔN TRỌNG CÀI ĐẶT GIẢM CHUYỂN ĐỘNG */
    @media (prefers-reduced-motion: reduce) {
      .card,
      .flower,
      .grass-flower {
        animation: none;
      }

      #sentence-text span {
        animation: none;
        opacity: 1;
        filter: none;
      }

      .petal {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="garden-sky" aria-hidden="true"></div>

  <!-- THẢM CỎ -->
  <div class="ground" aria-hidden="true"></div>

  <!-- HOA NHỎ TRÊN CỎ -->
  <div class="grass-flower gf1" aria-hidden="true">🌸</div>
  <div class="grass-flower gf2" aria-hidden="true">✿</div>
  <div class="grass-flower gf3" aria-hidden="true">🌸</div>
  <div class="grass-flower gf4" aria-hidden="true">✿</div>

  <!-- BỨC THƯ -->
  <main class="wrap">
    <header class="top">
      <span>20 · 10 · 2026</span>
    </header>

    <article class="card">
      <div class="flower" aria-hidden="true">❀</div>

      <h1><em>Gửi Tố Trinh</em></h1>

      <div class="divider" aria-hidden="true">♡</div>

      <section class="letter" aria-label="Lời chúc">
        <p id="sentence-text" aria-live="polite">Nhân dịp 20/10, tui xin chúc Tố Trinh ngày càng xinh đẹp và thật nhiều sức khỏe, gặp nhiều may mắn trong cuộc sống.</p>
      </section>

      <div class="letter-nav">
        <button id="prev-btn" type="button" disabled>
          ← Câu trước
        </button>

        <span id="sentence-count">1 / 10</span>

        <button id="next-btn" type="button">
          Câu tiếp theo →
        </button>
      </div>

      <a class="back" href="https://women12102010.github.io/women1210.github.io/">
        ← Quay lại phong bì
      </a>
    </article>

  
  </main>

  <script>
    const reduceMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

    // TẠO CÁNH HOA RƠI
    const MAX_PETALS = 35;

    function createPetal() {
      if (document.hidden || reduceMotion) return;

      if (document.querySelectorAll('.petal').length >= MAX_PETALS) {
        return;
      }

      const petal = document.createElement('span');
      petal.className = 'petal';

      petal.style.left = `${Math.random() * 100}%`;

      petal.style.setProperty(
        '--duration',
        `${7 + Math.random() * 7}s`
      );

      petal.style.setProperty(
        '--drift',
        `${-120 + Math.random() * 240}px`
      );

      document.body.appendChild(petal);

      petal.addEventListener('animationend', () => {
        petal.remove();
      }, { once: true });
    }

    if (!reduceMotion) {
      // Tạo một đợt hoa ngay khi mở trang
      for (let i = 0; i < 18; i++) {
        setTimeout(createPetal, i * 250);
      }

      // Sau đó tiếp tục thả hoa
      setInterval(createPetal, 420);
    }

    // Dọn cánh hoa khi chuyển sang tab khác
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        document.querySelectorAll('.petal').forEach(petal => {
          petal.remove();
        });
      }
    });

    // NỘI DUNG LÁ THƯ
    const sentences = [
      "Nhân dịp 20/10, tui xin chúc Tố Trinh ngày càng xinh đẹp và thật nhiều sức khỏe, gặp nhiều may mắn trong cuộc sống. ",
      "Mong mọi thứ từ gia đình, tình cảm, học tập,... của bạn sẽ đều thuận lợi.",
      "Chúc bạn sẽ luôn mạnh mẽ và không bao giờ bỏ cuộc trên hành trình của mình.",
      "Hy vọng bạn sẽ gặt hái được nhiều thành công trong tương lai!"
    ];

    let currentSentence = 0;

    const sentenceText = document.getElementById('sentence-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const sentenceCount = document.getElementById('sentence-count');

    // HIỆN TỪNG CHỮ
    function showSentence(index) {
      currentSentence = index;

      const text = sentences[currentSentence];
      sentenceText.replaceChildren();

      if (reduceMotion) {
        sentenceText.textContent = text;
      } else {
        [...text].forEach((char, i) => {
          const span = document.createElement('span');

          span.textContent = char === ' ' ? '\u00A0' : char;
          span.style.setProperty('--delay', `${i * 0.025}s`);

          sentenceText.appendChild(span);
        });
      }

      sentenceCount.textContent =
        `${currentSentence + 1} / ${sentences.length}`;

      prevBtn.disabled = currentSentence === 0;
      nextBtn.disabled = currentSentence === sentences.length - 1;
    }

    // CÂU TRƯỚC
    prevBtn.addEventListener('click', () => {
      if (currentSentence > 0) {
        showSentence(currentSentence - 1);
      }
    });

    // CÂU TIẾP THEO
    nextBtn.addEventListener('click', () => {
      if (currentSentence < sentences.length - 1) {
        showSentence(currentSentence + 1);
      }
    });

    // HIỆN CÂU ĐẦU TIÊN
    showSentence(0);
  </script>
</body>
</html>
