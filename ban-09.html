        );
    }

    /* =========================

    .garden {

      content: "";

      border-top: 8px solid #795b40;
      border-radius: 50%;
      transform: rotate(-32deg);

    .grass-patch::before {
      content: "";

      height: 45px;

    /* Các ngọn cỏ riêng lẻ */

    .grass-blade {
      position: absolute;

      width: var(--w, 12px);

    /* Gió thổi qua cỏ */

        transform: rotate(calc(var(--angle, 12deg) * -1));
      }

      }

      }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 480px) {
      body {
        padding: 14px 12px;
      }

      .card {
        margin: 12px auto;
        padding: 24px 20px;
      }

      .letter {

    }

    /* Hỗ trợ người dùng giảm chuyển động */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      #sentence-text span {
        opacity: 1;
        filter: none;
        animation: none;
      }
    }
  </style>

<body>

  <!-- =========================
       KHU VƯỜN
  ========================== -->

  <div class="garden" id="garden" aria-hidden="true">

    <div class="sunlight"></div>

    <!-- Cành cây và quả táo -->

    <div class="tree-branch">

      <div class="branch-wood"></div>

      <span class="tree-leaf leaf-1"></span>
      <span class="tree-leaf leaf-2"></span>
      <span class="tree-leaf leaf-3"></span>
      <span class="tree-leaf leaf-4"></span>
      <span class="tree-leaf leaf-5"></span>
      <span class="tree-leaf leaf-6"></span>

      <div class="apple-hanger">
        <div class="apple-string"></div>
        <div class="apple">
          <span class="apple-leaf"></span>
        </div>
      </div>

    </div>

    <!-- Cỏ bên trái -->

    <div class="grass-patch grass-left">

      <span class="wildflower flower-a">🌼</span>
      <span class="wildflower flower-b">🌸</span>

    </div>

    <!-- Cỏ bên phải -->

    <div class="grass-patch grass-right">

      <span class="wildflower flower-c">🌼</span>

    </div>

  </div>

  <!-- =========================
       LÁ THƯ CHÚC
  ========================== -->

  <main class="wrap">

    <header class="top">
      <span>20 · 10 · 2026</span>
    </header>

    <article class="card">

      <div class="flower" aria-hidden="true">❀</div>

      <h1>
        <em>gâu gâu</em>
      </h1>

      <div class="divider" aria-hidden="true">♡</div>

      <section class="letter" aria-label="Lời chúc">
        <p id="sentence-text" aria-live="polite"></p>
      </section>

      <div class="letter-nav">

        <button id="prev-btn" type="button" disabled>
          ← Câu trước
        </button>

        <span id="sentence-count">1 / 6</span>

        <button id="next-btn" type="button">
          Câu tiếp theo →
        </button>

      </div>

      <a
        class="back"
        href="https://women12102010.github.io/women1210.github.io/"
      >
        ← Quay lại phong bì
      </a>

    </article>

    <footer>
      gâu gâu <span class="heart">♥</span> gâu
    </footer>

  </main>

  <script>
    // =========================
    // KHỞI TẠO
    // =========================

    const garden = document.getElementById("garden");

    const reduceMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    // =========================
    // TẠO THẢM CỎ DÀY
    // =========================

    document.querySelectorAll(".grass-patch").forEach((patch) => {

      // 85 ngọn cỏ cho mỗi bên.
      for (let i = 0; i < 85; i++) {

        const blade = document.createElement("span");

        blade.className = "grass-blade";

        const height = 35 + Math.random() * 105;
        const width = 7 + Math.random() * 10;
        const angle = 8 + Math.random() * 17;
        const duration = 2 + Math.random() * 3;
        const delay = -Math.random() * 4;

        const greens = [
          "#638d50",
          "#789f5f",
          "#8eaf6d",
          "#a5c982",
          "#557c49"
        ];

        const dark =
          greens[Math.floor(Math.random() * greens.length)];

        const light =
          greens[Math.floor(Math.random() * greens.length)];

        blade.style.setProperty(
          "--x",
          `${Math.random() * 100}%`
        );

        blade.style.setProperty("--h", `${height}px`);
        blade.style.setProperty("--w", `${width}px`);
        blade.style.setProperty("--angle", `${angle}deg`);
        blade.style.setProperty("--duration", `${duration}s`);
        blade.style.setProperty("--delay", `${delay}s`);
        blade.style.setProperty("--grass-dark", dark);
        blade.style.setProperty("--grass-light", light);

        patch.appendChild(blade);
      }

    });

    // =========================
    // HẠT BỤI ÁNH NẮNG
    // =========================

    if (!reduceMotion) {

      for (let i = 0; i < 22; i++) {

        const pollen = document.createElement("span");

        pollen.className = "pollen";

        pollen.style.left = `${Math.random() * 100}%`;
        pollen.style.top = `${Math.random() * 100}%`;

        pollen.style.animationDuration =
          `${5 + Math.random() * 7}s`;

        pollen.style.animationDelay =
          `${-Math.random() * 8}s`;

        garden.appendChild(pollen);
      }

    }

    // =========================
    // LÁ RỤNG THEO GIÓ
    // =========================

    const leafTypes = ["🍃", "🍂", "🌿"];

    let leafTimer;

    function createFallingLeaf() {

      if (reduceMotion || document.hidden) {
        scheduleNextLeaf();
        return;
      }

      const leaf = document.createElement("span");

      leaf.className = "falling-leaf";

      leaf.textContent =
        leafTypes[Math.floor(Math.random() * leafTypes.length)];

      leaf.style.left = `${Math.random() * 100}%`;

      const duration = 7 + Math.random() * 7;

      leaf.style.animationDuration = `${duration}s`;
      leaf.style.fontSize = `${14 + Math.random() * 12}px`;

      garden.appendChild(leaf);

      leaf.addEventListener(
        "animationend",
        () => leaf.remove(),
        { once: true }
      );

      scheduleNextLeaf();
    }

    function scheduleNextLeaf() {

      clearTimeout(leafTimer);

      leafTimer = setTimeout(
        createFallingLeaf,
        700 + Math.random() * 1600
      );

    }

    if (!reduceMotion) {

      for (let i = 0; i < 4; i++) {
        setTimeout(createFallingLeaf, i * 900);
      }

    }

    document.addEventListener("visibilitychange", () => {

      if (document.hidden) {

        clearTimeout(leafTimer);

      } else if (!reduceMotion) {

        scheduleNextLeaf();

      }

    });

    // =========================
    // NỘI DUNG LÁ THƯ
    // =========================

    const sentences = [

      "Đã là năm thứ 3 tổ chức 20/10 ở lớp mình nhưng đây là lần đầu tiên tui viết thư nên có gì sai sót mong Hà Giang bỏ qua cho nha.",

      "Trước hết, tui xin chúc Hà Giang ngày càng xinh đẹp, giỏi giang.",

      "Cũng mong những ngày buồn của bạn sẽ ngắn lại, những ngày vui sẽ dài hơn và nụ cười luôn xuất hiện trên môi.",

      "Chúc cho bạn luôn mạnh mẽ để đối đầu với mọi khó khăn.",

      "Dù không có con đường nào là màu hồng nhưng tui hy vọng chặng hành trình của Hà Giang sẽ gặp ít chông gai nhất có thể.",

      "Cuối cùng, tui mong rằng bức thư này sẽ tiếp thêm động lực để Hà Giang vượt qua những khó khăn mà mình không may gặp phải!"

    ];

    let currentSentence = 0;

    const sentenceText =
      document.getElementById("sentence-text");

    const prevBtn =
      document.getElementById("prev-btn");

    const nextBtn =
      document.getElementById("next-btn");

    const sentenceCount =
      document.getElementById("sentence-count");

    // =========================
    // HIỆU ỨNG HIỆN TỪNG CHỮ
    // =========================

    function showSentence(index) {

      currentSentence = index;

      const text = sentences[currentSentence];

      sentenceText.replaceChildren();

      if (reduceMotion) {

        sentenceText.textContent = text;

      } else {

        [...text].forEach((char, i) => {

          const span = document.createElement("span");

          span.textContent =
            char === " " ? "\u00A0" : char;

          span.style.setProperty(
            "--delay",
            `${i * 0.025}s`
          );

          sentenceText.appendChild(span);

        });

      }

      sentenceCount.textContent =
        `${currentSentence + 1} / ${sentences.length}`;

      prevBtn.disabled = currentSentence === 0;

      nextBtn.disabled =
        currentSentence === sentences.length - 1;

    }

    // =========================
    // ĐIỀU HƯỚNG LÁ THƯ
    // =========================

    prevBtn.addEventListener("click", () => {

      if (currentSentence > 0) {
        showSentence(currentSentence - 1);
      }

    });

    nextBtn.addEventListener("click", () => {

      if (currentSentence < sentences.length - 1) {
        showSentence(currentSentence + 1);
      }

    });

    // Hiển thị câu đầu tiên.

    showSentence(0);

  </script>

</html>
