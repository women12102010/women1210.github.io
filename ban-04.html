        radial-gradient(

        );

    .coffee-scene {

      pointer-events: none;
      display: grid;
      place-items: center;

    .coffee-cup {

      border: 5px solid rgba(255, 246, 232, 0.88);
      border-radius: 50%;

      transform: translateY(4%);
    }

    .cup-handle {
      position: absolute;
      z-index: -1;
      width: min(22vw, 150px);
      aspect-ratio: 0.85;
      left: calc(50% + min(36vw, 250px));
      top: 50%;
      border: 5px solid rgba(255, 246, 232, 0.8);
      border-left: 0;
      border-radius: 0 55% 55% 0;
      transform: translateY(-20%) rotate(8deg);
      opacity: 0.7;
    }

    /* VÒNG XOÁY SỮA */

    .milk-swirl {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background:
        conic-gradient(
          from 0deg,
          transparent 0deg,
          transparent 24deg,
          #FFF6E8 35deg,
          #FFF6E8 43deg,
          transparent 55deg,
          transparent 112deg,
          #F8EBDD 125deg,
          #F8EBDD 133deg,
          transparent 145deg,
          transparent 215deg,
          #FFF6E8 229deg,
          #FFF6E8 238deg,
          transparent 250deg,
          transparent 320deg,
          #F8EBDD 332deg,
          transparent 345deg,
          transparent 360deg
        );
      -webkit-mask: radial-gradient(
        circle,
        transparent 0%,
        transparent 23%,
        #000 25%,
        #000 29%,
        transparent 32%,
        transparent 38%,
        #000 41%,
        #000 45%,
        transparent 48%,
        transparent 55%,
        #000 58%,
        #000 62%,

        transparent 72%,

        transparent 38%,
        #000 41%,
        #000 45%,
        transparent 48%,
        transparent 55%,

    /* Lớp xoáy phụ chuyển động ngược chiều */

    .milk-swirl::before {
      content: '';
      position: absolute;
      inset: 13%;
      border-radius: 50%;
      background:

          transparent 275deg,

        transparent 38%,

        #000 48%,

        transparent 66%,

    /* Viền sữa mảnh bên trong miệng ly */

    .coffee-rim {
      position: absolute;
      inset: 5%;
      border: 1px solid #FFF6E855;
      border-radius: 50%;
    }

      from {
        transform: rotate(0deg);

        transform: rotate(360deg);

    .top {

      letter-spacing: .2em;

      text-transform: uppercase;
    }

    .top span:last-child {
      letter-spacing: .12em;
    }

    /* KHUNG LÁ THƯ */

    .card {
      position: relative;
      width: min(100%, 560px);
      margin: 22px auto 14px;
      padding: 30px 32px;
      background: linear-gradient(
        145deg,
        rgba(57, 35, 24, 0.94),
        rgba(31, 19, 14, 0.95)
      );
      border: 1px solid #FFF6E86B;
      border-radius: 4px;
      box-shadow:
        0 18px 55px #10080590,
        0 0 25px #D7A77912;
      backdrop-filter: blur(12px);
      animation: card-glow 5s ease-in-out infinite alternate;
    }

    .card::before {
      content: '';

      inset: 8px;

    }

      0% {
        box-shadow:
          0 18px 55px #10080590,
          0 0 18px #D7A77908;

      }

      50% {
        box-shadow:
          0 18px 55px #10080590,
          0 0 28px #D7A77920;

    .eyebrow {

    /* LỜI CHÚC */

    .letter {

    #sentence-text {

    #sentence-text span {
      display: inline;

    @keyframes letter-appear {
      from {
        opacity: 0;
        filter: blur(3px);

      to {
        opacity: 1;
        filter: blur(0);

    /* NÚT CHUYỂN CÂU */

    .letter-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

    }

    .letter-nav button {
      padding: 9px 12px;

    .letter-nav button:hover:not(:disabled) {

        animation: none;

<body>
  <!-- CẢNH LY CÀ PHÊ -->
  <div class="coffee-scene" aria-hidden="true">
    <div class="cup-handle"></div>

    <div class="coffee-cup">
      <div class="coffee-rim"></div>
      <div class="milk-swirl"></div>
    </div>
  </div>

  <main class="wrap">
    <header class="top">
      <span>20 · 10 · 2026</span>
      <span>made with warmth ♡</span>
    </header>

    <article class="card">
      <div class="flower" aria-hidden="true">❀</div>

      <h1>
        <em>gâu gâu</em>
      </h1>

      <div class="divider" aria-hidden="true">♡</div>

      <section class="letter" aria-label="Lời chúc">
        <p id="sentence-text" aria-live="polite">
          hí lu cô bé sicula
        </p>
      </section>

      <div class="letter-nav">
        <button id="prev-btn" type="button" disabled>
          ← Câu trước
        </button>

        <span id="sentence-count">1 / 6</span>

        <button id="next-btn" type="button">
          Câu tiếp theo →
        </button>
      </div>

      <a
        class="back"
        href="https://women12102010.github.io/women1210.github.io/"
      >
        ← Quay lại phong bì
      </a>
    </article>

    <footer>
      gâu gâu <span class="heart">♡</span> gâu
    </footer>
  </main>

  <script>
    const sentences = [
      "hí lu cô bé sicula",

      "chúc mhien có 1 ngày 20/10 vui vẻ và hạnh phúc luôn gặp may mắn trên con đường học vấn của mình chúc mhien đỗ nv1 mọi điều tốt đẹp đều đến với mhien.",

      "Qua 3 năm cấp 3 rồi cũng sắp đến chặn cuối rồi tui hi vọng hiền chăm ngoan học giỏi cố gắng đậu cái trường mà mình mong ước không phải hối tiếc hay luyến tiếc gì nữa luôn tự tin không sợ gì hết có tụi tui chống lưng mà.",

      "Tụi tui có gì làm bà thấy thất vọng thì bỏ qua xí xoá hết đi nghe .",

      "Đẹp gái thì không có gì phải buồn chúc hiền ĐỖ NV1 ĐỖ NV1 ĐỖ NV1 nhá pái pai cô gái sicula có là da trắng bốc"

    ];

    let currentSentence = 0;

    const sentenceText = document.getElementById('sentence-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const sentenceCount = document.getElementById('sentence-count');

    const reduceMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

    function showSentence(index) {
      currentSentence = index;

      const text = sentences[currentSentence];
      sentenceText.replaceChildren();

      if (reduceMotion) {
        sentenceText.textContent = text;
      } else {
        [...text].forEach((char, i) => {
          const span = document.createElement('span');

          span.textContent = char === ' ' ? '\u00A0' : char;

          // Mỗi ký tự xuất hiện cách nhau 25ms
          span.style.setProperty(
            '--delay',
            `${i * 0.025}s`
          );

          sentenceText.appendChild(span);
        });
      }

      sentenceCount.textContent =
        `${currentSentence + 1} / ${sentences.length}`;

      prevBtn.disabled = currentSentence === 0;
      nextBtn.disabled =
        currentSentence === sentences.length - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (currentSentence > 0) {
        showSentence(currentSentence - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentSentence < sentences.length - 1) {
        showSentence(currentSentence + 1);
      }
    });

    showSentence(0);
  </script>
</body>
</html>
