



<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8F0E8">
  <meta name="description" content="Một lời chúc nhỏ dành riêng cho bạn nhân ngày 20/10.">

  <title>gâu gâu · 20.10</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #F8F0E8;
      --rose: #D9A1A5;
      --deep-rose: #B8757F;
      --brown: #72554D;
      --muted: #987E73;
      --paper: #FFFCF9;
      --line: #E8D8C9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 26px 18px;
      display: grid;
      place-items: center;
      color: var(--brown);
      font-family: 'Be Vietnam Pro', sans-serif;
      background:
        radial-gradient(
          ellipse at 15% 15%,
          #fff9f3 0,
          transparent 45%
        ),
        radial-gradient(
          ellipse at 90% 85%,
          #efd9d7 0,
          transparent 38%
        ),
        var(--cream);
    }

    .wrap {
      width: min(100%, 720px);
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .top span:last-child {
      letter-spacing: .12em;
    }

    .card {
      position: relative;
      margin: 42px auto 24px;
      padding: clamp(28px, 7vw, 62px);
      background: rgba(255, 252, 249, .82);
      border: 1px solid #fff;
      border-radius: 3px;
      box-shadow: 0 18px 55px #72554d12;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid #e8d8c98c;
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 18px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--deep-rose);
    }

    .flower {
      margin-bottom: 14px;
      text-align: center;
      font-size: 26px;
      color: var(--rose);
    }

    h1 {
      margin: 0 0 22px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(42px, 8vw, 66px);
      font-weight: 500;
      line-height: .98;
      text-align: center;
    }

    h1 em {
      color: var(--deep-rose);
      font-weight: 600;
    }

    .intro {
      max-width: 430px;
      margin: 0 auto 30px;
      text-align: center;
      font-size: 13px;
      line-height: 1.9;
      color: #8c746b;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 26px 0;
      color: var(--rose);
    }

    .divider::before,
    .divider::after {
      content: '';
      width: 60px;
      height: 1px;
      background: var(--line);
    }

    .letter {
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      line-height: 1.75;
      white-space: pre-line;
    }

    .letter p {
      margin: 0 0 18px;
    }

    .sign {
      margin-top: 26px;
      text-align: right;
      color: var(--deep-rose);
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-style: italic;
    }

    .back {
      display: block;
      margin: 26px auto 0;
      text-align: center;
      text-decoration: none;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .06em;
    }

    .back:hover {
      color: var(--deep-rose);
    }

    footer {
      text-align: center;
      color: #a48d81;
      font-size: 10px;
      letter-spacing: .08em;
    }

    footer .heart {
      color: var(--deep-rose);
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 14px;
      }

      .card {
        margin-top: 30px;
        padding: 30px 24px;
      }

      .letter {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <header class="top">
      <span>20 · 10 · 2026</span>
    </header>

    <article class="card">

      <p class="eyebrow">gâu gâu</p>

      <div class="flower" aria-hidden="true">❀</div>

      <h1>
        gâu gâu,<br>
        <em>gâu gâu</em>
      </h1>

      <p class="intro">
        gâu gâu
      </p>

      <div class="divider" aria-hidden="true">♡</div>

      <section class="letter" aria-label="gâu gâu">

        <p>
          đéo có
        </p>

      </section>

      <p class="sign">gâu gâu</p>

      <a class="back" href="../index.html">
        ← Quay lại phong bì
      </a>

    </article>

    <footer>
      gâu gâu<span class="heart">gâu</span>
    </footer>

  </main>
</body>
</html>
