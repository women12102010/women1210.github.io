<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#24150F">
  <meta name="description" content="Một lời chúc nhỏ dành riêng cho bạn nhân ngày 20/10.">

  <title>gâu gâu · 20.10</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --coffee: #24150F;
      --espresso: #160D09;
      --mocha: #493024;
      --caramel: #C99B70;
      --milk: #F5E9D5;
      --cream: #E8D3B5;
      --muted: #BCA996;
      --paper: #2C1C14;
      --line: #E8D3B540;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 26px 18px 34px;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
      color: var(--milk);
      font-family: 'Be Vietnam Pro', sans-serif;
      background:
        radial-gradient(
          ellipse at 50% 12%,
          #67452D 0%,
          transparent 38%
        ),
        radial-gradient(
          ellipse at 5% 80%,
          #39251A 0%,
          transparent 38%
        ),
        linear-gradient(
          155deg,
          #160D09 0%,
          #24150F 48%,
          #352117 100%
        );
    }

    /* Ánh sáng ấm như quán cà phê */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 45%,
          #C99B700A,
          transparent 55%
        );
    }

    /* Vòng cà phê */
    .coffee-surface {
      position: fixed;
      z-index: -2;
      left: 50%;
      top: 50%;
      width: min(86vw, 650px);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: .72;
      background:
        radial-gradient(
          circle at 48% 45%,
          #805538 0%,
          #593721 35%,
          #382116 65%,
          #1B100B 100%
        );
      box-shadow:
        0 0 70px #C99B7010,
        inset 0 0 45px #120904AA,
        inset 0 0 0 3px #E8D3B510;
    }

    /* Các gợn cà phê bên trong */
    .coffee-surface::before {
      content: "";
      position: absolute;
      inset: 4%;
      border-radius: 50%;
      background:
        repeating-radial-gradient(
          ellipse at 45% 48%,
          transparent 0 23px,
          #E6C8A50C 24px 26px,
          transparent 27px 39px
        );
      opacity: .8;
    }

    /* Dải sữa trắng xoắn ốc */
    .milk-swirl {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background:
        conic-gradient(
          from 15deg,
          transparent 0deg 32deg,
          #F5E9D5 42deg 53deg,
          #DCC7A8 57deg 61deg,
          transparent 67deg 100deg,
          #F5E9D5 112deg 122deg,
          #E8D3B5 126deg 131deg,
          transparent 137deg 174deg,
          #F5E9D5 186deg 197deg,
          #DCC7A8 201deg 206deg,
          transparent 212deg 246deg,
          #F5E9D5 258deg 268deg,
          #E8D3B5 272deg 277deg,
          transparent 283deg 360deg
        );
      -webkit-mask: radial-gradient(
        circle,
        transparent 0 9%,
        #000 11% 77%,
        transparent 80%
      );
      mask: radial-gradient(
        circle,
        transparent 0 9%,
        #000 11% 77%,
        transparent 80%
      );
      filter: blur(1px);
      opacity: .85;
      transform: rotate(-18deg);
    }

    /* Tâm xoáy sữa */
    .milk-swirl::before {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      background:
        conic-gradient(
          from 35deg,
          transparent 0deg 70deg,
          #F5E9D5 90deg 115deg,
          transparent 130deg 210deg,
          #F5E9D5 230deg 255deg,
          transparent 270deg 360deg
        );
      -webkit-mask: radial-gradient(
        circle,
        transparent 0 15%,
        #000 18% 72%,
        transparent 76%
      );
      mask: radial-gradient(
        circle,
        transparent 0 15%,
        #000 18% 72%,
        transparent 76%
      );
    }

    /* Nút khuấy làm vòng sữa quay */
    .coffee-surface.stirring .milk-swirl {
      animation: milk-spin 2.6s cubic-bezier(.16, .72, .22, 1) forwards;
    }

    .coffee-surface.stirring {
      animation: surface-glow 2.6s ease-out;
    }

    @keyframes milk-spin {
      0% {
        transform: rotate(-18deg) scale(1);
        filter: blur(1px);
      }
      25% {
        filter: blur(1.8px);
      }
      70% {
        transform: rotate(680deg) scale(1.04);
        filter: blur(1.3px);
      }
      100% {
        transform: rotate(702deg) scale(1);
        filter: blur(1px);
      }
    }

    @keyframes surface-glow {
      0%, 100% {
        box-shadow:
          0 0 70px #C99B7010,
          inset 0 0 45px #120904AA,
          inset 0 0 0 3px #E8D3B510;
      }
      40% {
        box-shadow:
          0 0 95px #C99B7030,
          inset 0 0 35px #12090488,
          inset 0 0 0 3px #E8D3B530;
      }
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(100%, 560px);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .card {
      position: relative;
      width: 100%;
      margin: 22px auto 14px;
      padding: 30px 32px;
      background: linear-gradient(
        145deg,
        #342117F2,
        #1C100BF2
      );
      border: 1px solid #C99B7045;
      border-radius: 4px;
      box-shadow:
        0 18px 55px #0D0704A0,
        0 0 35px #C99B7010;
      backdrop-filter: blur(12px);
      animation: card-glow 5s ease-in-out infinite alternate;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid #E8D3B520;
      pointer-events: none;
    }

    @keyframes card-glow {
      from {
        box-shadow:
          0 18px 55px #0D0704A0,
          0 0 20px #C99B7008;
        border-color: #C99B7030;
      }
      to {
        box-shadow:
          0 18px 55px #0D0704A0,
          0 0 40px #C99B7020;
        border-color: #C99B7070;
      }
    }

    .eyebrow {
      margin: 0 0 18px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--caramel);
    }

    .flower {
      margin-bottom: 6px;
      text-align: center;
      font-size: 23px;
      color: var(--cream);
      text-shadow: 0 0 20px #E8D3B530;
    }

    h1 {
      margin: 0 0 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 500;
      line-height: 1;
      text-align: center;
    }

    h1 em {
      color: var(--cream);
      font-weight: 600;
      text-shadow: 0 0 32px #C99B7028;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px 0;
      color: var(--caramel);
    }

    .divider::before,
    .divider::after {
      content: "";
      width: 42px;
      height: 1px;
      background: var(--line);
    }

    .letter {
      min-height: 145px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 2px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      line-height: 1.65;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .letter p {
      width: 100%;
      margin: 0;
      white-space: normal;
    }

    #sentence-text span {
      display: inline;
      opacity: 0;
      filter: blur(3px);
      animation: letter-appear .28s ease-out forwards;
      animation-delay: var(--delay);
    }

    @keyframes letter-appear {
      from {
        opacity: 0;
        filter: blur(3px);
      }
      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    .letter-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    button {
      font-family: 'Be Vietnam Pro', sans-serif;
    }

    .letter-nav button {
      padding: 9px 12px;
      border: 1px solid #C99B7055;
      border-radius: 3px;
      background: #C99B7010;
      color: var(--milk);
      font-size: 11px;
      cursor: pointer;
      transition:
        background .25s ease,
        border-color .25s ease,
        opacity .25s ease;
    }

    .letter-nav button:hover:not(:disabled) {
      background: #C99B7025;
      border-color: var(--caramel);
    }

    .letter-nav button:disabled {
      opacity: .3;
      cursor: default;
    }

    #sentence-count {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .sign {
      margin-top: 26px;
      text-align: right;
      color: var(--caramel);
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-style: italic;
    }

    .back {
      display: block;
      margin: 17px auto 0;
      text-align: center;
      text-decoration: none;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
      transition: color .25s ease;
    }

    .back:hover {
      color: var(--cream);
    }

    footer {
      text-align: center;
      color: #B39B85;
      font-size: 10px;
      letter-spacing: .08em;
    }

    footer .heart {
      color: var(--cream);
    }

    /* Nút khuấy nằm ngoài khung thư */
    .stir-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 22px auto 0;
      padding: 12px 22px;
      border: 1px solid #E8D3B560;
      border-radius: 40px;
      color: var(--milk);
      background: linear-gradient(
        135deg,
        #69452E,
        #382116
      );
      box-shadow:
        0 5px 20px #10090455,
        inset 0 1px #F5E9D51A;
      font-size: 11px;
      letter-spacing: .08em;
      cursor: pointer;
      transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
    }

    .stir-button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 25px #10090480,
        0 0 20px #C99B7018;
      background: linear-gradient(
        135deg,
        #80583A,
        #493024
      );
    }

    .stir-button:active {
      transform: scale(.97);
    }

    .stir-button:disabled {
      cursor: default;
      opacity: .7;
    }

    .spoon {
      display: inline-block;
      font-size: 17px;
      line-height: 1;
    }

    .stir-button.is-stirring .spoon {
      animation: spoon-spin .65s linear infinite;
    }

    @keyframes spoon-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 14px 12px 28px;
      }

      .coffee-surface {
        width: 115vw;
        opacity: .55;
      }

      .card {
        margin: 12px auto;
        padding: 24px 20px;
      }

      .letter {
        min-height: 155px;
        font-size: 20px;
      }

      .letter-nav {
        gap: 6px;
      }

      .letter-nav button {
        padding: 9px 8px;
        font-size: 10px;
      }

      .stir-button {
        margin-top: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        animation: none;
      }

      #sentence-text span {
        animation: none;
        opacity: 1;
        filter: none;
      }

      .stir-button.is-stirring .spoon {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <!-- Mặt cà phê và dòng sữa -->
  <div class="coffee-surface" id="coffee-surface" aria-hidden="true">
    <div class="milk-swirl"></div>
  </div>

  <main class="wrap">
    <header class="top">
      <span>20 · 10 · 2026</span>
      <span>with warmth ♡</span>
    </header>

    <article class="card">
      <div class="flower" aria-hidden="true">❀</div>

      <h1><em>gâu gâu</em></h1>

      <div class="divider" aria-hidden="true">♡</div>

      <section class="letter" aria-label="Lời chúc">
        <p id="sentence-text" aria-live="polite">
          hí lu cô bé sicula
        </p>
      </section>

      <div class="letter-nav">
        <button id="prev-btn" type="button" disabled>
          ← Câu trước
        </button>

        <span id="sentence-count">1 / 6</span>

        <button id="next-btn" type="button">
          Câu tiếp theo →
        </button>
      </div>

      <a
        class="back"
        href="https://women12102010.github.io/women1210.github.io/"
      >
        ← Quay lại phong bì
      </a>
    </article>

    <footer>
      gâu gâu <span class="heart">♡</span>
    </footer>

    <!-- Nút nằm bên ngoài card -->
    <button
      class="stir-button"
      id="stir-btn"
      type="button"
      aria-label="Khuấy xoáy sữa trong cà phê"
    >
      <span class="spoon" aria-hidden="true">↻</span>
      <span id="stir-label">Khuấy cà phê</span>
    </button>
  </main>

  <script>
    const sentences = [
      "hí lu cô bé sicula",
      "chúc mhien có 1 ngày 20/10 vui vẻ và hạnh phúc luôn gặp may mắn trên con đường học vấn của mình chúc mhien đỗ nv1 mọi điều tốt đẹp đều đến với mhien.",
      "Qua 3 năm cấp 3 rồi cũng sắp đến chặn cuối rồi tui hi vọng hiền chăm ngoan học giỏi cố gắng đậu cái trường mà mình mong ước không phải hối tiếc hay luyến tiếc gì nữa luôn tự tin không sợ gì hết có tụi tui chống lưng mà.",
      "Tụi tui có gì làm bà thấy thất vọng thì bỏ qua xí xoá hết đi nghe .",
      " Đẹp gái thì không có gì phải buồn chúc hiền ĐỖ NV1 ĐỖ NV1 ĐỖ NV1 nhá pái pai cô gái sicula có là da trắng bốc"
    ];

    const sentenceText = document.getElementById("sentence-text");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const sentenceCount = document.getElementById("sentence-count");

    const coffeeSurface = document.getElementById("coffee-surface");
    const stirBtn = document.getElementById("stir-btn");
    const stirLabel = document.getElementById("stir-label");
    const milkSwirl = document.querySelector(".milk-swirl");

    const reduceMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    let currentSentence = 0;
    let stirTimer;

    // Hiện lời chúc theo từng ký tự
    function showSentence(index) {
      currentSentence = index;

      const text = sentences[currentSentence];
      sentenceText.replaceChildren();

      if (reduceMotion) {
        sentenceText.textContent = text;
      } else {
        [...text].forEach((char, i) => {
          const span = document.createElement("span");

          span.textContent = char === " " ? "\u00A0" : char;
          span.style.setProperty("--delay", `${i * 0.025}s`);

          sentenceText.appendChild(span);
        });
      }

      sentenceCount.textContent =
        `${currentSentence + 1} / ${sentences.length}`;

      prevBtn.disabled = currentSentence === 0;
      nextBtn.disabled =
        currentSentence === sentences.length - 1;
    }

    prevBtn.addEventListener("click", () => {
      if (currentSentence > 0) {
        showSentence(currentSentence - 1);
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentSentence < sentences.length - 1) {
        showSentence(currentSentence + 1);
      }
    });

    // Khuấy cà phê: xoáy sữa quay rồi chậm dần
    stirBtn.addEventListener("click", () => {
      if (reduceMotion) {
        milkSwirl.animate(
          [
            { transform: "rotate(-18deg)" },
            { transform: "rotate(342deg)" }
          ],
          { duration: 700, easing: "ease-out" }
        );
        return;
      }

      clearTimeout(stirTimer);

      coffeeSurface.classList.remove("stirring");
      stirBtn.classList.remove("is-stirring");

      // Khởi động lại animation kể cả khi bấm liên tiếp
      void coffeeSurface.offsetWidth;

      coffeeSurface.classList.add("stirring");
      stirBtn.classList.add("is-stirring");

      stirBtn.disabled = true;
      stirLabel.textContent = "Đang khuấy...";

      stirTimer = setTimeout(() => {
        coffeeSurface.classList.remove("stirring");
        stirBtn.classList.remove("is-stirring");

        stirBtn.disabled = false;
        stirLabel.textContent = "Khuấy cà phê";
      }, 2700);
    });

    showSentence(0);
  </script>
</body>
</html>
