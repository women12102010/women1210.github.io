
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF5D5">
  <meta name="description" content="Một lời chúc nhỏ dành riêng cho bạn nhân ngày 20/10.">

  <title>gâu gâu · 20.10</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --cream: #FFF8E8;
      --yellow: #F3C84B;
      --deep-yellow: #C58A20;
      --brown: #604626;
      --muted: #9A805A;
      --paper: #FFFCF2;
      --line: #D7AF5B55;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      overflow-x: clip;
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 26px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      isolation: isolate;
      overflow-x: clip;
      color: var(--brown);
      font-family: 'Be Vietnam Pro', sans-serif;

      background:
        radial-gradient(
          ellipse at 50% 12%,
          #FFFDF0 0%,
          transparent 40%
        ),
        linear-gradient(
          180deg,
          #D9E8C5 0%,
          #F8EBC1 40%,
          #F8D77C 75%,
          #D7B451 100%
        );
    }

    /* TẤT CẢ CẢNH NỀN ĐƯỢC TÁCH KHỎI BỐ CỤC CHÍNH */

    .sun-glow {
      position: fixed;
      width: 300px;
      height: 300px;
      top: -130px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #FFF8C8;
      opacity: .65;
      filter: blur(45px);
      pointer-events: none;
      z-index: -1;
    }

    .hills {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .hill {
      position: absolute;
      bottom: 8%;
      width: 120%;
      height: 24%;
      border-radius: 50% 50% 0 0;
    }

    .hill-one {
      left: -35%;
      background: #C8D29A;
      transform: rotate(-5deg);
    }

    .hill-two {
      right: -45%;
      bottom: 5%;
      background: #A8BB78;
      transform: rotate(6deg);
    }

    /* CÁNH ĐỒNG HOA */

    .sunflower-field {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 210px;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
      contain: strict;

      background: linear-gradient(
        180deg,
        transparent 0%,
        #C3A34722 25%,
        #B3A04C66 100%
      );
    }

    .sunflower {
      position: absolute;
      bottom: -4px;
      width: var(--size);
      height: calc(var(--size) * 2.6);
      transform: rotate(var(--tilt));
      transform-origin: bottom center;
      animation: sway var(--sway, 4s) ease-in-out infinite alternate;
      will-change: rotate;
    }

    .stem {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 5px;
      height: 70%;
      transform: translateX(-50%);
      border-radius: 5px;
      background: linear-gradient(90deg, #526E35, #78974A);
    }

    .leaf {
      position: absolute;
      width: 26px;
      height: 12px;
      background: #6C8C45;
      border-radius: 100% 0 100% 0;
    }

    .leaf.left {
      left: 2px;
      bottom: 38%;
      transform: rotate(15deg);
    }

    .leaf.right {
      right: 0;
      bottom: 52%;
      transform: scaleX(-1) rotate(15deg);
    }

    .flower-head {
      position: absolute;
      top: 0;
      left: 50%;
      width: var(--head);
      height: var(--head);
      transform: translateX(-50%);
    }

    .petals {
      position: absolute;
      inset: 0;
      animation: flower-turn 45s linear infinite;
      will-change: transform;
    }

    .petal {
      position: absolute;
      width: 29%;
      height: 48%;
      left: 35.5%;
      top: 1%;
      transform-origin: 50% 102%;
      border-radius: 55% 55% 42% 42%;
      background: linear-gradient(
        180deg,
        #FFE879 0%,
        #F7C735 65%,
        #E6A51C 100%
      );
    }

    .flower-center {
      position: absolute;
      width: 47%;
      height: 47%;
      top: 26.5%;
      left: 26.5%;
      border-radius: 50%;
      background:
        radial-gradient(circle, #4C2D16 1px, transparent 1.5px),
        radial-gradient(circle, #885024, #513017 75%);
      background-size: 5px 5px, 100% 100%;
      border: 2px solid #A36A2C;
    }

    @keyframes sway {
      from { rotate: -2deg; }
      to { rotate: 2deg; }
    }

    @keyframes flower-turn {
      to { transform: rotate(360deg); }
    }

    /* CÁNH HOA BAY - GIỚI HẠN SỐ LƯỢNG BẰNG JAVASCRIPT */

    .floating-petals {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
      contain: strict;
    }

    .floating-petal {
      position: absolute;
      bottom: -30px;
      width: var(--size);
      height: calc(var(--size) * 1.5);
      border-radius: 70% 30% 65% 35%;
      background: linear-gradient(
        135deg,
        #FFF1A1,
        #F6C844 70%,
        #E5A92B
      );
      opacity: 0;
      animation: float-up var(--duration) linear forwards;
      will-change: transform, opacity;
    }

    @keyframes float-up {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) rotate(0deg) scale(.7);
      }

      12% {
        opacity: .8;
      }

      70% {
        opacity: .7;
      }

      100% {
        opacity: 0;
        transform:
          translate3d(var(--drift), -110vh, 0)
          rotate(var(--rotation))
          scale(1.1);
      }
    }

    /* NỘI DUNG CHÍNH */

    .wrap {
      position: relative;
      z-index: 2;
      width: min(100%, 560px);
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      letter-spacing: .2em;
      color: #826C43;
      text-transform: uppercase;
    }

    .top span:last-child {
      letter-spacing: .12em;
    }

    .card {
      position: relative;
      width: 100%;
      margin: 22px auto 14px;
      padding: 30px 32px;
      background: linear-gradient(
        145deg,
        #FFFCF2F5,
        #FFF8E9F0
      );
      border: 1px solid #D9B96699;
      border-radius: 4px;
      box-shadow:
        0 18px 45px #71512622,
        0 0 20px #FFF4C422;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid #D9B96666;
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 18px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--deep-yellow);
    }

    .flower {
      margin-bottom: 6px;
      text-align: center;
      font-size: 27px;
      color: var(--yellow);
      animation: flower-bob 3s ease-in-out infinite alternate;
    }

    @keyframes flower-bob {
      from { transform: rotate(-5deg) translateY(0); }
      to { transform: rotate(5deg) translateY(-3px); }
    }

    h1 {
      margin: 0 0 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 500;
      line-height: 1;
      text-align: center;
    }

    h1 em {
      color: #BD8B29;
      font-weight: 600;
      text-shadow: 0 0 20px #F3D77B44;
    }

    .intro {
      max-width: 430px;
      margin: 0 auto 30px;
      text-align: center;
      font-size: 13px;
      line-height: 1.9;
      color: var(--muted);
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px 0;
      color: #D5A62F;
    }

    .divider::before,
    .divider::after {
      content: '';
      width: 42px;
      height: 1px;
      background: var(--line);
    }

    /* CHIỀU CAO CỐ ĐỊNH ĐỂ KHUNG THƯ KHÔNG NHẢY */

    .letter {
      height: 260px;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 2px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      line-height: 1.55;
      text-align: center;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .letter p {
      width: 100%;
      max-height: 100%;
      margin: 0;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    /* HIỆU ỨNG CHỮ */

    #sentence-text span {
      display: inline;
      opacity: 0;
      animation: letter-appear .28s ease-out forwards;
      animation-delay: var(--delay);
    }

    @keyframes letter-appear {
      from {
        opacity: 0;
        filter: blur(2px);
      }

      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    .letter-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .letter-nav button {
      padding: 9px 12px;
      border: 1px solid #D7B65C99;
      border-radius: 3px;
      background: #E9C85D1A;
      color: var(--brown);
      font: 11px 'Be Vietnam Pro', sans-serif;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease;
    }

    .letter-nav button:hover:not(:disabled) {
      background: #F4D77855;
      border-color: #BD8B29;
    }

    .letter-nav button:disabled {
      opacity: .3;
      cursor: default;
    }

    #sentence-count {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .back {
      display: block;
      margin: 17px auto 0;
      text-align: center;
      text-decoration: none;
      color: #947B51;
      font-size: 11px;
      letter-spacing: .04em;
      transition: color .2s ease;
    }

    .back:hover {
      color: #B17A20;
    }

    footer {
      text-align: center;
      color: #806D48;
      font-size: 10px;
      letter-spacing: .08em;
    }

    footer .heart {
      color: #C9972D;
    }

    /* ĐIỆN THOẠI */

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }

      .top {
        font-size: 8px;
        letter-spacing: .12em;
      }

      .card {
        margin: 14px auto;
        padding: 24px 20px;
      }

      .letter {
        height: 290px;
        min-height: 290px;
        font-size: 20px;
        line-height: 1.5;
      }

      .letter-nav {
        gap: 6px;
      }

      .letter-nav button {
        padding: 9px 8px;
        font-size: 10px;
      }

      .sunflower-field {
        height: 160px;
      }
    }

    @media (max-height: 720px) and (min-width: 481px) {
      body {
        padding-top: 14px;
        padding-bottom: 14px;
      }

      .card {
        margin-top: 12px;
        margin-bottom: 10px;
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .letter {
        height: 220px;
        min-height: 220px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      #sentence-text span {
        opacity: 1;
        filter: none;
      }
    }
  </style>
</head>

<body>
  <div class="sun-glow" aria-hidden="true"></div>

  <div class="hills" aria-hidden="true">
    <div class="hill hill-one"></div>
    <div class="hill hill-two"></div>
  </div>

  <div class="sunflower-field" id="sunflower-field" aria-hidden="true"></div>
  <div class="floating-petals" id="floating-petals" aria-hidden="true"></div>

  <main class="wrap">
    <header class="top">
      <span>20 · 10 · 2026</span>
      <span>✿ A little sunshine</span>
    </header>

    <article class="card">
      <div class="flower" aria-hidden="true">✿</div>

      <h1><em>gâu gâu</em></h1>

      <div class="divider" aria-hidden="true">♡</div>

      <section class="letter" aria-label="Lời chúc">
        <p id="sentence-text" aria-live="polite">
          Nhân dịp 20/10 cuối cùng của lớp 12/10, tui rất hân hạnh được phân công viết cho bạn bức thư đầy ngôn từ hoa mĩ đẹp đẽ này🌹.
        </p>
      </section>

      <div class="letter-nav">
        <button id="prev-btn" type="button" disabled>
          ← Câu trước
        </button>

        <span id="sentence-count">1 / 12</span>

        <button id="next-btn" type="button">
          Câu tiếp theo →
        </button>
      </div>

      <a class="back" href="https://women12102010.github.io/women1210.github.io/">
        ← Quay lại phong bì
      </a>
    </article>

    <footer>
      gâu gâu <span class="heart">♥</span> gâu
    </footer>
  </main>

  <script>
    const reduceMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

    // TẠO HOA HƯỚNG DƯƠNG
    const field = document.getElementById('sunflower-field');

    function createSunflower(left, size, tilt, delay) {
      const flower = document.createElement('div');
      flower.className = 'sunflower';
      flower.style.left = left + '%';
      flower.style.setProperty('--size', size + 'px');
      flower.style.setProperty('--head', (size * 1.2) + 'px');
      flower.style.setProperty('--tilt', tilt + 'deg');
      flower.style.setProperty(
        '--sway',
        (3 + Math.random() * 3) + 's'
      );
      flower.style.animationDelay = delay + 's';

      const stem = document.createElement('div');
      stem.className = 'stem';

      const leafLeft = document.createElement('div');
      leafLeft.className = 'leaf left';

      const leafRight = document.createElement('div');
      leafRight.className = 'leaf right';

      stem.append(leafLeft, leafRight);

      const head = document.createElement('div');
      head.className = 'flower-head';

      const petals = document.createElement('div');
      petals.className = 'petals';

      for (let i = 0; i < 12; i++) {
        const petal = document.createElement('span');
        petal.className = 'petal';
        petal.style.transform = `rotate(${i * 30}deg)`;
        petals.appendChild(petal);
      }

      const center = document.createElement('div');
      center.className = 'flower-center';

      head.append(petals, center);
      flower.append(stem, head);
      field.appendChild(flower);
    }

    // Giảm số lượng hoa để tránh quá tải khi hiển thị
    const isMobile = window.matchMedia('(max-width: 480px)').matches;
    const flowerCount = isMobile ? 13 : 22;

    for (let i = 0; i < flowerCount; i++) {
      const left = (i / (flowerCount - 1)) * 108 - 4;
      const size = 23 + Math.random() * 25;

      createSunflower(
        left,
        size,
        -8 + Math.random() * 16,
        Math.random() * -4
      );
    }

    // CÁNH HOA BAY - GIỚI HẠN SỐ LƯỢNG ĐANG HIỂN THỊ
    const floatingContainer = document.getElementById('floating-petals');
    const MAX_PETALS = 10;

    function createFloatingPetal() {
      if (document.hidden || reduceMotion) return;

      // Không tạo thêm nếu đã đủ cánh hoa
      if (floatingContainer.childElementCount >= MAX_PETALS) return;

      const petal = document.createElement('span');
      petal.className = 'floating-petal';

      petal.style.left = (Math.random() * 100) + '%';
      petal.style.setProperty('--size', (7 + Math.random() * 9) + 'px');
      petal.style.setProperty('--duration', (10 + Math.random() * 7) + 's');
      petal.style.setProperty('--drift', (-80 + Math.random() * 160) + 'px');
      petal.style.setProperty('--rotation', (180 + Math.random() * 360) + 'deg');

      floatingContainer.appendChild(petal);

      petal.addEventListener('animationend', () => {
        petal.remove();
      }, { once: true });
    }

    if (!reduceMotion) {
      // Thưa hơn để giảm tải animation
      setInterval(createFloatingPetal, 1400);

      // Chỉ tạo vài cánh ban đầu
      for (let i = 0; i < 4; i++) {
        setTimeout(createFloatingPetal, i * 500);
      }
    }

    // NỘI DUNG LỜI CHÚC
    const sentences = [
      "Nhân dịp 20/10 cuối cùng của lớp 12/10, tui rất hân hạnh được phân công viết cho bạn bức thư đầy ngôn từ hoa mĩ đẹp đẽ này🌹.",

      " Mình xin gửi bức thư này cho bạn có cơ thể mang trên mình hình hài đất nước⚡️.",

      "Đầu tiên tui cảm ơn Nguyễn Hoàng Thuỳ Linh rất nhiều vì đã kết bạn, đồng hành với tui từ những ngày đầu bước chân vào cấp 3,",

      "m là người chủ động bắt chuyện và giới thiệu t với mọi người, t rất cảm kíck tấm lòng nhân hậu của m😏.",

      "Bây giờ là năm cuối mình được học chung với nhau, t xin tặng Linh những lời chúc sâu sắc nhất từ trong tâm.",

      "M là một người rất giỏi, chăm chỉ nên m hãy cứ tự tin bước tiếp trên con đường mà m chọn, bỏ qua những thứ làm bạn bị phân tâm khiến bạn ovtk xàm c.",

      "Cố gắng thực hiện được ước mơ của mình và đặc biệt mình mong bạn hãy luôn giữ nụ cười trên môi🌚🫵🏻",

      "I will forever be proud of you because I know how hard you try everyday:)🫪",

      "Linh có biết Linh chính là người bạn tuyệt vời nhất mà t từng gặp (bịp).",

      " Nếu sau này có ai hỏi t chọn 10 tỷ hay chọn Thuỳ Linh thì câu trả lời chắc chắc là 10 tỷ😘.",

      "Lời chúc của t tới đây là hết, chúc Linh có một ngày 20/10 vui vẻ và tràn đầy hạnh phúc nhaaa🤢",

      " Ma cherié👻"
    ];

    let currentSentence = 0;

    const sentenceText = document.getElementById('sentence-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const sentenceCount = document.getElementById('sentence-count');

    function showSentence(index) {
      currentSentence = index;

      const text = sentences[currentSentence];
      sentenceText.replaceChildren();

      if (reduceMotion) {
        sentenceText.textContent = text;
      } else {
        const fragment = document.createDocumentFragment();

        [...text].forEach((char, i) => {
          const span = document.createElement('span');

          span.textContent = char === ' ' ? '\u00A0' : char;
          span.style.setProperty('--delay', `${i * 0.025}s`);

          fragment.appendChild(span);
        });

        sentenceText.appendChild(fragment);
      }

      sentenceCount.textContent =
        `${currentSentence + 1} / ${sentences.length}`;

      prevBtn.disabled = currentSentence === 0;
      nextBtn.disabled = currentSentence === sentences.length - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (currentSentence > 0) {
        showSentence(currentSentence - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentSentence < sentences.length - 1) {
        showSentence(currentSentence + 1);
      }
    });

    showSentence(0);
  </script>
</body>
</html>
