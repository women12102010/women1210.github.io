<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8F0E8">
  <meta name="description" content="Một lời chúc nhỏ dành riêng cho bạn nhân ngày 20/10.">

  <title>gâu gâu · 20.10</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
  color-scheme: dark;

  --cream: #10132E;
  --rose: #F4C7E8;
  --deep-rose: #C9C4FF;
  --brown: #F6F2FF;
  --muted: #B8B7D8;
  --paper: #191D43;
  --line: #C9C4FF40;
}

    * {
      box-sizing: border-box;
    }

   body {
  margin: 0;
  min-height: 100vh;
  padding: 26px 18px;
  display: grid;
  place-items: center;
  position: relative;
  isolation: isolate;
  overflow-x: hidden;

  color: var(--brown);
  font-family: 'Be Vietnam Pro', sans-serif;

  background:
    radial-gradient(
      ellipse at 50% 5%,
      #393B70 0%,
      transparent 38%
    ),
    radial-gradient(
      ellipse at 8% 70%,
      #29244E 0%,
      transparent 34%
    ),
    linear-gradient(
      160deg,
      #10132E 0%,
      #171936 52%,
      #252047 100%
    );
}

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .top span:last-child {
      letter-spacing: .12em;
    }

    .card {
      position: relative;
      margin: 42px auto 24px;
      padding: clamp(28px, 7vw, 62px);
      background: linear-gradient(
    145deg,
    #191D43F0,
    #10132EEB
  );
     border: 1px solid #C9C4FF45;
      border-radius: 3px;
      box-shadow:
  0 18px 55px #07091D70,
  0 0 35px #C9C4FF12;
      backdrop-filter: blur(12px);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid #C9C4FF35;
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 18px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--deep-rose);
    }

    .flower {
      margin-bottom: 14px;
      text-align: center;
      font-size: 26px;
      color: var(--rose);
    }

    h1 {
      margin: 0 0 22px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(42px, 8vw, 66px);
      font-weight: 500;
      line-height: .98;
      text-align: center;
    }

    h1 em {
      color: var(--deep-rose);
      font-weight: 600;
    }

    .intro {
      max-width: 430px;
      margin: 0 auto 30px;
      text-align: center;
      font-size: 13px;
      line-height: 1.9;
      color: #8c746b;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 26px 0;
      color: var(--rose);
    }

    .divider::before,
    .divider::after {
      content: '';
      width: 60px;
      height: 1px;
      background: var(--line);
    }

    .letter {
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      line-height: 1.75;
      white-space: pre-line;
    }

    .letter p {
      margin: 0 0 18px;
    }

    .sign {
      margin-top: 26px;
      text-align: right;
      color: var(--deep-rose);
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-style: italic;
    }

    .back {
      display: block;
      margin: 26px auto 0;
      text-align: center;
      text-decoration: none;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .06em;
    }

    .back:hover {
      color: var(--deep-rose);
    }

    footer {
      text-align: center;
      color: #a48d81;
      font-size: 10px;
      letter-spacing: .08em;
    }

    footer .heart {
      color: var(--deep-rose);
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 14px;
      }

      .card {
        margin-top: 30px;
        padding: 30px 24px;
      }

      .letter {
        font-size: 19px;
      }
    }
    /* BẦU TRỜI VŨ TRỤ */
.sky {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: -1;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #FFF9DF;
  opacity: .72;
  box-shadow: 0 0 9px 2px #FFF5D966;
  animation: twinkle 3.8s ease-in-out infinite alternate;
}

.star:nth-child(3n) {
  animation-delay: -1.4s;
}

.star:nth-child(4n) {
  width: 2px;
  height: 2px;
  animation-duration: 5s;
}

@keyframes twinkle {
  from {
    opacity: .25;
    transform: scale(.8);
  }

  to {
    opacity: .95;
    transform: scale(1.35);
  }
}
.shooting-star {
  position: absolute;
  width: 90px;
  height: 1px;
  opacity: 0;

  background: linear-gradient(
    90deg,
    #FFF9DF,
    transparent
  );

  transform: rotate(-35deg);
  animation: shooting 9s linear infinite;
}

@keyframes shooting {
  0%, 72% {
    opacity: 0;
    transform: translate(0, 0) rotate(-35deg);
  }

  74% {
    opacity: .9;
  }

  82% {
    opacity: 0;
    transform: translate(-180px, 110px) rotate(-35deg);
  }

  100% {
    opacity: 0;
  }
}

/* NỘI DUNG NẰM TRÊN BẦU TRỜI */
.wrap {
  position: relative;
  z-index: 1;
}
  </style>
</head>

<body>
  <div class="sky" id="sky" aria-hidden="true">
  <div
    class="shooting-star"
    style="top:18%;left:76%;animation-delay:2s"
  ></div>
</div>
  <main class="wrap">

    <header class="top">
      <span>20 · 10 · 2026</span>
    </header>

    <article class="card">

      <p class="eyebrow">gâu gâu</p>

      <div class="flower" aria-hidden="true">❀</div>

      <h1>
        gâu gâu,<br>
        <em>gâu gâu</em>
      </h1>

      <p class="intro">
        gâu gâu
      </p>

      <div class="divider" aria-hidden="true">♡</div>

      <section class="letter" aria-label="gâu gâu">

        <p>
          Đã là năm thứ 3 tổ chức 20/10 ở lớp mình nhưng đây là lần đầu tiên tui viết thư nên có gì sai sót mong Hà Giang bỏ qua cho nha.
        </p>

      </section>

      <p class="sign">gâu gâu</p>

      <a class="back" href="https://women12102010.github.io/women1210.github.io/">
        ← Quay lại phong bì
      </a>

    </article>

    <footer>
      gâu gâu<span class="heart">gâu</span>
    </footer>

  </main>
  <script>
  const sky = document.getElementById('sky');

  for (let i = 0; i < 85; i++) {
    const star = document.createElement('span');

    star.className = 'star';
    star.style.left = `${(i * 37.71 + 7) % 100}%`;
    star.style.top = `${(i * 61.37 + 3) % 100}%`;
    star.style.animationDelay = `${(i % 9) * -0.47}s`;

    sky.appendChild(star);
  }
</script>
</body>
</html>
