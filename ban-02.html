<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8F0E8">
  <meta name="description" content="Một lời chúc nhỏ dành riêng cho bạn nhân ngày 20/10.">

  <title>Hà Giang</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
  color-scheme: dark;

  --cream: #10132E;
  --rose: #F4C7E8;
  --deep-rose: #C9C4FF;
  --brown: #F6F2FF;
  --muted: #B8B7D8;
  --paper: #191D43;
  --line: #C9C4FF40;
}

    * {
      box-sizing: border-box;
    }

   body {
  margin: 0;
  min-height: 100vh;
  padding: 26px 18px;
  display: grid;
  place-items: center;
  position: relative;
  isolation: isolate;
  overflow-x: hidden;

  color: var(--brown);
  font-family: 'Be Vietnam Pro', sans-serif;

  background:
    radial-gradient(
      ellipse at 50% 5%,
      #393B70 0%,
      transparent 38%
    ),
    radial-gradient(
      ellipse at 8% 70%,
      #29244E 0%,
      transparent 34%
    ),
    linear-gradient(
      160deg,
      #10132E 0%,
      #171936 52%,
      #252047 100%
    );
}

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .top span:last-child {
      letter-spacing: .12em;
    }

    .card {
  position: relative;
  width: min(100%, 560px);
  margin: 22px auto 14px;
  padding: 30px 32px;
  background: linear-gradient(
    145deg,
    #191D43F0,
    #10132EEB
  );
  border: 1px solid #C9C4FF45;
  border-radius: 3px;
  box-shadow:
    0 18px 55px #07091D70,
    0 0 35px #C9C4FF12;
  backdrop-filter: blur(8px);
  animation: card-glow 5s ease-in-out infinite alternate;
}

    .card::before {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1px solid #C9C4FF35;
  pointer-events: none;
}
    @keyframes card-glow {
  0% {
    box-shadow:
      0 18px 55px #07091D70,
      0 0 18px #C9C4FF08,
      0 0 35px #C9C4FF10;
    border-color: #C9C4FF30;
  }

  50% {
    box-shadow:
      0 18px 55px #07091D70,
      0 0 28px #C9C4FF18,
      0 0 55px #C9C4FF20;
    border-color: #C9C4FF65;
  }

  100% {
    box-shadow:
      0 18px 55px #07091D70,
      0 0 38px #C9C4FF24,
      0 0 70px #C9C4FF25;
    border-color: #C9C4FF80;
  }
}

@media (prefers-reduced-motion: reduce) {
  .card {
    animation: none;
  }
}

    .eyebrow {
      margin: 0 0 18px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--deep-rose);
    }

    .flower {
  margin-bottom: 6px;
  text-align: center;
  font-size: 23px;
  color: var(--rose);
}

    h1 {
  margin: 0 0 12px;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(38px, 7vw, 56px);
  font-weight: 500;
  line-height: 1;
  text-align: center;
}

    h1 em {
      color: var(--deep-rose);
      font-weight: 600;
      text-shadow: 0 0 32px #C9C4FF28;
    }

    .intro {
  max-width: 430px;
  margin: 0 auto 30px;
  text-align: center;
  font-size: 13px;
  line-height: 1.9;
  color: var(--muted);
}

   .divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 14px 0;
  color: var(--rose);
}

   .divider::before,
.divider::after {
  content: '';
  width: 42px;
  height: 1px;
  background: var(--line);
}

   .letter {
  min-height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px 2px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px;
  line-height: 1.65;
  text-align: center;
  overflow-wrap: anywhere;
}
    .letter p {
  width: 100%;
  margin: 0;
  white-space: normal;
}
.letter-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
}

.letter-nav button {
  padding: 9px 12px;
  border: 1px solid #C9C4FF55;
  border-radius: 3px;
  background: #C9C4FF0D;
  color: var(--brown);
  font: 11px 'Be Vietnam Pro', sans-serif;
  cursor: pointer;
  transition:
    background .25s ease,
    border-color .25s ease,
    opacity .25s ease;
}

.letter-nav button:hover:not(:disabled) {
  background: #C9C4FF20;
  border-color: var(--deep-rose);
}

.letter-nav button:disabled {
  opacity: .3;
  cursor: default;
}

#sentence-count {
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

    .sign {
      margin-top: 26px;
      text-align: right;
      color: var(--deep-rose);
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-style: italic;
    }

 .back {
  display: block;
  margin: 17px auto 0;
  text-align: center;
  text-decoration: none;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .04em;
}

    .back:hover {
  color: var(--deep-rose);
}

    footer {
  text-align: center;
  color: #9998BD;
  font-size: 10px;
  letter-spacing: .08em;
}tter-spacing: .08em;
    }

    footer .heart {
      color: var(--deep-rose);
    }

@media (max-width: 480px) {
  body {
    padding: 14px 12px;
  }

  .card {
    margin: 12px auto;
    padding: 24px 20px;
  }

  .letter {
    min-height: 110px;
    font-size: 20px;
  }

  .letter-nav {
    gap: 6px;
  }

  .letter-nav button {
    padding: 9px 8px;
    font-size: 10px;
  }
}
.sky {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: -1;
}

.star {
  position: absolute;
  display: block;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #FFF9DF;
  opacity: .45;
  box-shadow: 0 0 6px 1px #FFF5D955;
  animation: twinkle var(--duration, 4s) ease-in-out infinite alternate;
  will-change: opacity, transform;
}


.star:nth-child(3n) {
  width: 3px;
  height: 3px;
  box-shadow:
    0 0 8px 2px #FFF5D977,
    0 0 15px #C9C4FF55;
}

.star:nth-child(5n) {
  width: 1px;
  height: 1px;
}

@keyframes twinkle {
  0% {
    opacity: .2;
    transform: scale(.7);
  }

  50% {
    opacity: .55;
  }

  100% {
    opacity: 1;
    transform: scale(1.5);
  }
}

.shooting-star {
  position: absolute;
  width: 110px;
  height: 1.5px;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;

  background: linear-gradient(
    90deg,
    transparent,
    #C9C4FF55 20%,
    #FFF9DF 100%
  );

  box-shadow: 0 0 8px #C9C4FF88;
  transform: rotate(-35deg);
  transform-origin: right center;

  animation: shooting 1.3s ease-out forwards;
  will-change: transform, opacity;
}

@keyframes shooting {
  0% {
    opacity: 0;
    transform: translate(0, 0) rotate(-35deg);
  }

  12% {
    opacity: 1;
  }

  70% {
    opacity: .85;
  }

  100% {
    opacity: 0;
    transform: translate(-240px, 145px) rotate(-35deg);
  }
}

.wrap {
  position: relative;
  z-index: 1;
}
    #sentence-text {
  opacity: 1;
  overflow-wrap: anywhere;
}

#sentence-text span {
  display: inline;
  opacity: 0;
  filter: blur(3px);
  animation: letter-appear 0.28s ease-out forwards;
  animation-delay: var(--delay);
}

@keyframes letter-appear {
  from {
    opacity: 0;
    filter: blur(3px);
  }

  to {
    opacity: 1;
    filter: blur(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  #sentence-text span {
    animation: none;
    opacity: 1;
    filter: none;
  }
}
  </style>
</head>

<body>
  <div class="sky" id="sky" aria-hidden="true">
  
</div>
  <main class="wrap">

    <header class="top">
      <span>20 · 10 · 2026</span>
    </header>

    <article class="card">


      <div class="flower" aria-hidden="true">❀</div>

      <h1>
        <em>Hà Giang</em>
      </h1>

      <div class="divider" aria-hidden="true">♡</div>

<section class="letter" aria-label="Lời chúc">
  <p id="sentence-text" aria-live="polite">
    Đã là năm thứ 3 tổ chức 20/10 ở lớp mình nhưng đây là lần đầu tiên tui viết thư nên có gì sai sót mong Hà Giang bỏ qua cho nha.
  </p>
</section>

<div class="letter-nav">
  <button id="prev-btn" type="button" disabled>
    ← Câu trước
  </button>

  <span id="sentence-count">1 / 1</span>

  <button id="next-btn" type="button" disabled>
    Câu tiếp theo →
  </button>
</div>

      <a class="back" href="https://women12102010.github.io/women1210.github.io/">
        ← Quay lại phong bì
      </a>

    </article>

    

  </main>
 
<script>
  const sky = document.getElementById('sky');
  const reduceMotion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

  // Tạo các ngôi sao ở vị trí phân bố đều
  for (let i = 0; i < 100; i++) {
    const star = document.createElement('span');

    star.className = 'star';
    star.style.left = `${(i * 37.71 + 7) % 100}%`;
    star.style.top = `${(i * 61.37 + 3) % 100}%`;
    star.style.setProperty(
      '--duration',
      `${3 + Math.random() * 4}s`
    );
    star.style.animationDelay = `${-Math.random() * 5}s`;

    sky.appendChild(star);
  }

  // Sao băng xuất hiện vào thời điểm ngẫu nhiên
  function createShootingStar() {
    if (reduceMotion || !document.hidden) {
      const shootingStar = document.createElement('span');

      shootingStar.className = 'shooting-star';
      shootingStar.style.left = `${25 + Math.random() * 75}%`;
      shootingStar.style.top = `${5 + Math.random() * 55}%`;

      sky.appendChild(shootingStar);

      shootingStar.addEventListener('animationend', () => {
        shootingStar.remove();
      }, { once: true });
    }

    const nextTime = 3500 + Math.random() * 6500;
    setTimeout(createShootingStar, nextTime);
  }

  if (!reduceMotion) {
    setTimeout(createShootingStar, 1500 + Math.random() * 3000);
  }
  const sentences = [
  "Đã là năm thứ 3 tổ chức 20/10 ở lớp mình nhưng đây là lần đầu tiên tui viết thư nên có gì sai sót mong Hà Giang bỏ qua cho nha.",

  "Trước hết, tui xin chúc Hà Giang ngày càng xinh đẹp, giỏi giang.",

  "Cũng mong những ngày buồn của bạn sẽ ngắn lại, những ngày vui sẽ dài hơn và nụ cười luôn xuất hiện trên môi.",

  "Chúc cho bạn luôn mạnh mẽ để đối đầu với mọi khó khăn.",

  "Dù không có con đường nào là màu hồng nhưng tui hy vọng chặng hành trình của Hà Giang sẽ gặp ít chông gai nhất có thể.",

  "Cuối cùng, tui mong rằng bức thư này sẽ tiếp thêm động lực để Hà Giang vượt qua những khó khăn mà mình không may gặp phải!"
];

let currentSentence = 0;

const sentenceText = document.getElementById('sentence-text');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const sentenceCount = document.getElementById('sentence-count');

function showSentence(index) {
  currentSentence = index;

  // Tách câu thành từng ký tự
  const text = sentences[currentSentence];
  sentenceText.replaceChildren();

  const reduceMotion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

  if (reduceMotion) {
    sentenceText.textContent = text;
  } else {
    [...text].forEach((char, i) => {
      const span = document.createElement('span');

      span.textContent = char === ' ' ? '\u00A0' : char;
      span.style.setProperty('--delay', `${i * 0.025}s`);

      sentenceText.appendChild(span);
    });
  }

  // Cập nhật bộ đếm
  sentenceCount.textContent =
    `${currentSentence + 1} / ${sentences.length}`;

  // Khóa nút ở đầu và cuối thư
  prevBtn.disabled = currentSentence === 0;
  nextBtn.disabled =
    currentSentence === sentences.length - 1;
}

prevBtn.addEventListener('click', () => {
  if (currentSentence > 0) {
    showSentence(currentSentence - 1);
  }
});

nextBtn.addEventListener('click', () => {
  if (currentSentence < sentences.length - 1) {
    showSentence(currentSentence + 1);
  }
});

showSentence(0);
</script>

</body>
</html>
