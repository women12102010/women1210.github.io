
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F4F8FC">
  <meta name="description" content="Một lời chúc nhỏ dành riêng cho bạn nhân ngày 20/10.">

  <title>Nhật Quý</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --white: #FFFFFF;
      --rose: #A8C9E8;
      --deep-rose: #789DBF;
      --brown: #34495E;
      --muted: #8498AC;
      --line: #B6CDE080;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 26px 18px;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
      color: var(--brown);
      font-family: 'Be Vietnam Pro', sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, #FFFFFF 0%, transparent 48%),
        radial-gradient(ellipse at 10% 80%, #DCEAF6 0%, transparent 40%),
        linear-gradient(160deg, #F8FBFF 0%, #EDF4FA 52%, #DDE9F4 100%);
    }

    /* TUYẾT RƠI */
    .snowfall {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .snowflake {
      position: absolute;
      top: -30px;
      color: #FFFFFF;
      text-shadow: 0 0 5px #B8D5ED, 0 0 12px #FFFFFF;
      user-select: none;
      will-change: transform;
      animation: snowfall var(--duration) linear var(--delay) infinite;
    }

    @keyframes snowfall {
      0% {
        transform: translate3d(0, -10vh, 0) rotate(0deg);
      }
      25% {
        transform: translate3d(18px, 25vh, 0) rotate(90deg);
      }
      50% {
        transform: translate3d(-14px, 55vh, 0) rotate(180deg);
      }
      75% {
        transform: translate3d(20px, 80vh, 0) rotate(270deg);
      }
      100% {
        transform: translate3d(-10px, 115vh, 0) rotate(360deg);
      }
    }

    /* BỐ CỤC */
    .wrap {
      position: relative;
      z-index: 1;
      width: min(100%, 560px);
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .top span:last-child {
      letter-spacing: .12em;
    }

    /* THẺ THƯ */
    .card {
      position: relative;
      width: 100%;
      margin: 22px auto 14px;
      padding: 30px 32px;
      background: linear-gradient(145deg, #FFFFFFF5, #F8FBFFFF);
      border: 1px solid #B9D0E6;
      border-radius: 8px;
      box-shadow:
        0 18px 55px #A4BBD12B,
        0 0 35px #FFFFFFAA,
        inset 0 0 35px #EAF3FA70;
      backdrop-filter: blur(12px);
      animation: winter-glow 5s ease-in-out infinite alternate;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid #C9D9E855;
      border-radius: 4px;
      pointer-events: none;
    }

    @keyframes winter-glow {
      0% {
        box-shadow:
          0 18px 45px #A4BBD125,
          0 0 20px #FFFFFF80,
          inset 0 0 25px #EAF3FA40;
        border-color: #D0DFEC;
      }
      50% {
        box-shadow:
          0 18px 55px #91B1CE35,
          0 0 30px #FFFFFFCC,
          inset 0 0 35px #DDECF980;
        border-color: #ABC8E0;
      }
      100% {
        box-shadow:
          0 18px 55px #A4BBD135,
          0 0 40px #FFFFFFDD,
          inset 0 0 40px #EAF3FA90;
        border-color: #C0D6E8;
      }
    }

    /* TRANG TRÍ */
    .flower {
      margin-bottom: 6px;
      text-align: center;
      font-size: 25px;
      color: var(--deep-rose);
      animation: flower-sway 4s ease-in-out infinite;
    }

    @keyframes flower-sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    h1 {
      margin: 0 0 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 500;
      line-height: 1;
      text-align: center;
      color: #526D87;
    }

    h1 em {
      color: var(--deep-rose);
      font-weight: 600;
      font-style: italic;
      text-shadow: 0 2px 18px #A9C9E840;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px 0;
      color: var(--deep-rose);
    }

    .divider::before,
    .divider::after {
      content: '';
      width: 42px;
      height: 1px;
      background: var(--line);
    }

    /* LỜI CHÚC */
    .letter {
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 2px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      line-height: 1.75;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .letter p {
      width: 100%;
      margin: 0;
      white-space: normal;
    }

    #sentence-text {
      opacity: 1;
      overflow-wrap: anywhere;
    }

    #sentence-text span {
      display: inline;
      opacity: 0;
      filter: blur(3px);
      animation: letter-appear .28s ease-out forwards;
      animation-delay: var(--delay);
    }

    @keyframes letter-appear {
      from {
        opacity: 0;
        filter: blur(3px);
      }
      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    /* NÚT CHUYỂN CÂU */
    .letter-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .letter-nav button {
      padding: 9px 12px;
      border: 1px solid #C3D6E8;
      border-radius: 5px;
      background: #EFF6FC;
      color: #526D87;
      font: 11px 'Be Vietnam Pro', sans-serif;
      cursor: pointer;
      transition:
        background .25s ease,
        border-color .25s ease,
        opacity .25s ease,
        transform .25s ease;
    }

    .letter-nav button:hover:not(:disabled) {
      background: #DFECF7;
      border-color: var(--deep-rose);
      transform: translateY(-2px);
    }

    .letter-nav button:disabled {
      opacity: .35;
      cursor: default;
    }

    #sentence-count {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    /* LIÊN KẾT VÀ CHÂN TRANG */
    .back {
      display: block;
      margin: 17px auto 0;
      text-align: center;
      text-decoration: none;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
      transition: color .25s ease;
    }

    .back:hover {
      color: var(--deep-rose);
    }

    footer {
      text-align: center;
      color: #8FA4B8;
      font-size: 10px;
      letter-spacing: .08em;
    }

    footer .heart {
      color: var(--deep-rose);
    }

    /* NGƯỜI TUYẾT */
    .snowman-area {
      position: fixed;
      right: max(24px, calc((100vw - 1000px) / 2));
      bottom: 20px;
      width: 115px;
      height: 175px;
      z-index: 2;
      pointer-events: none;
      animation: snowman-bob 3s ease-in-out infinite;
    }

    @keyframes snowman-bob {
      0%, 100% {
        transform: translateY(0) rotate(-2deg);
      }
      50% {
        transform: translateY(-8px) rotate(2deg);
      }
    }

    .snowman {
      position: absolute;
      inset: 0;
    }

    .snowman-shadow {
      position: absolute;
      left: 10px;
      bottom: 1px;
      width: 95px;
      height: 15px;
      border-radius: 50%;
      background: #A8C7E34D;
      animation: shadow-breathe 3s ease-in-out infinite;
    }

    @keyframes shadow-breathe {
      0%, 100% {
        transform: scaleX(1);
        opacity: .7;
      }
      50% {
        transform: scaleX(.8);
        opacity: .4;
      }
    }

    .snowman-body {
      position: absolute;
      left: 18px;
      bottom: 12px;
      width: 78px;
      height: 75px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 30% 20%,
        #FFFFFF 0%,
        #FFFFFF 28%,
        #EEF5FB 72%,
        #C9DCEC 100%
      );
      border: 1px solid #D4E3F0;
      box-shadow:
        inset -5px -6px 10px #C9DCEC50,
        0 4px 10px #9CBBD222;
    }

    .snowman-head {
      position: absolute;
      left: 30px;
      bottom: 74px;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 32% 24%,
        #FFFFFF 0%,
        #FFFFFF 35%,
        #EDF4FA 78%,
        #CFDFED 100%
      );
      border: 1px solid #D4E3F0;
      box-shadow:
        inset -3px -4px 8px #C5D9EA55,
        0 3px 8px #9CBBD222;
      z-index: 2;
    }

    .snowman-eyes {
      position: absolute;
      left: 14px;
      top: 20px;
      display: flex;
      gap: 13px;
    }

    .snowman-eye {
      width: 5px;
      height: 6px;
      border-radius: 50%;
      background: #465B70;
      animation: blink 4s infinite;
    }

    .snowman-eye:nth-child(2) {
      animation-delay: .08s;
    }

    @keyframes blink {
      0%, 42%, 46%, 100% { transform: scaleY(1); }
      44% { transform: scaleY(.1); }
    }

    .snowman-nose {
      position: absolute;
      top: 28px;
      left: 23px;
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 15px solid #EBAA72;
      filter: drop-shadow(0 1px 1px #D48B54);
    }

    .snowman-mouth {
      position: absolute;
      top: 34px;
      left: 17px;
      width: 17px;
      height: 7px;
      border-bottom: 1.5px dotted #73899D;
      border-radius: 50%;
    }

    .snowman-scarf {
      position: absolute;
      left: 27px;
      bottom: 72px;
      width: 60px;
      height: 10px;
      background: #A9C9E5;
      border-radius: 5px;
      transform: rotate(-5deg);
      z-index: 3;
      box-shadow: 0 2px 3px #8EACC555;
    }

    .snowman-scarf::after {
      content: '';
      position: absolute;
      top: 5px;
      right: 8px;
      width: 12px;
      height: 24px;
      background: #A9C9E5;
      border-radius: 3px;
      transform: rotate(-5deg);
    }

    .snowman-buttons {
      position: absolute;
      left: 54px;
      bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      z-index: 2;
    }

    .snowman-button {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #7F9EBB;
      box-shadow: 0 1px 2px #6785A244;
    }

    .snowman-arm {
      position: absolute;
      top: 80px;
      width: 29px;
      height: 3px;
      background: #A98062;
      border-radius: 5px;
      transform-origin: right center;
    }

    .snowman-arm.left {
      left: -1px;
      transform: rotate(-30deg);
    }

    .snowman-arm.right {
      right: -1px;
      top: 82px;
      transform-origin: left center;
      animation: wave 1.8s ease-in-out infinite;
    }

    .snowman-arm.right::before,
    .snowman-arm.right::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 3px;
      background: #A98062;
      border-radius: 5px;
      transform-origin: left center;
    }

    .snowman-arm.right::before {
      right: -8px;
      top: -4px;
      transform: rotate(-40deg);
    }

    .snowman-arm.right::after {
      right: -8px;
      top: 4px;
      transform: rotate(35deg);
    }

    @keyframes wave {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(25deg); }
    }

    .snowman-hat {
      position: absolute;
      left: 38px;
      bottom: 119px;
      width: 38px;
      height: 25px;
      background: #789DBF;
      border-radius: 8px 8px 2px 2px;
      transform: rotate(-7deg);
      z-index: 4;
      box-shadow: inset 0 3px 4px #FFFFFF30;
    }

    .snowman-hat::before {
      content: '';
      position: absolute;
      left: -5px;
      bottom: -3px;
      width: 48px;
      height: 7px;
      background: #91B2D0;
      border-radius: 4px;
    }

    .snowman-hat::after {
      content: '';
      position: absolute;
      top: -9px;
      left: 12px;
      width: 13px;
      height: 13px;
      background: #FFFFFF;
      border: 1px solid #D5E3EF;
      border-radius: 50%;
    }

    /* ĐIỆN THOẠI */
    @media (max-width: 600px) {
      body {
        padding: 18px 12px 155px;
      }

      .card {
        margin: 12px auto;
        padding: 26px 20px;
      }

      .letter {
        min-height: 145px;
        font-size: 21px;
      }

      .letter-nav {
        gap: 6px;
      }

      .letter-nav button {
        padding: 9px 8px;
        font-size: 10px;
      }

      .snowman-area {
        right: 12px;
        bottom: 8px;
        transform-origin: bottom right;
        animation: snowman-bob-mobile 3s ease-in-out infinite;
      }

      @keyframes snowman-bob-mobile {
        0%, 100% { translate: 0 0; }
        50% { translate: 0 -6px; }
      }
    }

    /* GIẢM CHUYỂN ĐỘNG THEO THIẾT LẬP THIẾT BỊ */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        scroll-behavior: auto !important;
      }

      .snowflake {
        display: none;
      }

      #sentence-text span {
        opacity: 1;
        filter: none;
      }
    }
  </style>
</head>

<body>
  <!-- TUYẾT RƠI -->
  <div class="snowfall" id="snowfall" aria-hidden="true"></div>

  <!-- NGƯỜI TUYẾT -->
  <div class="snowman-area" aria-hidden="true">
    <div class="snowman">
      <div class="snowman-shadow"></div>

      <div class="snowman-arm left"></div>
      <div class="snowman-arm right"></div>

      <div class="snowman-body"></div>

      <div class="snowman-buttons">
        <span class="snowman-button"></span>
        <span class="snowman-button"></span>
        <span class="snowman-button"></span>
      </div>

      <div class="snowman-head">
        <div class="snowman-eyes">
          <span class="snowman-eye"></span>
          <span class="snowman-eye"></span>
        </div>

        <div class="snowman-nose"></div>
        <div class="snowman-mouth"></div>
      </div>

      <div class="snowman-scarf"></div>
      <div class="snowman-hat"></div>
    </div>
  </div>

  <!-- NỘI DUNG -->
  <main class="wrap">
    <header class="top">
      <span>20 · 10 · 2026</span>
      
    </header>

    <article class="card">
      <div class="flower" aria-hidden="true">❄</div>

      <h1><em>Gửi Nhật Quý</em></h1>

      <div class="divider" aria-hidden="true">♡</div>

      <section class="letter" aria-label="Lời chúc">
        <p id="sentence-text" aria-live="polite">
          Chúc Nhật Quý 20/10 vui vẻ nhaaa.
        </p>
      </section>

      <div class="letter-nav">
        <button id="prev-btn" type="button" disabled>
          ← Câu trước
        </button>

        <span id="sentence-count">1 / 6</span>

        <button id="next-btn" type="button">
          Câu tiếp theo →
        </button>
      </div>

      <a class="back" href="https://women12102010.github.io/women1210.github.io/">
        ← Quay lại phong bì
      </a>
    </article>

  </main>

  <script>
    /* =========================
       TẠO TUYẾT RƠI
    ========================= */

    const snowfall = document.getElementById('snowfall');

    const reduceMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

    // Điện thoại: 50 bông; máy tính: 100 bông
    const snowCount = window.innerWidth <= 600 ? 50 : 100;
    const snowSymbols = ['❄', '❅', '❆', '·', '✧'];

    if (!reduceMotion) {
      for (let i = 0; i < snowCount; i++) {
        const snow = document.createElement('span');

        snow.className = 'snowflake';
        snow.textContent =
          snowSymbols[Math.floor(Math.random() * snowSymbols.length)];

        snow.style.left = `${Math.random() * 100}%`;
        snow.style.fontSize = `${8 + Math.random() * 13}px`;

        // Tuyết rơi chậm, nhẹ nhàng
        snow.style.setProperty(
          '--duration',
          `${12 + Math.random() * 15}s`
        );

        snow.style.setProperty(
          '--delay',
          `${-Math.random() * 27}s`
        );

        snow.style.opacity = `${0.35 + Math.random() * 0.6}`;

        snowfall.appendChild(snow);
      }
    }

    /* =========================
       NỘI DUNG LỜI CHÚC
    ========================= */

    const sentences = [
      "Chúc Nhật Quý 20/10 vui vẻ nhaaa.",

      "Quý lúc nào cũng dễ thương, hòa đồng với mọi người trong lớp nên mong bạn sẽ luôn vui vẻ và giữ được năng lượng tích cực đó nhé.",

      "Vậy là cũng sắp hết thời học sinh rồi, chúc bạn có thật nhiều kỷ niệm đẹp với lớp mình trong những tháng cuối cấp.",

      "Chúc Quý ôn thi thật tốt, đạt điểm cao và đậu vào trường đại học mà mình mong muốn nha.",

      "Dù không có con đường nào là màu hồng nhưng tui hy vọng chặng hành trình của Hà Giang sẽ gặp ít chông gai nhất có thể.",

      "Mong là sau này dù mỗi người có một con đường riêng thì vẫn sẽ nhớ về những năm tháng cấp 3 thật đáng nhớ này. 💗"
    ];

    let currentSentence = 0;

    const sentenceText = document.getElementById('sentence-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const sentenceCount = document.getElementById('sentence-count');

    /* =========================
       HIỆU ỨNG CHỮ TỪNG KÝ TỰ
    ========================= */

    function showSentence(index) {
      currentSentence = index;

      const text = sentences[currentSentence];
      sentenceText.replaceChildren();

      if (reduceMotion) {
        sentenceText.textContent = text;
      } else {
        [...text].forEach((char, i) => {
          const span = document.createElement('span');

          span.textContent = char === ' ' ? '\u00A0' : char;

          span.style.setProperty(
            '--delay',
            `${i * 0.025}s`
          );

          sentenceText.appendChild(span);
        });
      }

      sentenceCount.textContent =
        `${currentSentence + 1} / ${sentences.length}`;

      prevBtn.disabled = currentSentence === 0;
      nextBtn.disabled = currentSentence === sentences.length - 1;
    }

    /* =========================
       NÚT CHUYỂN CÂU
    ========================= */

    prevBtn.addEventListener('click', () => {
      if (currentSentence > 0) {
        showSentence(currentSentence - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentSentence < sentences.length - 1) {
        showSentence(currentSentence + 1);
      }
    });

    // Hiển thị câu đầu tiên
    showSentence(0);
  </script>
</body>
</html>
