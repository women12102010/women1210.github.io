
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8E9D0">
  <meta name="description" content="Một lời chúc nhỏ dành riêng cho bạn nhân ngày 20/10.">

  <title>gâu gâu · 20.10</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;

      --cream: #F8E9D0;
      --rose: #D98B42;
      --deep-rose: #B96B2D;
      --brown: #553721;
      --muted: #927458;
      --paper: #FFF8EC;
      --line: #C99B6755;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 26px 18px;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;

      color: var(--brown);
      font-family: 'Be Vietnam Pro', sans-serif;

      background:
        radial-gradient(
          ellipse at 50% 5%,
          #FFF5D7 0%,
          transparent 48%
        ),
        radial-gradient(
          ellipse at 8% 75%,
          #EBC28D 0%,
          transparent 42%
        ),
        radial-gradient(
          ellipse at 95% 65%,
          #F0D2A3 0%,
          transparent 38%
        ),
        linear-gradient(
          155deg,
          #F8E9D0 0%,
          #F4D9B2 52%,
          #E9C394 100%
        );
    }

    .top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .card {
      position: relative;
      width: min(100%, 560px);
      margin: 22px auto 14px;
      padding: 30px 32px;

      background: linear-gradient(
        145deg,
        #FFF9EEF5,
        #FFF3E2F2
      );

      border: 1px solid #C99B6770;
      border-radius: 4px;

      box-shadow:
        0 18px 55px #75471D20,
        0 0 35px #E9B66B25;

      backdrop-filter: blur(8px);
      animation: card-glow 5s ease-in-out infinite alternate;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid #C99B6740;
      pointer-events: none;
    }

    @keyframes card-glow {
      0% {
        box-shadow:
          0 18px 45px #75471D18,
          0 0 20px #E9B66B12;
        border-color: #C99B6750;
      }

      50% {
        box-shadow:
          0 18px 50px #75471D20,
          0 0 35px #E9B66B35;
        border-color: #D49A586D;
      }

      100% {
        box-shadow:
          0 18px 55px #75471D24,
          0 0 45px #E9B66B40;
        border-color: #C28A4D90;
      }
    }

    .eyebrow {
      margin: 0 0 18px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--deep-rose);
    }

    .flower {
      margin-bottom: 6px;
      text-align: center;
      font-size: 25px;
      color: var(--rose);
      text-shadow: 0 0 18px #D98B4240;
    }

    h1 {
      margin: 0 0 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 500;
      line-height: 1;
      text-align: center;
    }

    h1 em {
      color: var(--deep-rose);
      font-weight: 600;
      text-shadow: 0 0 25px #D98B4220;
    }

    .intro {
      max-width: 430px;
      margin: 0 auto 30px;
      text-align: center;
      font-size: 13px;
      line-height: 1.9;
      color: var(--muted);
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px 0;
      color: var(--rose);
    }

    .divider::before,
    .divider::after {
      content: '';
      width: 42px;
      height: 1px;
      background: var(--line);
    }

    .letter {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 2px;

      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      line-height: 1.65;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .letter p {
      width: 100%;
      margin: 0;
      white-space: normal;
    }

    .letter-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .letter-nav button {
      padding: 9px 12px;
      border: 1px solid #C99B6780;
      border-radius: 3px;
      background: #D98B4210;
      color: var(--brown);
      font: 11px 'Be Vietnam Pro', sans-serif;
      cursor: pointer;

      transition:
        background .25s ease,
        border-color .25s ease,
        opacity .25s ease,
        transform .25s ease;
    }

    .letter-nav button:hover:not(:disabled) {
      background: #D98B4225;
      border-color: var(--deep-rose);
      transform: translateY(-1px);
    }

    .letter-nav button:disabled {
      opacity: .3;
      cursor: default;
    }

    #sentence-count {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .sign {
      margin-top: 26px;
      text-align: right;
      color: var(--deep-rose);
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-style: italic;
    }

    .back {
      display: block;
      margin: 17px auto 0;
      text-align: center;
      text-decoration: none;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
      transition: color .25s ease;
    }

    .back:hover {
      color: var(--deep-rose);
    }

    footer {
      text-align: center;
      color: #9A7857;
      font-size: 10px;
      letter-spacing: .08em;
    }

    footer .heart {
      color: var(--deep-rose);
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
    }

    /* Bầu trời mùa thu */
    .sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    /* Lá rơi */
    .falling-leaf {
      position: absolute;
      top: -50px;
      left: var(--left);
      font-size: var(--size);
      opacity: 0;
      line-height: 1;

      filter: drop-shadow(0 2px 3px #84501D20);

      animation:
        leaf-fall var(--duration) linear var(--delay) infinite;

      will-change: transform, opacity;
    }

    @keyframes leaf-fall {
      0% {
        transform:
          translate3d(0, -5vh, 0)
          rotate(0deg);
        opacity: 0;
      }

      8% {
        opacity: var(--opacity);
      }

      25% {
        transform:
          translate3d(35px, 25vh, 0)
          rotate(100deg);
      }

      50% {
        transform:
          translate3d(-25px, 52vh, 0)
          rotate(220deg);
      }

      75% {
        transform:
          translate3d(40px, 78vh, 0)
          rotate(310deg);
      }

      92% {
        opacity: var(--opacity);
      }

      100% {
        transform:
          translate3d(-20px, 110vh, 0)
          rotate(450deg);
        opacity: 0;
      }
    }

    /* Vệt nắng mùa thu */
    .sunlight {
      position: fixed;
      top: -20%;
      left: -30%;
      width: 65vw;
      height: 140vh;
      pointer-events: none;
      z-index: 0;

      background: linear-gradient(
        110deg,
        transparent 25%,
        #FFF3C020 48%,
        #FFF8DB35 52%,
        transparent 75%
      );

      transform: rotate(8deg);
      animation: sunlight-drift 12s ease-in-out infinite alternate;
    }

    @keyframes sunlight-drift {
      from {
        transform: translateX(-5%) rotate(8deg);
        opacity: .5;
      }

      to {
        transform: translateX(25%) rotate(8deg);
        opacity: 1;
      }
    }

    /* Hiệu ứng từng ký tự */
    #sentence-text {
      opacity: 1;
      overflow-wrap: anywhere;
    }

    #sentence-text span {
      display: inline;
      opacity: 0;
      filter: blur(3px);
      animation: letter-appear .28s ease-out forwards;
      animation-delay: var(--delay);
    }

    @keyframes letter-appear {
      from {
        opacity: 0;
        filter: blur(3px);
      }

      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 14px 12px;
      }

      .card {
        margin: 12px auto;
        padding: 24px 20px;
      }

      .letter {
        min-height: 110px;
        font-size: 20px;
      }

      .letter-nav {
        gap: 6px;
      }

      .letter-nav button {
        padding: 9px 8px;
        font-size: 10px;
      }

      .falling-leaf {
        font-size: calc(var(--size) * .8);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .sunlight {
        animation: none;
      }

      .falling-leaf {
        display: none;
      }

      #sentence-text span {
        animation: none;
        opacity: 1;
        filter: none;
      }
    }
  </style>
</head>

<body>
  <div class="sunlight" aria-hidden="true"></div>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <main class="wrap">
    <header class="top">
      <span>20 · 10 · 2026</span>
    </header>

    <article class="card">
      <div class="flower" aria-hidden="true">❀</div>

      <h1>
        <em>gâu gâu</em>
      </h1>

      <div class="divider" aria-hidden="true">♡</div>

      <section class="letter" aria-label="Lời chúc">
        <p id="sentence-text" aria-live="polite">
         Chúc bạn Kỳ nhông có một ngày 20/10
      </section>

      <div class="letter-nav">
        <button id="prev-btn" type="button" disabled>
          ← Câu trước
        </button>

        <span id="sentence-count">1 / 6</span>

        <button id="next-btn" type="button">
          Câu tiếp theo →
        </button>
      </div>

      <a class="back" href="https://women12102010.github.io/women1210.github.io/">
        ← Quay lại phong bì
      </a>
    </article>

    <footer>
      gâu gâu <span class="heart">gâu</span>
    </footer>
  </main>

  <script>
    const sky = document.getElementById('sky');

    const reduceMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

    // Tạo những chiếc lá mùa thu rơi ngẫu nhiên
    const leafTypes = ['🍂', '🍁', '🍂', '🍁', '🍃'];

    if (!reduceMotion) {
      for (let i = 0; i < 24; i++) {
        const leaf = document.createElement('span');

        leaf.className = 'falling-leaf';
        leaf.textContent =
          leafTypes[Math.floor(Math.random() * leafTypes.length)];

        leaf.style.setProperty('--left', `${Math.random() * 100}%`);
        leaf.style.setProperty(
          '--size',
          `${14 + Math.random() * 15}px`
        );
        leaf.style.setProperty(
          '--duration',
          `${10 + Math.random() * 14}s`
        );
        leaf.style.setProperty(
          '--delay',
          `${-Math.random() * 24}s`
        );
        leaf.style.setProperty(
          '--opacity',
          `${0.35 + Math.random() * 0.5}`
        );

        sky.appendChild(leaf);
      }
    }

    // Nội dung từng câu chúc
    const sentences = [
      "Chúc bạn Kỳ nhông có một ngày 20/10",

      "ngập tràn niềm vui,",

      "luôn giữ tinh thần lạc quan,",

      "tích cực và cũng như mọi năm thì năm nay  cũng cố gắng hết sức nhé,",

      "chúc bạn thi cử thật tốt và gặt hái nhiều thành công trên con đường phía trước !"

    ];

    let currentSentence = 0;

    const sentenceText = document.getElementById('sentence-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const sentenceCount = document.getElementById('sentence-count');

    function showSentence(index) {
      currentSentence = index;

      const text = sentences[currentSentence];
      sentenceText.replaceChildren();

      if (reduceMotion) {
        sentenceText.textContent = text;
      } else {
        [...text].forEach((char, i) => {
          const span = document.createElement('span');

          span.textContent = char === ' ' ? '\u00A0' : char;
          span.style.setProperty('--delay', `${i * 0.025}s`);

          sentenceText.appendChild(span);
        });
      }

      sentenceCount.textContent =
        `${currentSentence + 1} / ${sentences.length}`;

      prevBtn.disabled = currentSentence === 0;
      nextBtn.disabled =
        currentSentence === sentences.length - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (currentSentence > 0) {
        showSentence(currentSentence - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentSentence < sentences.length - 1) {
        showSentence(currentSentence + 1);
      }
    });

    showSentence(0);
  </script>
</body>
</html>
