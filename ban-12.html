
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0812">
<meta name="description" content="Một lời chúc nhỏ dành riêng cho Bùi Tổng.">
<title>Bảo Thy · A Little Letter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #49394e;
  --paper: #fffaf4;
  --rose: #d78cae;
  --muted: #9a8297;
  --line: #e9d6e1;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  padding: 24px 16px;
  display: grid;
  place-items: center;
  position: relative;
  isolation: isolate;
  overflow-x: hidden;
  color: var(--ink);
  font-family: 'Be Vietnam Pro', sans-serif;
  background: #0b0812;
}

/* =========================
   NỀN TÍM ĐEN HUYỀN BÍ
========================= */

.scene {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(
      ellipse at 50% 45%,
      #352044 0%,
      #1c122b 45%,
      #0b0812 100%
    );
}

/* Ánh sáng tím chuyển động nhẹ */

.scene::before {
  content: "";
  position: absolute;
  inset: -30%;
  background:
    radial-gradient(
      circle at 25% 30%,
      #8b5cc044,
      transparent 25%
    ),
    radial-gradient(
      circle at 75% 65%,
      #6336a855,
      transparent 28%
    ),
    radial-gradient(
      circle at 50% 50%,
      #bd78dc18,
      transparent 40%
    );
  animation: aura-float 12s ease-in-out infinite alternate;
}

@keyframes aura-float {
  from {
    transform: translate(-2%, -1%) scale(1);
  }
  to {
    transform: translate(2%, 2%) scale(1.08);
  }
}

/* =========================
   ÁNH SAO LẤP LÁNH
========================= */

.card-sparkles {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.sparkle {
  position: absolute;
  color: #e9d2ff;
  font-size: var(--size, 15px);
  opacity: 0;
  text-shadow: 0 0 12px #c18aff;
  animation:
    sparkle-twinkle
    var(--duration, 4s)
    ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}

@keyframes sparkle-twinkle {
  0%, 100% {
    opacity: 0;
    transform: scale(.6) rotate(0deg);
  }
  50% {
    opacity: .95;
    transform: scale(1.15) rotate(25deg);
  }
}

/* =========================
   CÁC LÁ BÀI BAY PHÍA SAU
========================= */

.flying-cards {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  perspective: 1000px;
}

.flying-card {
  position: absolute;
  left: var(--left);
  top: var(--top);
  width: var(--width, 66px);
  height: calc(var(--width, 66px) * 1.48);
  animation:
    card-drift var(--duration, 12s) ease-in-out infinite alternate,
    card-turn var(--turn-duration, 7s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
  will-change: transform;
  transform-style: preserve-3d;
}

.card-face {
  position: absolute;
  inset: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 7px;
  border: 1px solid #ffffffd9;
  border-radius: 7px;
  background: linear-gradient(145deg, #fff, #fff0f5);
  box-shadow:
    0 8px 24px #00000040,
    0 0 12px #d9a5ff18,
    inset 0 0 0 3px #ffffffb0;
  color: #413348;
  backface-visibility: hidden;
}

/* Viền trang trí trên bài Tây */

.card-face::after {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid #e8d5e4;
  border-radius: 4px;
  pointer-events: none;
}

.card-corner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  align-self: flex-start;
  font-family: Georgia, serif;
  font-size: 17px;
  line-height: 1;
  font-weight: bold;
}

.card-corner small {
  font-size: 15px;
  margin-top: 2px;
}

.card-symbol {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: Georgia, serif;
  font-size: 36px;
}

.card-red {
  color: #d84c70;
}

.card-black {
  color: #393343;
}

/* =========================
   BÀI MA SÓI
========================= */

.werewolf-card {
  background: linear-gradient(
    150deg,
    #20172f,
    #59416f 60%,
    #171020
  );
  border-color: #e4c8ff;
  color: #fff2d8;
  box-shadow:
    0 8px 28px #00000055,
    0 0 15px #a86de92b,
    inset 0 0 0 3px #ffffff20;
}

.werewolf-card::after {
  border-color: #d8c0e980;
}

.werewolf-card .card-corner {
  font-family: 'Be Vietnam Pro', sans-serif;
  font-size: 10px;
  letter-spacing: .04em;
}

.werewolf-card .card-corner small {
  font-size: 10px;
}

.werewolf-art {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 34px;
  filter: drop-shadow(0 0 8px #f3d4ff66);
}

.werewolf-label {
  position: relative;
  z-index: 1;
  text-align: center;
  font-size: 7px;
  letter-spacing: .12em;
  font-weight: 600;
}

/* =========================
   BÀI UNO
========================= */

.uno-card {
  border: 3px solid #fff;
  border-radius: 9px;
  background: var(--uno-color, #e84343);
  box-shadow:
    0 8px 25px #00000040,
    0 0 12px #ffffff12,
    inset 0 0 0 2px #ffffff90;
}

.uno-card::before {
  content: "";
  position: absolute;
  inset: 13% -10%;
  border: 3px solid #fff;
  border-radius: 50%;
  background: #fff;
  transform: rotate(-35deg);
}

.uno-card::after {
  content: "";
  position: absolute;
  inset: 17% -6%;
  border-radius: 50%;
  background: var(--uno-color, #e84343);
  transform: rotate(-35deg);
}

.uno-symbol {
  position: absolute;
  z-index: 1;
  inset: 0;
  display: grid;
  place-items: center;
  color: white;
  font-family: 'Be Vietnam Pro', sans-serif;
  font-weight: 600;
  font-size: 29px;
  text-shadow: 1px 2px 2px #0004;
  transform: rotate(-10deg);
}

.uno-corner {
  position: relative;
  z-index: 2;
  align-self: flex-start;
  color: #fff;
  font-family: 'Be Vietnam Pro', sans-serif;
  font-size: 11px;
  font-weight: 600;
  text-shadow: 1px 1px 2px #0005;
}

/* =========================
   MẶT SAU CỦA LÁ BÀI
========================= */

.card-back {
  background:
    repeating-linear-gradient(
      45deg,
      transparent 0 7px,
      #ffffff18 7px 9px
    ),
    linear-gradient(145deg, #6c438b, #302043);
  border: 2px solid #d9b8ef;
  box-shadow:
    0 8px 24px #00000045,
    0 0 15px #a36acb22;
}

.card-back::before {
  content: "✦";
  position: absolute;
  inset: 10px;
  display: grid;
  place-items: center;
  border: 1px solid #ffffffb0;
  border-radius: 4px;
  color: #fff5fb;
  font-size: 28px;
}

/* Chuyển động bay và xoay */

@keyframes card-drift {
  0% {
    translate: 0 12px;
  }
  50% {
    translate: 15px -24px;
  }
  100% {
    translate: -12px 10px;
  }
}

@keyframes card-turn {
  0% {
    rotate: -12deg;
  }
  50% {
    rotate: 13deg;
  }
  100% {
    rotate: -12deg;
  }
}

/* =========================
   TRANG THƯ
========================= */

.wrap {
  position: relative;
  z-index: 5;
  width: min(100%, 560px);
  margin: auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 10px;
  letter-spacing: .2em;
  color: #f8eaff;
  text-shadow: 0 1px 8px #b78adf;
  text-transform: uppercase;
}

.card {
  position: relative;
  width: 100%;
  margin: 18px auto 14px;
  padding: 30px 32px;
  background: #fffaf4ed;
  border: 1px solid #ffffff;
  border-radius: 5px;
  box-shadow:
    0 18px 55px #00000045,
    0 0 35px #c38be52b,
    0 0 0 5px #fffaf418;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: card-float 5s ease-in-out infinite;
}

@keyframes card-float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-3px);
  }
}

.card::before {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1px solid #e8ccd9;
  pointer-events: none;
}

.eyebrow {
  margin: 0 0 18px;
  text-align: center;
  font-size: 10px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--rose);
}

.flower {
  margin-bottom: 6px;
  text-align: center;
  font-size: 23px;
  color: var(--rose);
}

h1 {
  margin: 0 0 12px;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(38px, 7vw, 56px);
  font-weight: 500;
  line-height: 1;
  text-align: center;
}

h1 em {
  color: #c17d9e;
  font-weight: 600;
}

.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 14px 0;
  color: var(--rose);
}

.divider::before,
.divider::after {
  content: '';
  width: 42px;
  height: 1px;
  background: var(--line);
}

.letter {
  min-height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 2px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px;
  line-height: 1.65;
  text-align: center;
  overflow-wrap: anywhere;
}

.letter p {
  width: 100%;
  margin: 0;
  white-space: normal;
}

.letter-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
}

.letter-nav button {
  padding: 9px 12px;
  border: 1px solid #e4c4d5;
  border-radius: 3px;
  background: #f9edf3;
  color: var(--ink);
  font: 11px 'Be Vietnam Pro', sans-serif;
  cursor: pointer;
  transition:
    background .25s ease,
    border-color .25s ease,
    transform .2s ease;
}

.letter-nav button:hover:not(:disabled) {
  background: #f2dce8;
  border-color: var(--rose);
  transform: translateY(-1px);
}

.letter-nav button:disabled {
  opacity: .3;
  cursor: default;
}

#sentence-count {
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}

.sign {
  margin-top: 26px;
  text-align: right;
  color: #c17d9e;
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-style: italic;
}

.back {
  display: block;
  margin: 17px auto 0;
  text-align: center;
  text-decoration: none;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .04em;
  transition: color .25s ease;
}

.back:hover {
  color: var(--rose);
}

footer {
  text-align: center;
  color: #f8eaff;
  text-shadow: 0 1px 8px #b78adf;
  font-size: 10px;
  letter-spacing: .08em;
}

footer .heart {
  color: #ffe2ee;
}

/* =========================
   HIỆU ỨNG CHỮ XUẤT HIỆN
========================= */

#sentence-text {
  overflow-wrap: anywhere;
}

#sentence-text span {
  display: inline;
  opacity: 0;
  filter: blur(3px);
  animation: letter-appear .28s ease-out forwards;
  animation-delay: var(--delay);
}

@keyframes letter-appear {
  from {
    opacity: 0;
    filter: blur(3px);
  }
  to {
    opacity: 1;
    filter: blur(0);
  }
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 480px) {
  body {
    padding: 14px 12px;
  }

  .card {
    margin: 12px auto;
    padding: 24px 20px;
  }

  .letter {
    min-height: 150px;
    font-size: 20px;
  }

  .letter-nav {
    gap: 6px;
  }

  .letter-nav button {
    padding: 9px 8px;
    font-size: 10px;
  }

  .flying-card {
    opacity: .75;
  }
}

/* Tôn trọng cài đặt giảm chuyển động */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }

  #sentence-text span {
    animation: none;
    opacity: 1;
    filter: none;
  }
}
</style>
</head>

<body>

<!-- NỀN TÍM ĐEN VÀ THẾ GIỚI LÁ BÀI -->
<div class="scene" aria-hidden="true">
  <div class="card-sparkles" id="card-sparkles"></div>
  <div class="flying-cards" id="flying-cards"></div>
</div>

<!-- LÁ THƯ -->
<main class="wrap">

  <header class="top">
    <span>20 · 10 · 2026</span>
  </header>

  <article class="card">

    <div class="flower" aria-hidden="true">❀</div>

    <h1><em>Gửi Bùi Tổng</em></h1>

    <div class="divider" aria-hidden="true">♡</div>

    <section class="letter" aria-label="Lời chúc">
      <p id="sentence-text" aria-live="polite">
        Chào Nàng công chúa của tôi, tôi là một trong những chàng hoàng tử của lớp 12.10.
      </p>
    </section>

    <div class="letter-nav">

      <button id="prev-btn" type="button" disabled>
        ← Câu trước
      </button>

      <span id="sentence-count">1 / 10</span>

      <button id="next-btn" type="button">
        Câu tiếp theo →
      </button>

    </div>

    <a
      class="back"
      href="https://women12102010.github.io/women1210.github.io/"
    >
      ← Quay lại phong bì
    </a>

  </article>

</main>

<script>
/* =========================
   BỘ BÀI
========================= */

const cardDeck = [

  // BÀI TÂY
  { type: 'poker', rank: 'A', suit: '♠', color: 'black' },
  { type: 'poker', rank: 'K', suit: '♥', color: 'red' },
  { type: 'poker', rank: 'Q', suit: '♦', color: 'red' },
  { type: 'poker', rank: 'J', suit: '♣', color: 'black' },
  { type: 'poker', rank: '7', suit: '♥', color: 'red' },
  { type: 'poker', rank: '10', suit: '♠', color: 'black' },
  { type: 'poker', rank: 'A', suit: '♦', color: 'red' },
  { type: 'poker', rank: '9', suit: '♣', color: 'black' },

  // BÀI MA SÓI
  { type: 'wolf', rank: 'MA SÓI', symbol: '🐺' },
  { type: 'wolf', rank: 'TIÊN TRI', symbol: '🔮' },
  { type: 'wolf', rank: 'PHÙ THỦY', symbol: '🌙' },
  { type: 'wolf', rank: 'DÂN LÀNG', symbol: '🏡' },
  { type: 'wolf', rank: 'THỢ SĂN', symbol: '🏹' },

  // BÀI UNO
  { type: 'uno', symbol: '5', color: '#e84343' },
  { type: 'uno', symbol: '2', color: '#2879df' },
  { type: 'uno', symbol: '7', color: '#36a86b' },
  { type: 'uno', symbol: '9', color: '#efbd32' },
  { type: 'uno', symbol: '+4', color: '#29252f' },
  { type: 'uno', symbol: '↻', color: '#e84343' },
  { type: 'uno', symbol: '⊘', color: '#2879df' },
  { type: 'uno', symbol: '+2', color: '#36a86b' }
];

const flyingCards = document.getElementById('flying-cards');
const cardSparkles = document.getElementById('card-sparkles');

/* Tạo mặt trước của từng loại bài */

function createCardFace(card) {
  const face = document.createElement('div');

  face.className = 'card-face';

  if (card.type === 'poker') {
    face.classList.add(
      card.color === 'red' ? 'card-red' : 'card-black'
    );

    const top = document.createElement('div');
    top.className = 'card-corner';
    top.append(card.rank);

    const suitTop = document.createElement('small');
    suitTop.textContent = card.suit;
    top.appendChild(suitTop);

    const symbol = document.createElement('div');
    symbol.className = 'card-symbol';
    symbol.textContent = card.suit;

    const bottom = document.createElement('div');
    bottom.className = 'card-corner';
    bottom.style.alignSelf = 'flex-end';
    bottom.style.transform = 'rotate(180deg)';
    bottom.append(card.rank);

    const suitBottom = document.createElement('small');
    suitBottom.textContent = card.suit;
    bottom.appendChild(suitBottom);

    face.append(top, symbol, bottom);
  }

  if (card.type === 'wolf') {
    face.classList.add('werewolf-card');

    const title = document.createElement('div');
    title.className = 'card-corner';
    title.textContent = card.rank;

    const art = document.createElement('div');
    art.className = 'werewolf-art';
    art.textContent = card.symbol;

    const label = document.createElement('div');
    label.className = 'werewolf-label';
    label.textContent = card.rank;

    face.append(title, art, label);
  }

  if (card.type === 'uno') {
    face.classList.add('uno-card');
    face.style.setProperty('--uno-color', card.color);

    const top = document.createElement('div');
    top.className = 'uno-corner';
    top.textContent = card.symbol;

    const symbol = document.createElement('div');
    symbol.className = 'uno-symbol';
    symbol.textContent = card.symbol;

    const bottom = document.createElement('div');
    bottom.className = 'uno-corner';
    bottom.style.alignSelf = 'flex-end';
    bottom.style.transform = 'rotate(180deg)';
    bottom.textContent = card.symbol;

    face.append(top, symbol, bottom);
  }

  return face;
}

/* Tạo lá bài bay */

function createFlyingCard(index) {
  const card = cardDeck[index % cardDeck.length];
  const wrapper = document.createElement('div');

  wrapper.className = 'flying-card';

  const width = 44 + Math.random() * 38;

  wrapper.style.setProperty(
    '--left',
    `${Math.random() * 94}%`
  );

  wrapper.style.setProperty(
    '--top',
    `${Math.random() * 90}%`
  );

  wrapper.style.setProperty('--width', `${width}px`);

  wrapper.style.setProperty(
    '--duration',
    `${7 + Math.random() * 9}s`
  );

  wrapper.style.setProperty(
    '--turn-duration',
    `${5 + Math.random() * 6}s`
  );

  wrapper.style.setProperty(
    '--delay',
    `${-Math.random() * 14}s`
  );

  wrapper.style.opacity = `${0.48 + Math.random() * 0.42}`;

  // Một số lá bài hiện mặt sau.
  if (index % 7 === 0) {
    const back = document.createElement('div');
    back.className = 'card-face card-back';
    wrapper.appendChild(back);
  } else {
    wrapper.appendChild(createCardFace(card));
  }

  flyingCards.appendChild(wrapper);
}

// Tạo 26 lá bài với vị trí và tốc độ ngẫu nhiên.
for (let i = 0; i < 26; i++) {
  createFlyingCard(i);
}

/* Tạo các đốm sáng */

for (let i = 0; i < 24; i++) {
  const sparkle = document.createElement('span');

  sparkle.className = 'sparkle';
  sparkle.textContent = ['✦', '✧', '·', '♡'][i % 4];

  sparkle.style.left = `${Math.random() * 100}%`;
  sparkle.style.top = `${Math.random() * 100}%`;

  sparkle.style.setProperty(
    '--size',
    `${8 + Math.random() * 13}px`
  );

  sparkle.style.setProperty(
    '--duration',
    `${2 + Math.random() * 4}s`
  );

  sparkle.style.setProperty(
    '--delay',
    `${-Math.random() * 5}s`
  );

  cardSparkles.appendChild(sparkle);
}

/* =========================
   CHUYỂN TỪNG CÂU THƯ
========================= */

const sentences = [
  "Chào Nàng công chúa của tôi, tôi là một trong những chàng hoàng tử của lớp 12.10.",

  "Thời gian thấm thoát thoi đưa, ngày để tôi được bên cạnh em không còn nhiều nữa.",

  "Nhân dịp ngày mai là ngày 20/10, tôi một gửi cho em những lời nhắc nhở khi không có tôi ở cạnh em.",

  "BThy à, em là một cô gái dễ thương, hoà đồng và đối với tôi em là nàng công chúa khiến tôi ấn tượng nhất trong 14 công chúa.",

  "Học lực của em rất tốt nhưng em lại luôn tự ti về bản thân mình (nhất là trước giờ kiểm tra như “T chưa học bài m ơi, bài ni t k bt làmm, …) nhưng phát bài ra toàn 9,10đ 🙂..",

  "Trước khi đi có vài lời nhắn nhủ tôi muốn gửi đến em:",

  "Trời bắt đầu trở lạnh rồi ra đường nhớ phải mặc áo ấm;",

  "Học tập thật chăm chỉ cho kì thi quan trọng nhất của mình;",

  "Cuối cùng là phải giữ gìn sức khoẻ.",

  "Đến giờ tôi phải đi rồi, tạm biệt nha nàng công chúa của tôi!"
];

let currentSentence = 0;

const sentenceText = document.getElementById('sentence-text');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const sentenceCount = document.getElementById('sentence-count');

const reduceMotion = window.matchMedia(
  '(prefers-reduced-motion: reduce)'
).matches;

function showSentence(index) {
  currentSentence = index;

  const text = sentences[currentSentence];

  sentenceText.replaceChildren();

  if (reduceMotion) {
    sentenceText.textContent = text;
  } else {
    [...text].forEach((char, i) => {
      const span = document.createElement('span');

      span.textContent = char === ' ' ? '\u00A0' : char;

      span.style.setProperty(
        '--delay',
        `${i * 0.025}s`
      );

      sentenceText.appendChild(span);
    });
  }

  sentenceCount.textContent =
    `${currentSentence + 1} / ${sentences.length}`;

  prevBtn.disabled = currentSentence === 0;

  nextBtn.disabled =
    currentSentence === sentences.length - 1;
}

prevBtn.addEventListener('click', () => {
  if (currentSentence > 0) {
    showSentence(currentSentence - 1);
  }
});

nextBtn.addEventListener('click', () => {
  if (currentSentence < sentences.length - 1) {
    showSentence(currentSentence + 1);
  }
});

showSentence(0);
</script>

</html>
