<html lang="vi">

<style>
:root {
  --ink: #49394e;
  --paper: #fffaf4;
  --rose: #d78cae;
  --muted: #9a8297;
  --line: #e9d6e1;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 16px;
  display: grid;
  place-items: center;
  position: relative;
  isolation: isolate;
  overflow-x: hidden;
  color: var(--ink);
  font-family: 'Be Vietnam Pro', sans-serif;
  background: #f8dce2;
}

/* =========================
   KHUNG CẢNH TRƯỜNG HỌC
========================= */

.scene {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  background: linear-gradient(
    to bottom,
    #91d4f5 0%,
    #d4efff 55%,
    #ffe4d5 100%
  );
  animation: sky-cycle 36s ease-in-out infinite;
}

/* Bầu trời: sáng -> chiều -> tối nhẹ -> sáng */

@keyframes sky-cycle {
  0%, 100% {
    background: linear-gradient(
      to bottom,
      #91d4f5 0%,
      #d4efff 55%,
      #ffe4d5 100%
    );
  }

  25% {
    background: linear-gradient(
      to bottom,
      #6fa9e5 0%,
      #f0c4dc 58%,
      #ffd5a8 100%
    );
  }

  50% {
    background: linear-gradient(
      to bottom,
      #e98caa 0%,
      #f8c4b4 58%,
      #f7d6b0 100%
    );
  }

  75% {
    background: linear-gradient(
      to bottom,
      #e8b8d9 0%,
      #c7d9f5 58%,
      #ffe8d1 100%
    );
  }
}

/* Mặt trời chạy ngang bầu trời */

.sun {
  position: absolute;
  top: 9%;
  left: 8%;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #fff1a8;
  box-shadow: 0 0 35px #fff2a888;
  animation: sun-travel 36s ease-in-out infinite;
}

@keyframes sun-travel {
  0%, 100% {
    left: 8%;
    top: 12%;
    opacity: 1;
    transform: scale(1);
  }

  25% {
    left: 45%;
    top: 6%;
    opacity: 1;
    transform: scale(1.1);
  }

  50% {
    left: 82%;
    top: 38%;
    opacity: .8;
    transform: scale(.85);
  }

  75% {
    left: 48%;
    top: 15%;
    opacity: 1;
    transform: scale(1);
  }
}

/* Mây trôi */

.cloud {
  position: absolute;
  width: 100px;
  height: 28px;
  border-radius: 40px;
  background: #ffffffbd;
  opacity: .85;
  animation: cloud-drift 28s linear infinite;
}

.cloud::before,
.cloud::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  background: inherit;
}

.cloud::before {
  width: 40px;
  height: 40px;
  left: 15px;
  top: -18px;
}

.cloud::after {
  width: 52px;
  height: 52px;
  right: 13px;
  top: -27px;
}

.cloud-1 {
  top: 16%;
  left: -130px;
}

.cloud-2 {
  top: 31%;
  left: -220px;
  transform: scale(.7);
  animation-delay: -12s;
}

.cloud-3 {
  top: 8%;
  left: -180px;
  transform: scale(.55);
  animation-delay: -21s;
}

@keyframes cloud-drift {
  from {
    margin-left: 0;
  }

  to {
    margin-left: calc(100vw + 350px);
  }
}

/* =========================
   NGÔI TRƯỜNG
========================= */

.school {
  position: absolute;
  width: min(620px, 82vw);
  height: 220px;
  left: 50%;
  top: 21%;
  transform: translateX(-50%);
  animation: school-light 36s ease-in-out infinite;
}

@keyframes school-light {
  0%, 100% {
    filter: brightness(1);
  }

  50% {
    filter: brightness(.88);
  }
}

.roof {
  position: absolute;
  top: 0;
  left: -4%;
  width: 108%;
  height: 40px;
  background: #cb777f;
  clip-path: polygon(4% 100%, 50% 0, 96% 100%);
  filter: drop-shadow(0 4px 0 #9f596c);
}

.school-body {
  position: absolute;
  left: 4%;
  right: 4%;
  top: 34px;
  height: 150px;
  background: #fff1d5;
  border: 5px solid #dca5a0;
  border-bottom: 9px solid #c47c83;
}

.school-sign {
  position: absolute;
  left: 50%;
  top: 7px;
  transform: translateX(-50%);
  width: 72%;
  text-align: center;
  color: #a95d68;
  font-size: clamp(9px, 1.8vw, 13px);
  font-weight: 600;
  letter-spacing: .13em;
  white-space: nowrap;
}

.windows {
  position: absolute;
  left: 7%;
  right: 7%;
  top: 47px;
  display: flex;
  justify-content: space-between;
}

.window {
  width: 12%;
  height: 48px;
  border: 4px solid #d7a19a;
  background: #9dd8ef;
  box-shadow: inset 0 0 0 2px #fff1d5;
}

.window::after {
  content: '';
  display: block;
  height: 100%;
  width: 2px;
  margin: auto;
  background: #fff1d5;
}

.door {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 48px;
  height: 65px;
  background: #9a6970;
  border: 4px solid #f8d9ae;
  border-bottom: 0;
  border-radius: 22px 22px 0 0;
}

.door::after {
  content: '';
  position: absolute;
  right: 6px;
  top: 35px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #ffe7a8;
}

.school-steps {
  position: absolute;
  left: 50%;
  top: 184px;
  transform: translateX(-50%);
  width: 90px;
  height: 12px;
  background: #e5b2a0;
  box-shadow: 0 12px 0 #d49b92, 0 24px 0 #c98e8a;
}

/* Lá cờ trên nóc trường */

.flag-pole {
  position: absolute;
  top: -28px;
  left: 50%;
  width: 3px;
  height: 30px;
  background: #8c6c78;
}

.flag {
  position: absolute;
  top: 0;
  left: 3px;
  width: 27px;
  height: 17px;
  background: #e66e7c;
  transform-origin: left center;
  animation: flag-wave 1.5s ease-in-out infinite alternate;
}

.flag::after {
  content: '★';
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #fff1b2;
  font-size: 11px;
}

@keyframes flag-wave {
  from {
    transform: skewY(0deg);
  }

  to {
    transform: skewY(8deg);
  }
}

/* =========================
   SÂN TRƯỜNG
========================= */

.yard {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 37%;
  min-height: 180px;
  background: linear-gradient(
    to bottom,
    #9acb91 0%,
    #7fba79 17%,
    #e8bd9f 18%,
    #d9a98f 100%
  );
}

.yard::before {
  content: '';
  position: absolute;
  top: 18%;
  left: 0;
  width: 100%;
  height: 3px;
  background: #fff0cf80;
}

.yard-line {
  position: absolute;
  top: 19%;
  left: 0;
  right: 0;
  height: 80%;
  background: repeating-linear-gradient(
    90deg,
    transparent 0 95px,
    #fff1d540 96px 98px
  );
  opacity: .55;
}

/* Bồn cây */

.tree {
  position: absolute;
  bottom: 79%;
  width: 16px;
  height: 66px;
  background: #936b58;
}

.tree::before {
  content: '';
  position: absolute;
  width: 62px;
  height: 66px;
  left: 50%;
  top: -44px;
  transform: translateX(-50%);
  border-radius: 48% 52% 43% 57%;
  background: #6ca879;
  box-shadow:
    -18px 12px 0 #82bb84,
    16px 16px 0 #8ac58a;
}

.tree-1 {
  left: 8%;
}

.tree-2 {
  right: 8%;
}
