
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f5">
  <meta name="description" content="Một lời chúc nhỏ dành riêng cho bạn nhân ngày 20/10.">
  <title>gâu gâu · 20.10</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --pink: #e8a4ba;
      --deep-pink: #b65f82;
      --cream: #fff9f4;
      --ink: #644552;
      --muted: #a17b8a;
      --green: #88b98a;
      --dark-green: #557e5a;
      --line: #e8b7c9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 26px 18px 85px;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
      color: var(--ink);
      font-family: 'Be Vietnam Pro', sans-serif;
      background:
        radial-gradient(ellipse at 50% 15%, #ffffff 0%, transparent 42%),
        linear-gradient(180deg, #ffe8f0 0%, #fff1f4 53%, #d8edcf 100%);
    }

    /* Bầu trời vườn anh đào */
    .garden-sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -2;
      background:
        radial-gradient(ellipse at 50% 30%, #fffaf9a8, transparent 58%),
        linear-gradient(180deg, #fbdce8 0%, #fff0f5 68%, #dcefd2 100%);
    }

    /* Mặt cỏ */
    .ground {
      position: fixed;
      z-index: -1;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 18vh;
      min-height: 100px;
      background:
        radial-gradient(ellipse at 20% 5%, #c0dfa6 0%, transparent 42%),
        radial-gradient(ellipse at 80% 0%, #b1d59b 0%, transparent 40%),
        linear-gradient(180deg, #a9d49b 0%, #80b97c 100%);
      border-radius: 48% 48% 0 0 / 12% 12% 0 0;
    }

    .ground::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: .55;
      background:
        radial-gradient(ellipse at 10% 30%, #e1f0bc 0 2px, transparent 3px),
        radial-gradient(ellipse at 25% 65%, #e1f0bc 0 2px, transparent 3px),
        radial-gradient(ellipse at 43% 35%, #e1f0bc 0 2px, transparent 3px),
        radial-gradient(ellipse at 63% 70%, #e1f0bc 0 2px, transparent 3px),
        radial-gradient(ellipse at 82% 35%, #e1f0bc 0 2px, transparent 3px),
        radial-gradient(ellipse at 94% 60%, #e1f0bc 0 2px, transparent 3px);
    }

    /* Hai cây anh đào hai bên */
    .tree {
      position: fixed;
      z-index: -1;
      bottom: 9vh;
      width: 220px;
      height: 490px;
      pointer-events: none;
      transform-origin: bottom center;
    }

    .tree.left {
      left: -28px;
    }

    .tree.right {
      right: -28px;
      transform: scaleX(-1);
    }

    .trunk {
      position: absolute;
      bottom: 0;
      left: 46%;
      width: 27px;
      height: 330px;
      border-radius: 50% 50% 8px 8px;
      background: linear-gradient(90deg, #795347, #ad7c68 45%, #795347);
      transform: rotate(-5deg);
      transform-origin: bottom center;
    }

    .trunk::before {
      content: '';
      position: absolute;
      width: 17px;
      height: 185px;
      left: -46px;
      top: 30px;
      border-radius: 80% 10% 0 0;
      background: linear-gradient(90deg, #795347, #b58970);
      transform: rotate(-39deg);
      transform-origin: bottom center;
    }

    .trunk::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 205px;
      left: 22px;
      top: -5px;
      border-radius: 10% 80% 0 0;
      background: linear-gradient(90deg, #a77a63, #795347);
      transform: rotate(36deg);
      transform-origin: bottom center;
    }

    .blossom {
      position: absolute;
      width: 140px;
      height: 125px;
      border-radius: 48% 52% 48% 52%;
      background:
        radial-gradient(ellipse at 30% 30%, #fff9fc 0 5%, transparent 6%),
        radial-gradient(ellipse at 58% 22%, #fff7fa 0 8%, transparent 9%),
        radial-gradient(ellipse at 78% 45%, #f4b5ce 0 12%, transparent 13%),
        radial-gradient(ellipse at 37% 55%, #f8c4d8 0 15%, transparent 16%),
        radial-gradient(ellipse at 68% 75%, #efacc7 0 13%, transparent 14%),
        radial-gradient(ellipse at 35% 30%, #f4bdd3 0%, #eaa3bf 72%, transparent 74%);
      filter: drop-shadow(0 4px 8px #bd78922a);
    }

    .blossom::before,
    .blossom::after {
      content: '';
      position: absolute;
      width: 105px;
      height: 95px;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 25% 30%, #fff5fa 0 8%, transparent 9%),
        radial-gradient(ellipse at 70% 40%, #f5bad0 0 13%, transparent 14%),
        radial-gradient(ellipse at 45% 65%, #edabc5 0 15%, transparent 16%),
        #f8c6d9;
    }

    .blossom::before {
      top: -43px;
      left: -26px;
    }

    .blossom::after {
      top: -24px;
      right: -36px;
    }

    .b1 { top: 30px; left: 4px; transform: rotate(-15deg); }
    .b2 { top: 93px; left: 55px; transform: scale(.85) rotate(18deg); }
    .b3 { top: 135px; left: -10px; transform: scale(.78) rotate(40deg); }
    .b4 { top: 5px; left: 90px; transform: scale(.67) rotate(-35deg); }

    /* Một vài cánh hoa trên cỏ */
    .grass-flower {
      position: fixed;
      z-index: -1;
      bottom: 4vh;
      font-size: 15px;
      opacity: .8;
      pointer-events: none;
    }

    .gf1 { left: 12%; }
    .gf2 { left: 29%; bottom: 7vh; font-size: 11px; }
    .gf3 { right: 15%; bottom: 6vh; }
    .gf4 { right: 31%; font-size: 12px; }

    .wrap {
      position: relative;
      z-index: 2;
      width: min(100%, 560px);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      letter-spacing: .2em;
      color: #a67589;
      text-transform: uppercase;
      padding: 0 4px;
    }

    .top span:last-child {
      letter-spacing: .12em;
    }

    .card {
      position: relative;
      width: 100%;
      margin: 22px auto 14px;
      padding: 30px 32px;
      background: linear-gradient(145deg, #fffaf8f5, #fff1f5f2);
      border: 1px solid #eab9cb;
      border-radius: 8px;
      box-shadow:
        0 18px 55px #ad718529,
        0 0 35px #fff9f9a8;
      backdrop-filter: blur(8px);
      animation: card-glow 5s ease-in-out infinite alternate;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid #e7b5c8a3;
      border-radius: 4px;
      pointer-events: none;
    }

    @keyframes card-glow {
      0% {
        box-shadow: 0 18px 55px #ad718529, 0 0 18px #f4c5d42b;
        border-color: #eab9cb;
      }
      100% {
        box-shadow: 0 18px 55px #ad718529, 0 0 38px #e6a6c24d;
        border-color: #d994b0;
      }
    }

    .flower {
      margin-bottom: 6px;
      text-align: center;
      font-size: 25px;
      color: var(--pink);
      animation: flower-sway 4s ease-in-out infinite;
    }

    @keyframes flower-sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    h1 {
      margin: 0 0 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 500;
      line-height: 1;
      text-align: center;
      color: #755060;
    }

    h1 em {
      color: var(--deep-pink);
      font-weight: 600;
      text-shadow: 0 0 25px #e9b2c72e;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px 0;
      color: var(--pink);
    }

    .divider::before,
    .divider::after {
      content: '';
      width: 42px;
      height: 1px;
      background: var(--line);
    }

    .letter {
      min-height: 145px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 2px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 23px;
      line-height: 1.65;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .letter p {
      width: 100%;
      margin: 0;
      white-space: normal;
    }

    #sentence-text span {
      display: inline;
      opacity: 0;
      filter: blur(3px);
      animation: letter-appear .28s ease-out forwards;
      animation-delay: var(--delay);
    }

    @keyframes letter-appear {
      from {
        opacity: 0;
        filter: blur(3px);
      }
      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    .letter-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .letter-nav button {
      padding: 10px 12px;
      border: 1px solid #e5b2c6;
      border-radius: 5px;
      background: #fce8ef;
      color: #87576a;
      font: 11px 'Be Vietnam Pro', sans-serif;
      cursor: pointer;
      transition: background .25s ease, border-color .25s ease, opacity .25s ease;
    }

    .letter-nav button:hover:not(:disabled) {
      background: #f8d6e3;
      border-color: var(--deep-pink);
    }

    .letter-nav button:disabled {
      opacity: .35;
      cursor: default;
    }

    #sentence-count {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .sign {
      margin-top: 26px;
      text-align: right;
      color: var(--deep-pink);
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-style: italic;
    }

    .back {
      display: block;
      margin: 17px auto 0;
      text-align: center;
      text-decoration: none;
      color: #a17b8a;
      font-size: 11px;
      letter-spacing: .04em;
      transition: color .2s ease;
    }

    .back:hover {
      color: var(--deep-pink);
    }

    footer {
      text-align: center;
      color: #9c7887;
      font-size: 10px;
      letter-spacing: .08em;
    }

    footer .heart {
      color: var(--deep-pink);
    }

    /* Cánh hoa anh đào rơi */
    .petal {
      position: fixed;
      top: -30px;
      z-index: 1;
      width: 12px;
      height: 16px;
      border-radius: 80% 15% 75% 20%;
      background: linear-gradient(135deg, #fff2f7 0%, #f7c0d5 65%, #eaa0bd 100%);
      box-shadow: 0 2px 5px #bd7c9620;
      pointer-events: none;
      animation: petal-fall var(--duration) linear forwards;
      will-change: transform;
    }

    .petal:nth-child(3n) {
      width: 9px;
      height: 12px;
      background: linear-gradient(135deg, #fff8fb, #f2b3cc);
    }

    .petal:nth-child(4n) {
      border-radius: 70% 30% 60% 35%;
    }

    @keyframes petal-fall {
      0% {
        transform: translate3d(0, -5vh, 0) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: .9; }
      50% {
        transform: translate3d(var(--drift), 50vh, 0) rotate(300deg);
      }
      90% { opacity: .8; }
      100% {
        transform: translate3d(calc(var(--drift) * -.4), 110vh, 0) rotate(650deg);
        opacity: 0;
      }
    }

    @media (max-width: 700px) {
      .tree {
        transform: scale(.72);
        transform-origin: bottom left;
        bottom: 8vh;
      }

      .tree.left {
        left: -70px;
      }

      .tree.right {
        right: -70px;
        transform: scaleX(-1) scale(.72);
        transform-origin: bottom center;
      }

      .ground {
        height: 14vh;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 14px 12px 70px;
      }

      .card {
        margin: 12px auto;
        padding: 24px 20px;
      }

      .letter {
        min-height: 155px;
        font-size: 22px;
      }

      .letter-nav {
        gap: 6px;
      }

      .letter-nav button {
        padding: 9px 8px;
        font-size: 10px;
      }

      .tree {
        opacity: .82;
        transform: scale(.52);
        bottom: 7vh;
      }

      .tree.left {
        left: -100px;
      }

      .tree.right {
        right: -100px;
        transform: scaleX(-1) scale(.52);
      }

      .top {
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .flower {
        animation: none;
      }

      #sentence-text span {
        animation: none;
        opacity: 1;
        filter: none;
      }

      .petal {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="garden-sky" aria-hidden="true"></div>

  <div class="tree left" aria-hidden="true">
    <div class="trunk"></div>
    <div class="blossom b1"></div>
    <div class="blossom b2"></div>
    <div class="blossom b3"></div>
    <div class="blossom b4"></div>
  </div>

  <div class="tree right" aria-hidden="true">
    <div class="trunk"></div>
    <div class="blossom b1"></div>
    <div class="blossom b2"></div>
    <div class="blossom b3"></div>
    <div class="blossom b4"></div>
  </div>

  <div class="ground" aria-hidden="true"></div>
  <div class="grass-flower gf1" aria-hidden="true">🌸</div>
  <div class="grass-flower gf2" aria-hidden="true">✿</div>
  <div class="grass-flower gf3" aria-hidden="true">🌸</div>
  <div class="grass-flower gf4" aria-hidden="true">✿</div>

  <main class="wrap">
    <header class="top">
      <span>20 · 10 · 2026</span>
      <span>a little flower for you ♡</span>
    </header>

    <article class="card">
      <div class="flower" aria-hidden="true">❀</div>

      <h1><em>gâu gâu</em></h1>

      <div class="divider" aria-hidden="true">♡</div>

      <section class="letter" aria-label="Lời chúc">
        <p id="sentence-text" aria-live="polite">
          Chào Nàng công chúa của tôi, tôi là một trong những chàng hoàng tử của lớp 12.10.
        </p>
      </section>

      <div class="letter-nav">
        <button id="prev-btn" type="button" disabled>
          ← Câu trước
        </button>

        <span id="sentence-count">1 / 6</span>

        <button id="next-btn" type="button">
          Câu tiếp theo →
        </button>
      </div>

      <a class="back" href="https://women12102010.github.io/women1210.github.io/">
        ← Quay lại phong bì
      </a>
    </article>

    <footer>
      gâu gâu <span class="heart">♡</span> with love
    </footer>
  </main>

  <script>
    const reduceMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

    // Tạo cánh hoa anh đào rơi
    function createPetal() {
      if (document.hidden || reduceMotion) return;

      const petal = document.createElement('span');
      petal.className = 'petal';

      petal.style.left = `${Math.random() * 100}%`;
      petal.style.setProperty(
        '--duration',
        `${7 + Math.random() * 8}s`
      );
      petal.style.setProperty(
        '--drift',
        `${-100 + Math.random() * 200}px`
      );

      petal.style.opacity = `${0.45 + Math.random() * 0.5}`;

      document.body.appendChild(petal);

      petal.addEventListener('animationend', () => {
        petal.remove();
      }, { once: true });
    }

    if (!reduceMotion) {
      // Rải một số cánh hoa ngay khi mở trang
      for (let i = 0; i < 18; i++) {
        setTimeout(createPetal, i * 250);
      }

      // Tiếp tục cho hoa rơi đều
      setInterval(createPetal, 420);
    }

    const sentences = [
      "Chào Nàng công chúa của tôi, tôi là một trong những chàng hoàng tử của lớp 12.10.",
      "Thời gian thấm thoát thoi đưa, ngày để tôi được bên cạnh em không còn nhiều nữa.",
      "Nhân dịp ngày mai là ngày 20/10, tôi một gửi cho em những lời nhắc nhở khi không có tôi ở cạnh em.",
      "BThy à, em là một cô gái dễ thương, hoà đồng và đối với tôi em là nàng công chúa khiến tôi ấn tượng nhất trong 14 công chúa.",
      "Học lực của em rất tốt nhưng em lại luôn tự ti về bản thân mình (nhất là trước giờ kiểm tra như “T chưa học bài m ơi, bài ni t k bt làmm, …) nhưng phát bài ra toàn 9,10đ 🙂.",
      "Trước khi đi có vài lời nhắn nhủ tôi muốn gửi đến em:",
      "Trời bắt đầu trở lạnh rồi ra đường nhớ phải mặc áo ấm;",
      "Học tập thật chăm chỉ cho kì thi quan trọng nhất của mình;",
      "Cuối cùng là phải giữ gìn sức khoẻ.",
      " Đến giờ tôi phải đi rồi, tạm biệt nha nàng công chúa của tôi!"
    ];

    let currentSentence = 0;

    const sentenceText = document.getElementById('sentence-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const sentenceCount = document.getElementById('sentence-count');

    function showSentence(index) {
      currentSentence = index;
      const text = sentences[currentSentence];

      sentenceText.replaceChildren();

      if (reduceMotion) {
        sentenceText.textContent = text;
      } else {
        [...text].forEach((char, i) => {
          const span = document.createElement('span');

          span.textContent = char === ' ' ? '\u00A0' : char;
          span.style.setProperty('--delay', `${i * 0.025}s`);

          sentenceText.appendChild(span);
        });
      }

      sentenceCount.textContent =
        `${currentSentence + 1} / ${sentences.length}`;

      prevBtn.disabled = currentSentence === 0;
      nextBtn.disabled = currentSentence === sentences.length - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (currentSentence > 0) {
        showSentence(currentSentence - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentSentence < sentences.length - 1) {
        showSentence(currentSentence + 1);
      }
    });

    showSentence(0);
  </script>
</body>
</html>
