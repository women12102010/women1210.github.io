
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#DFF1FF">
  <meta name="description" content="Một lời chúc nhỏ dành riêng cho bạn nhân ngày 20/10.">

  <title>Thúy Hiền</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;
      --cream: #EAF6FF;
      --rose: #F2AFA9;
      --deep-rose: #D98285;
      --brown: #40536B;
      --muted: #71839B;
      --paper: #FFFFFF;
      --line: #D9828550;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 26px 18px;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
      color: var(--brown);
      font-family: 'Be Vietnam Pro', sans-serif;

      background:
        radial-gradient(
          ellipse at 92% 8%,
          #FFF2C7 0%,
          transparent 24%
        ),
        linear-gradient(
          180deg,
          #C7E6FF 0%,
          #E4F2FF 42%,
          #FFF0E5 100%
        );
    }

    /* =========================
       BẦU TRỜI
    ========================= */

    .sky {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    /* Mặt trời */

    .sun {
      position: absolute;
      top: -65px;
      right: -55px;
      width: 270px;
      height: 270px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      opacity: .95;
      filter: drop-shadow(0 0 35px #FFE8A888);
    }

    .sun-rays {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        #FFE9A880 0deg 5deg,
        transparent 5deg 15deg
      );
      -webkit-mask: radial-gradient(
        circle,
        transparent 0 38%,
        #000 43% 68%,
        transparent 74%
      );
      mask: radial-gradient(
        circle,
        transparent 0 38%,
        #000 43% 68%,
        transparent 74%
      );
      animation: sun-rays-rotate 100s linear infinite;
    }

    .sun-core {
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 35% 30%,
        #FFF9D8,
        #FFE8A0 60%,
        #FFD58B
      );
      box-shadow:
        0 0 35px #FFE9A888,
        0 0 75px #FFE9A855;
      animation: sun-breathe 5s ease-in-out infinite alternate;
    }

    @keyframes sun-rays-rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes sun-breathe {
      from {
        transform: scale(.97);
        box-shadow:
          0 0 30px #FFE9A866,
          0 0 60px #FFE9A844;
      }

      to {
        transform: scale(1.04);
        box-shadow:
          0 0 42px #FFE9A899,
          0 0 85px #FFE9A866;
      }
    }

    /* Mây CSS */

    .cloud {
      --cloud-color: #FFFFFF;
      position: absolute;
      width: 120px;
      height: 35px;
      background: var(--cloud-color);
      border-radius: 50px;
      opacity: .78;
      filter: drop-shadow(0 5px 8px #91B8D622);
      animation: cloud-drift var(--drift, 45s) ease-in-out infinite alternate;
      will-change: transform;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      bottom: 8px;
      background: inherit;
      border-radius: 50%;
    }

    .cloud::before {
      width: 55px;
      height: 55px;
      left: 17px;
    }

    .cloud::after {
      width: 72px;
      height: 70px;
      right: 13px;
    }

    .cloud span {
      position: absolute;
      z-index: 1;
      width: 42px;
      height: 30px;
      left: 48px;
      bottom: 8px;
      background: inherit;
      border-radius: 50%;
    }

    /* Mây lớn bên trái */

    .cloud-1 {
      top: 17%;
      left: -45px;
      transform: scale(1.15);
      --drift: 32s;
      --cloud-color: #FFFFFF;
    }

    /* Mây nhỏ phía trên */

    .cloud-2 {
      top: 31%;
      left: 33%;
      transform: scale(.65);
      opacity: .6;
      --drift: 42s;
      --cloud-color: #FFFDF8;
      animation-delay: -8s;
    }

    /* Mây bông bên phải */

    .cloud-3 {
      top: 48%;
      right: -35px;
      transform: scale(1.1);
      opacity: .55;
      --drift: 38s;
      --cloud-color: #FFFFFF;
      animation-delay: -14s;
    }

    /* Mây xa */

    .cloud-4 {
      top: 70%;
      left: 12%;
      transform: scale(.7);
      opacity: .48;
      --drift: 48s;
      --cloud-color: #FFF8F0;
      animation-delay: -20s;
    }

    /* Mây nhỏ gần chân trời */

    .cloud-5 {
      top: 84%;
      right: 15%;
      transform: scale(.85);
      opacity: .55;
      --drift: 35s;
      --cloud-color: #FFFFFF;
      animation-delay: -11s;
    }

    /* Mây dài, thấp */

    .cloud-6 {
      top: 58%;
      left: 48%;
      transform: scale(.5);
      opacity: .4;
      --drift: 55s;
      --cloud-color: #FFFDFB;
      animation-delay: -25s;
    }

    @keyframes cloud-drift {
      0% {
        translate: -12px 0;
      }

      50% {
        translate: 25px -9px;
      }

      100% {
        translate: 65px 4px;
      }
    }

    /* =========================
       NỘI DUNG LÁ THƯ
    ========================= */

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      letter-spacing: .2em;
      color: #637D9A;
      text-transform: uppercase;
    }

    .top span:last-child {
      letter-spacing: .12em;
    }

    .card {
      position: relative;
      width: 100%;
      margin: 22px auto 14px;
      padding: 30px 32px;

      background: linear-gradient(
        145deg,
        #FFFFFFF2,
        #FFFDF8ED
      );

      border: 1px solid #FFFFFF;
      border-radius: 5px;

      box-shadow:
        0 18px 55px #7298B52B,
        0 0 35px #FFFFFF50;

      backdrop-filter: blur(8px);
      animation: card-glow 5s ease-in-out infinite alternate;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid #E5B8A650;
      pointer-events: none;
    }

    @keyframes card-glow {
      0% {
        box-shadow:
          0 18px 55px #7298B520,
          0 0 18px #FFFFFF30;
        border-color: #FFFFFF;
      }

      50% {
        box-shadow:
          0 18px 55px #7298B535,
          0 0 28px #FFF9E866;
        border-color: #FFFFFF;
      }

      100% {
        box-shadow:
          0 18px 55px #7298B530,
          0 0 38px #FFE8C655;
        border-color: #FFEEDB;
      }
    }

    .eyebrow {
      margin: 0 0 18px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--deep-rose);
    }

    .flower {
      margin-bottom: 6px;
      text-align: center;
      font-size: 23px;
      color: var(--rose);
    }

    h1 {
      margin: 0 0 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 7vw, 56px);
      font-weight: 500;
      line-height: 1;
      text-align: center;
    }

    h1 em {
      color: var(--deep-rose);
      font-weight: 600;
      text-shadow: 0 0 32px #D9828528;
    }

    .intro {
      max-width: 430px;
      margin: 0 auto 30px;
      text-align: center;
      font-size: 13px;
      line-height: 1.9;
      color: var(--muted);
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px 0;
      color: var(--rose);
    }

    .divider::before,
    .divider::after {
      content: '';
      width: 42px;
      height: 1px;
      background: var(--line);
    }

    .letter {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 2px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 21px;
      line-height: 1.65;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .letter p {
      width: 100%;
      margin: 0;
      white-space: normal;
    }

    /* Nút chuyển câu */

    .letter-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .letter-nav button {
      padding: 9px 12px;
      border: 1px solid #D9828555;
      border-radius: 3px;
      background: #D982850D;
      color: var(--brown);
      font: 11px 'Be Vietnam Pro', sans-serif;
      cursor: pointer;
      transition:
        background .25s ease,
        border-color .25s ease,
        opacity .25s ease;
    }

    .letter-nav button:hover:not(:disabled) {
      background: #D9828520;
      border-color: var(--deep-rose);
    }

    .letter-nav button:disabled {
      opacity: .3;
      cursor: default;
    }

    #sentence-count {
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .sign {
      margin-top: 26px;
      text-align: right;
      color: var(--deep-rose);
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-style: italic;
    }

    .back {
      display: block;
      margin: 17px auto 0;
      text-align: center;
      text-decoration: none;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
    }

    .back:hover {
      color: var(--deep-rose);
    }

    footer {
      text-align: center;
      color: #71839B;
      font-size: 10px;
      letter-spacing: .08em;
    }

    footer .heart {
      color: var(--deep-rose);
    }

    /* Chữ xuất hiện từng ký tự */

    #sentence-text {
      opacity: 1;
      overflow-wrap: anywhere;
    }

    #sentence-text span {
      display: inline;
      opacity: 0;
      filter: blur(3px);
      animation: letter-appear .28s ease-out forwards;
      animation-delay: var(--delay);
    }

    @keyframes letter-appear {
      from {
        opacity: 0;
        filter: blur(3px);
      }

      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    /* Tối ưu điện thoại */

    @media (max-width: 480px) {
      body {
        padding: 14px 12px;
      }

      .sun {
        top: -80px;
        right: -95px;
        transform: scale(.85);
      }

      .cloud-1 {
        top: 12%;
      }

      .cloud-2 {
        left: 20%;
      }

      .cloud-4 {
        left: -12%;
      }

      .card {
        margin: 12px auto;
        padding: 24px 20px;
      }

      .letter {
        min-height: 110px;
        font-size: 20px;
      }

      .letter-nav {
        gap: 6px;
      }

      .letter-nav button {
        padding: 9px 8px;
        font-size: 10px;
      }
    }

    /* Tôn trọng cài đặt giảm chuyển động */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      #sentence-text span {
        animation: none;
        opacity: 1;
        filter: none;
      }
    }
  </style>
</head>

<body>
  <div class="sky" id="sky" aria-hidden="true">

    <!-- Mặt trời và những tia nắng -->
    <div class="sun">
      <div class="sun-rays"></div>
      <div class="sun-core"></div>
    </div>

    <!-- Những đám mây trôi trên bầu trời -->
    <div class="cloud cloud-1"><span></span></div>
    <div class="cloud cloud-2"><span></span></div>
    <div class="cloud cloud-3"><span></span></div>
    <div class="cloud cloud-4"><span></span></div>
    <div class="cloud cloud-5"><span></span></div>
    <div class="cloud cloud-6"><span></span></div>

  </div>

  <main class="wrap">

    <header class="top">
      <span>20 · 10 · 2026</span>
    </header>

    <article class="card">

      <div class="flower" aria-hidden="true">❀</div>

      <h1>
        <em>Gửi Thúy Bò</em>
      </h1>

      <div class="divider" aria-hidden="true">♡</div>

      <section class="letter" aria-label="Lời chúc">
        <p id="sentence-text" aria-live="polite">
          thấm thoát ms chỉ 2 năm trôi qa mà chừ Trịnh Thúy Hiền đã thống nhất TCV r.
        </p>
      </section>

      <div class="letter-nav">
        <button id="prev-btn" type="button" disabled>
          ← Câu trước
        </button>

        <span id="sentence-count">1 / 6</span>

        <button id="next-btn" type="button">
          Câu tiếp theo →
        </button>
      </div>

      <a
        class="back"
        href="https://women12102010.github.io/women1210.github.io/"
      >
        ← Quay lại phong bì
      </a>

    </article>


  </main>

  <script>
    const sentences = [
      "thấm thoát ms chỉ 2 năm trôi qa mà chừ Trịnh Thúy Hiền đã thống nhất TCV r.",

      "Vậy là cbi ph xa nhau r bn tôi ơi, cx k lâu nx thì chúng mik ph bc đi trên đoạn đg tương lai của riêng mik r nên cơ hội để gặp lại nhau cs vẻ là rất khó nên qa ngày 20/10 này chúng mik cs lm vài món quà để gửi đến bn Hiền cùng lời chúc cùng lời chào trân trọng nhất.",

      "Chúc bn Hiền cs một ngày 20/10 tht là đáng nhớ, hạnh phúc và đầy niềm vui, mong cho phút giây này sẽ là 1 kỉ niệm đáng nhớ sẽ theo bn trên con đg tương lai.",

      "Chúc cho bạn luôn mạnh mẽ để đối đầu với mọi khó khăn.",

      "Chúc Hiền lun lun xinh đẹp, bùng nổ, đẳng cấp, sức khỏe mạnh mẽ bomchakalaka, đạt đc nguyện vọng là đi du hc Pháp để mở 1 quầy chuối chiên dưới tháp effiel nè và nhớ là luôn luôn ph giữ 1 tinh thần tích cực và nỡ nụ cười trên môi nha.",

      "Au revoir et à bientôt."
    ];

    let currentSentence = 0;

    const sentenceText = document.getElementById('sentence-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const sentenceCount = document.getElementById('sentence-count');

    const reduceMotion = window.matchMedia(
      '(prefers-reduced-motion: reduce)'
    ).matches;

    function showSentence(index) {
      currentSentence = index;

      const text = sentences[currentSentence];

      sentenceText.replaceChildren();

      if (reduceMotion) {
        sentenceText.textContent = text;
      } else {
        [...text].forEach((char, i) => {
          const span = document.createElement('span');

          span.textContent = char === ' ' ? '\u00A0' : char;

          span.style.setProperty(
            '--delay',
            `${i * 0.025}s`
          );

          sentenceText.appendChild(span);
        });
      }

      sentenceCount.textContent =
        `${currentSentence + 1} / ${sentences.length}`;

      prevBtn.disabled = currentSentence === 0;

      nextBtn.disabled =
        currentSentence === sentences.length - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (currentSentence > 0) {
        showSentence(currentSentence - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentSentence < sentences.length - 1) {
        showSentence(currentSentence + 1);
      }
    });

    showSentence(0);
  </script>
</body>
</html>
