<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bắt vịt chạy loạn 🦆</title>

<style>
:root {
  --ink: #344b3a;
  --cream: #fff7df;
  --green: #83c96d;
  --dark-green: #477c4d;
  --pink: #f5b9c5;
  --brown: #926344;
  --gold: #f4cf75;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  color: var(--ink);
  background:
    radial-gradient(circle at 15% 20%, #fff8df 0 3px, transparent 4px),
    radial-gradient(circle at 85% 70%, #ffffff80 0 4px, transparent 5px),
    #dff2d4;
  font-family: "Courier New", monospace;
}

button {
  font-family: inherit;
  touch-action: manipulation;
  cursor: pointer;
}

.game-shell {
  width: min(100%, 650px);
  padding: 15px;
  border: 4px solid #557b4c;
  border-radius: 8px;
  background: var(--cream);
  box-shadow: 0 8px 0 #b5d5a2, 0 14px 30px #496b4430;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.header h1 {
  margin: 0;
  font-size: clamp(18px, 4vw, 26px);
}

.subtitle {
  margin: 5px 0 0;
  font-size: 11px;
  color: #71876a;
}

.pixel-flower {
  font-size: 32px;
  flex-shrink: 0;
}

.hud {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.hud-item {
  padding: 9px 5px;
  border: 2px solid #a5c891;
  background: #f4f8df;
  text-align: center;
}

.hud-label {
  display: block;
  font-size: 10px;
  color: #75886c;
  margin-bottom: 5px;
}

.hud-value {
  font-size: 19px;
  font-weight: bold;
}

#time {
  color: #bc6c55;
}

.arena {
  position: relative;
  width: 100%;
  aspect-ratio: 1.2 / 1;
  min-height: 300px;
  overflow: hidden;
  isolation: isolate;
  border: 4px solid #557b4c;
  background: #b9e6a0;
  image-rendering: pixelated;
}

/* Bầu trời và những đám mây */
.sky {
  position: absolute;
  inset: 0 0 47%;
  z-index: -3;
  background: linear-gradient(#b8e8f2, #e0f7e8);
}

.cloud {
  position: absolute;
  width: 76px;
  height: 19px;
  border-radius: 3px;
  background: #ffffffc9;
  box-shadow:
    12px -12px 0 -2px #ffffffc9,
    29px -8px 0 2px #ffffffc9,
    40px 0 0 -2px #ffffffc9;
  opacity: .8;
}

.cloud-one {
  top: 13%;
  left: 10%;
}

.cloud-two {
  top: 24%;
  right: 10%;
  transform: scale(.7);
}

/* Đồi phía xa */
.hill {
  position: absolute;
  z-index: -2;
  bottom: 32%;
  width: 75%;
  height: 29%;
  border-radius: 50% 50% 0 0;
  background: #9bd48b;
}

.hill-left {
  left: -22%;
}

.hill-right {
  right: -25%;
  height: 24%;
  background: #8bc97e;
}

/* Mặt đất */
.ground {
  position: absolute;
  z-index: -1;
  inset: 54% 0 0;
  background:
    radial-gradient(circle, #ffffff70 0 2px, transparent 3px) 0 0 / 29px 27px,
    linear-gradient(#9bd77c, #75bd68);
  border-top: 5px solid #6fae5c;
}

.grass {
  position: absolute;
  bottom: 11%;
  font-size: 21px;
  color: #427c43;
}

.grass-one {
  left: 5%;
}

.grass-two {
  right: 7%;
}

.flower {
  position: absolute;
  bottom: 19%;
  font-size: 20px;
}

.flower-one {
  left: 17%;
}

.flower-two {
  right: 19%;
}

/* Hồ nước pixel art */
.pond {
  position: absolute;
  left: 30%;
  top: 59%;
  width: 40%;
  height: 23%;
  border: 5px solid #398b9c;
  border-radius: 50%;
  background:
    radial-gradient(ellipse at 27% 25%, #d9ffff 0 3%, transparent 4%),
    radial-gradient(ellipse at 68% 62%, #c6faff 0 2%, transparent 3%),
    repeating-linear-gradient(
      165deg,
      transparent 0 17px,
      #ffffff30 18px 20px,
      transparent 21px 31px
    ),
    linear-gradient(
      145deg,
      #b1f4ee 0%,
      #64d2df 38%,
      #48afcb 72%,
      #328da9 100%
    );
  box-shadow:
    inset 0 0 0 4px #d5ffff80,
    inset 0 -12px 18px #247a9a45,
    0 5px 0 #34434a22;
  transform: rotate(-8deg);
  pointer-events: none;
}

.pond::before {
  content: "🪷";
  position: absolute;
  top: -13%;
  left: 17%;
  font-size: clamp(18px, 3vw, 28px);
  filter: drop-shadow(1px 3px 0 #247a9a35);
  transform: rotate(8deg);
}

.pond::after {
  content: "〰 〰 〰";
  position: absolute;
  top: 28%;
  left: 22%;
  color: #f2ffff;
  font-size: clamp(16px, 2.5vw, 23px);
  letter-spacing: 3px;
  text-shadow: 0 2px 0 #398b9c50;
  animation: water-shimmer 2s ease-in-out infinite alternate;
}

@keyframes water-shimmer {
  from {
    transform: translateX(-3px);
    opacity: .6;
  }
  to {
    transform: translateX(5px);
    opacity: 1;
  }
}

/* Vịt */
.duck {
  position: absolute;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 64px;
  height: 64px;
  padding: 0;
  border: 0;
  background: transparent;
  font-size: 47px;
  line-height: 1;
  filter: drop-shadow(2px 4px 0 #344b3a35);
  transform: translate(-50%, -50%);
  transition:
    left .16s ease-out,
    top .16s ease-out,
    transform .12s ease-out;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.duck:hover {
  transform: translate(-50%, -50%) scale(1.12) rotate(-7deg);
}

.duck:active {
  transform: translate(-50%, -50%) scale(.85);
}

.duck.caught {
  animation: duck-caught .3s ease-out forwards;
  pointer-events: none;
}

@keyframes duck-caught {
  to {
    opacity: 0;
    transform: translate(-50%, -100%) scale(.3) rotate(30deg);
  }
}

.floating-text {
  position: absolute;
  z-index: 7;
  pointer-events: none;
  color: #fff9d7;
  font-size: 17px;
  font-weight: bold;
  text-shadow:
    2px 2px #527849,
    -1px -1px #527849;
  animation: float-up .65s ease-out forwards;
}

@keyframes float-up {
  to {
    opacity: 0;
    transform: translateY(-35px) scale(1.2);
  }
}

.arena-message {
  position: absolute;
  z-index: 8;
  top: 12px;
  left: 50%;
  width: max-content;
  max-width: 90%;
  padding: 7px 11px;
  border: 2px solid #557b4c;
  background: #fff9dfeb;
  transform: translateX(-50%);
  text-align: center;
  font-size: 11px;
  line-height: 1.5;
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 13px;
}

.pixel-button {
  padding: 12px 16px;
  border: 3px solid #54784a;
  border-radius: 3px;
  background: #8dce75;
  color: #29472e;
  font-size: 12px;
  font-weight: bold;
  box-shadow: 0 4px 0 #54784a;
  transition: transform .1s, box-shadow .1s;
}

.pixel-button:hover {
  background: #a8e18b;
}

.pixel-button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #54784a;
}

.pixel-button.secondary {
  background: #f6dca0;
}

.instructions {
  margin: 14px 0 2px;
  color: #6f8265;
  font-size: 11px;
  line-height: 1.8;
  text-align: center;
}

/* Màn hình bắt đầu / kết quả */
.overlay {
  position: absolute;
  z-index: 10;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 15px;
  background: #344b3acb;
}

.overlay.hidden {
  display: none;
}

.dialog {
  width: min(100%, 390px);
  max-height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 23px 19px;
  border: 4px solid #9a7653;
  background:
    radial-gradient(circle, #d6b98b40 0 1px, transparent 2px) 0 0 / 13px 13px,
    #fff6dd;
  text-align: center;
  box-shadow: 0 7px 0 #344b3a60;
}

.dialog-icon {
  margin-bottom: 8px;
  font-size: 43px;
}

.dialog h2 {
  margin: 7px 0 12px;
  color: #6a563d;
  font-size: 20px;
}

.dialog p {
  font-size: 12px;
  line-height: 1.9;
}

.dialog-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 17px;
}

/* Lá thư */
.letter-eyebrow {
  margin: 0 0 10px;
  color: #a77850;
  font-size: 10px !important;
  font-weight: bold;
  letter-spacing: 3px;
}

.letter-title {
  color: #72503f;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 21px !important;
  font-weight: normal;
  letter-spacing: -.5px;
}

.letter {
  max-height: 220px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 14px;
  border: 2px dashed #d7b58a;
  background: #fffaf0;
  text-align: left;
  scrollbar-color: #d5a36d #fff3d9;
  scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}

.letter p {
  margin: 0 0 16px;
  font-family: Arial, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.9;
  white-space: normal;
}

.letter .letter-opening {
  color: #875d42;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 17px;
  font-style: italic;
}

.letter .letter-highlight {
  padding: 12px;
  border-left: 3px solid #d5a36d;
  background: #fff3d9;
  color: #875d42;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 17px;
}

.letter .letter-ending {
  margin-top: 22px;
  color: #875d42;
  font-weight: bold;
}

.letter-sign {
  padding-top: 14px;
  border-top: 1px dashed #d5a36d;
  color: #a77850;
  text-align: right;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 13px;
  font-style: italic;
  line-height: 1.9;
}

.letter-scroll-hint {
  margin: 9px 0 !important;
  color: #8b6a51;
  font-size: 10px !important;
}

@media (max-width: 430px) {
  body {
    padding: 9px;
  }

  .game-shell {
    padding: 10px;
  }

  .arena {
    min-height: 280px;
  }

  .duck {
    width: 57px;
    height: 57px;
    font-size: 42px;
  }

  .dialog {
    padding: 17px 12px;
  }

  .letter {
    max-height: 200px;
    padding: 11px;
  }

  .pixel-button {
    padding: 11px 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<main class="game-shell">
  <header class="header">
    <div>
      <h1>🦆 Bắt vịt chạy loạn!</h1>
      <p class="subtitle">20/10</p>
    </div>
    <div class="pixel-flower" aria-hidden="true">🌼</div>
  </header>

  <section class="hud" aria-label="Thông tin trò chơi">
    <div class="hud-item">
      <span class="hud-label">ĐÃ BẮT</span>
      <span class="hud-value"><span id="score">0</span>/5</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">THỜI GIAN</span>
      <span class="hud-value" id="time">30s</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">MỤC TIÊU</span>
      <span class="hud-value">🦆 × 5</span>
    </div>
  </section>

  <section class="arena" id="arena" aria-label="Khu vườn bắt vịt">
    <div class="sky"></div>
    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>
    <div class="hill hill-left"></div>
    <div class="hill hill-right"></div>
    <div class="ground"></div>
    <div class="pond"></div>

    <span class="grass grass-one" aria-hidden="true">♣ ♣</span>
    <span class="grass grass-two" aria-hidden="true">♣ ♣</span>
    <span class="flower flower-one" aria-hidden="true">🌼</span>
    <span class="flower flower-two" aria-hidden="true">🌷</span>

    <div class="arena-message" id="arena-message">
      Bắt được 5 chú vịt trước khi hết giờ nhé!
    </div>

    <div class="overlay" id="start-overlay">
      <div class="dialog">
        <div class="dialog-icon">🦆🌿</div>
        <h2>Bắt Vịt gogogo!</h2>
        <p>
          Có đúng một chú vịt tinh nghịch đang lẩn trốn
          trong khu vườn này.
          <br><br>
          Bắt đủ <strong>5 chú vịt</strong> trong vòng
          <strong>30 giây</strong> để mở khóa một món quà bí mật!
        </p>

        <div class="dialog-buttons">
          <button class="pixel-button" id="start-button" type="button">
            BẮT ĐẦU! ▶
          </button>
        </div>
      </div>
    </div>

    <div class="overlay hidden" id="result-overlay">
      <div class="dialog" id="result-dialog">
        <div class="dialog-icon" id="result-icon">🎉</div>
        <h2 id="result-title">Tuyệt vời!</h2>
        <p id="result-text"></p>
        <div class="dialog-buttons" id="result-buttons">
          <button class="pixel-button" id="letter-button" type="button">
            MỞ QUÀ 💌
          </button>
          <button class="pixel-button secondary" id="retry-button" type="button">
            CHƠI LẠI ↻
          </button>
        </div>
      </div>
    </div>
  </section>

  <div class="controls">
    <button class="pixel-button" id="start-again-button" type="button">
      CHƠI LẠI ↻
    </button>
  </div>

  
</main>

<script>
(() => {
  "use strict";

  const TARGET = 5;
  const ROUND_SECONDS = 30;
  const MOVE_INTERVAL = 425;

  const arena = document.getElementById("arena");
  const scoreElement = document.getElementById("score");
  const timeElement = document.getElementById("time");
  const messageElement = document.getElementById("arena-message");

  const startOverlay = document.getElementById("start-overlay");
  const resultOverlay = document.getElementById("result-overlay");

  const resultIcon = document.getElementById("result-icon");
  const resultTitle = document.getElementById("result-title");
  const resultText = document.getElementById("result-text");
  const resultButtons = document.getElementById("result-buttons");

  let score = 0;
  let timeLeft = ROUND_SECONDS;
  let active = false;
  let duck = null;
  let moveTimer = null;
  let countdownTimer = null;
  let spawnTimer = null;
  let roundId = 0;

  function randomPosition() {
    const rect = arena.getBoundingClientRect();
    const duckSize = 65;

    const marginX = duckSize / 2 + 5;
    const marginY = duckSize / 2 + 5;

    const minX = marginX;
    const maxX = Math.max(minX, rect.width - marginX);

    const minY = 65;
    const maxY = Math.max(minY, rect.height - marginY);

    return {
      x: minX + Math.random() * (maxX - minX),
      y: minY + Math.random() * (maxY - minY)
    };
  }

  function moveDuck() {
    if (!active || !duck || !duck.isConnected) return;

    const pos = randomPosition();
    duck.style.left = `${pos.x}px`;
    duck.style.top = `${pos.y}px`;

    // Thỉnh thoảng vịt quay mặt theo hướng khác.
    duck.style.filter = Math.random() > 0.5
      ? "drop-shadow(2px 4px 0 #344b3a35)"
      : "drop-shadow(2px 4px 0 #344b3a35)";

    if (Math.random() > 0.72) {
      duck.textContent = "🐤";
    } else {
      duck.textContent = "🦆";
    }
  }

  function makeDuck() {
    if (!active || duck) return;

    const newDuck = document.createElement("button");
    newDuck.type = "button";
    newDuck.className = "duck";
    newDuck.textContent = "🦆";
    newDuck.setAttribute("aria-label", "Bắt chú vịt");

    const pos = randomPosition();
    newDuck.style.left = `${pos.x}px`;
    newDuck.style.top = `${pos.y}px`;

    newDuck.addEventListener("pointerdown", catchDuck);

    arena.appendChild(newDuck);
    duck = newDuck;
  }

  function showFloatingText(text, x, y) {
    const pop = document.createElement("div");
    pop.className = "floating-text";
    pop.textContent = text;
    pop.style.left = `${x}px`;
    pop.style.top = `${y}px`;

    arena.appendChild(pop);

    window.setTimeout(() => pop.remove(), 700);
  }

  function catchDuck(event) {
    if (!active || !duck) return;

    event.preventDefault();

    const caughtDuck = duck;
    const rect = caughtDuck.getBoundingClientRect();
    const arenaRect = arena.getBoundingClientRect();

    const x = rect.left - arenaRect.left + rect.width / 2;
    const y = rect.top - arenaRect.top;

    caughtDuck.classList.add("caught");
    caughtDuck.removeEventListener("pointerdown", catchDuck);
    duck = null;

    score++;
    scoreElement.textContent = score;
    showFloatingText(["BẮT ĐƯỢC!", "Ú ÒA!", "DÍNH RỒI!", "QUÁ ĐỈNH!"][Math.floor(Math.random() * 4)], x, y);

    messageElement.textContent = score >= TARGET
      ? "Đã hoàn thành thử thách!"
      : `Bắt được ${score}/${TARGET} chú rồi! Còn nữa đó!`;

    if (score >= TARGET) {
      finishGame(true);
      return;
    }

    // Xóa vịt cũ rồi mới xuất hiện vịt tiếp theo.
    window.setTimeout(() => {
      caughtDuck.remove();
      if (active && !duck) makeDuck();
    }, 180);
  }

  function stopTimers() {
    window.clearInterval(moveTimer);
    window.clearInterval(countdownTimer);
    window.clearTimeout(spawnTimer);

    moveTimer = null;
    countdownTimer = null;
    spawnTimer = null;
  }

  function startGame() {
    roundId++;
    stopTimers();

    if (duck) {
      duck.remove();
      duck = null;
    }

    score = 0;
    timeLeft = ROUND_SECONDS;
    active = true;

    scoreElement.textContent = "0";
    timeElement.textContent = `${timeLeft}s`;
    messageElement.textContent = "Bắt được 5 chú vịt trước khi hết giờ nhé!";

    startOverlay.classList.add("hidden");
    resultOverlay.classList.add("hidden");

    makeDuck();

    // Vịt đổi chỗ nhanh gấp đôi: 850ms -> 425ms.
    moveTimer = window.setInterval(moveDuck, 200);

    countdownTimer = window.setInterval(() => {
      if (!active) return;

      timeLeft--;
      timeElement.textContent = `${timeLeft}s`;

      if (timeLeft <= 5 && timeLeft > 0) {
        timeElement.style.color = "#d94747";
      }

      if (timeLeft <= 0) {
        finishGame(false);
      }
    }, 1000);
  }

  function finishGame(won) {
    if (!active) return;

    active = false;
    stopTimers();

    if (duck) {
      duck.remove();
      duck = null;
    }

    resultOverlay.classList.remove("hidden");

    if (won) {
      resultIcon.textContent = "🎉💌";
      resultTitle.textContent = "Bắt hết được rồi!";
      resultText.textContent =
        "Phần thưởng bí mật đã được mở khóa. " +
        

      resultButtons.innerHTML = `
        <button class="pixel-button" id="letter-button" type="button">
          MỞ LÁ THƯ 💌
        </button>
        <button class="pixel-button secondary" id="retry-button" type="button">
          CHƠI LẠI ↻
        </button>
      `;

      document.getElementById("letter-button").addEventListener("click", openLetter);
      document.getElementById("retry-button").addEventListener("click", startGame);
    } else {
      resultIcon.textContent = "⏰🦆";
      resultTitle.textContent = "Vịt chạy thoát mất rồi!";
      resultText.textContent =
        `Mới bắt được ${score}/${TARGET} chú thôi. ` +
        "Chú vịt cuối cùng nhanh hơn dự tính một chút nhỉ? Thử lại nhé!";

      resultButtons.innerHTML = `
        <button class="pixel-button" id="retry-button" type="button">
          THỬ LẠI NÀO! ↻
        </button>
      `;

      document.getElementById("retry-button").addEventListener("click", startGame);
    }
  }

  // Mở lá thư sau khi thắng.
  function openLetter() {
    const dialog = document.getElementById("result-dialog");

    dialog.innerHTML = `
      <div class="dialog-icon" aria-hidden="true">💌</div>

  


      <div class="letter"
           tabindex="0"
           aria-label="Lá thư chúc mừng, cuộn để đọc hết">

        <p class="letter-opening">
