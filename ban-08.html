<style>
:root {
  color-scheme: dark;
  --cream: #10132E;
  --rose: #F4C7E8;
  --deep-rose: #C9C4FF;

* {

}

body {

  place-items: center;

  isolation: isolate;

/* =========================
   NỀN TOÁN HỌC
========================= */

.math-background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: -1;
}

.math-symbol {
  position: absolute;
  color: var(--deep-rose);
  opacity: 0.22;

  font-weight: 600;
  user-select: none;
  will-change: transform;

  animation-delay: var(--delay, 0s);
}

@keyframes math-float {
  0% {
    transform: translate(0, 0) rotate(-12deg);
  }
  50% {
    transform: translate(18px, -28px) rotate(8deg);
  }
  100% {
    transform: translate(-14px, 20px) rotate(18deg);
  }
}

/* Thước kẻ bay */

.math-tool {
  position: fixed;
  z-index: -1;
  pointer-events: none;
  user-select: none;
  filter: drop-shadow(0 0 12px #C9C4FF20);
}

.ruler {
  top: 16%;
  left: 7%;
  font-size: clamp(38px, 5vw, 62px);
  transform-origin: center;
  animation: ruler-fly 9s ease-in-out infinite;
}

@keyframes ruler-fly {
  0%, 100% {
    transform: translate(0, 0) rotate(-24deg);
  }
  50% {
    transform: translate(30px, 45px) rotate(18deg);
  }
}

/* Bút chì bay */

.pencil {
  right: 7%;
  bottom: 15%;
  font-size: clamp(38px, 5vw, 62px);
  animation: pencil-fly 8s ease-in-out infinite;
}

@keyframes pencil-fly {
  0%, 100% {
    transform: translate(0, 0) rotate(35deg);
  }
  50% {
    transform: translate(-35px, -40px) rotate(-15deg);
  }
}

/* Một vài nét công thức trang trí */

.formula {

  z-index: -1;
  pointer-events: none;
  color: #C9C4FF;

  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(15px, 2vw, 23px);

}

.formula-one {

  bottom: 24%;

.formula-two {

}

@keyframes formula-drift {

}

/* Điện thoại */

@media (max-width: 480px) {
  body {
    padding: 14px 12px;

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    scroll-behavior: auto !important;
  }

  #sentence-text span {
    opacity: 1;
    filter: none;
  }
}
</style>
</head>

<!-- Nền toán học -->
<div class="math-background" id="math-background" aria-hidden="true"></div>

<!-- Thước kẻ và bút chì -->

<script>
/* =========================
   TẠO KÝ HIỆU TOÁN HỌC BAY
========================= */

const mathBackground = document.getElementById('math-background');

const symbols = [
  '+', '−', '×', '÷', '=', '≠',
  'π', '∞', '√', '∑', '∫', '∆',
  'α', 'β', 'θ', 'λ', 'φ', 'ω',
  'x²', 'y²', 'aⁿ', 'f(x)', '∂',
  '∈', '∩', '∪', '≤', '≥', '±'
];

const reduceMotion = window.matchMedia(
  '(prefers-reduced-motion: reduce)'
).matches;

// Tạo các ký hiệu ở vị trí ngẫu nhiên
for (let i = 0; i < 38; i++) {
  const symbol = document.createElement('span');

  symbol.className = 'math-symbol';
  symbol.textContent = symbols[
    Math.floor(Math.random() * symbols.length)
  ];

  symbol.style.left = `${Math.random() * 96}%`;
  symbol.style.top = `${Math.random() * 96}%`;

  symbol.style.fontSize =
    `${16 + Math.random() * 27}px`;

  symbol.style.setProperty(
    '--duration',
    `${7 + Math.random() * 12}s`
  );

  symbol.style.setProperty(
    '--delay',
    `${-Math.random() * 12}s`
  );

  mathBackground.appendChild(symbol);
}

/* =========================
   NỘI DUNG LÁ THƯ
========================= */

const sentences = [
  "Hế lô bạn Thùy Linh họ Thủy",

  "Không ngờ là ae mình biết nhau 3 năm rồi, mới ngày nào còn thấy bạn lầm lì ngồi giải đề mà giờ lúc nào cũng thấy líu lo như họa mi rồi.",

  "Nhân dịp 20/10, tui đại diện ae 12/10 chúc bạn luôn xinh đẹp, cười tươi và đạt được điều ước của bản thân, ít thì đậu nv1, nhiều thì cao lên tới 1m6=).",

  "Về phần tui, tui luôn cảm kích khi có một đứa bạn như bạn.",

  "Có những lúc tụi mình cãi nhau tóe lửa, có những lúc muốn nghỉ chơi ngang rứa, mà cuối cùng vẫn vậy, và thật sự là chưa bao giờ tui lì lợm với một đứa bạn như vậy.",

  "Có gặp khó khăn và trở ngại gì, hãy nhớ sau lưng mình luôn có những người sẵn sàng đỡ Linh dậy.",
  "Tuy tình bạn giữa tụi mình không phải là vô điều kiện như cái thứ tình cảm cha mẹ hay anh em dành cho nhau, nhưng tui chắc chắn sẽ ở đó khi Linh cần.",
  "Và nhớ là đừng có mà tự ti hay tự tin thái quá, mong là Linh biết nhìn nhận, đánh giá bản thân đúng cách để cải thiện bản thân, nhưng không đánh mất giá trị bản thân."
];

let currentSentence = 0;

const sentenceText = document.getElementById('sentence-text');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const sentenceCount = document.getElementById('sentence-count');

/* =========================
   HIỆU ỨNG HIỆN TỪNG KÝ TỰ
========================= */

function showSentence(index) {
  currentSentence = index;

  const text = sentences[currentSentence];
  sentenceText.replaceChildren();

  const reducedMotion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

  if (reducedMotion) {
    sentenceText.textContent = text;
  } else {
    [...text].forEach((char, i) => {
      const span = document.createElement('span');

      // Giữ khoảng trắng khi tách từng ký tự
      span.textContent = char === ' ' ? '\u00A0' : char;

      span.style.setProperty(
        '--delay',
        `${i * 0.025}s`
      );

      sentenceText.appendChild(span);
    });
  }

  // Cập nhật số thứ tự
  sentenceCount.textContent =
    `${currentSentence + 1} / ${sentences.length}`;

  // Khóa nút ở đầu và cuối thư
  prevBtn.disabled = currentSentence === 0;

  nextBtn.disabled =
    currentSentence === sentences.length - 1;
}

/* =========================
   ĐIỀU HƯỚNG CÂU CHÚC
========================= */

prevBtn.addEventListener('click', () => {
  if (currentSentence > 0) {
    showSentence(currentSentence - 1);
  }
});

nextBtn.addEventListener('click', () => {
  if (currentSentence < sentences.length - 1) {
    showSentence(currentSentence + 1);
  }
});

// Hiển thị câu đầu tiên
showSentence(0);
</script>

</body>
</html>
