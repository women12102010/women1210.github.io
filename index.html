<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F8F0E8">
  <meta name="description" content="gâu gâu gâu.">
  <title>Bá khi· 20.10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <span>20<i>·</i><10/span><span class="header-date">12 <i>/</i> 10</span>
    </header>
    <section class="letter-section" aria-labelledby="main-title">
      <h1 id="main-title"><em>Chúc Mừng Ngày Phụ Nữ 20/10</em></h1>

      <div class="envelope-scene" id="envelopeScene" aria-hidden="true">
        <div class="envelope">
          <div class="envelope-back"></div>
          <div class="letter-paper">
            <span class="paper-kicker"></span><span class="paper-heart">12/10</span><span class="paper-lines"></span>
          </div>
          <div class="envelope-front"></div>
          <div class="envelope-flap"></div>
          <div class="wax-seal"><span>12/10</span></div>
        </div>
      </div>

      <form class="code-form" id="codeForm" novalidate>
        <label for="secretCode">Nhập mã:</label>
        <input id="secretCode" name="secretCode" type="text" placeholder="Nhập mã của bạn..." autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="formMessage">
        <button id="openButton" type="submit"><span class="button-label">chị em 12/10 <span aria-hidden="true">mãi đỉnh</span></span><span class="button-loading" aria-hidden="true">Đang mở thư…</span></button>
      </form>
    </section>
    <footer class="site-footer"><span class="footer-rule"></span><p>October 20th</p></footer>
  </main>
  <div class="transition-screen" id="transitionScreen" aria-hidden="true"><p>chờ chút nhé, đang chuyển thư</p></div>
</body>
</html>
